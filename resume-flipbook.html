/* ===== 페이지 공통 (책 한 쪽 = 600 x 850) ===== */
:root{
  --navy:#1f2a5c; --blue:#2f5bd3; --sky:#eaf0fd; --sky2:#f5f8ff;
  --ink:#24262e; --sub:#5b6070; --line:#d9deea; --paper:#ffffff;
  --red:#c8463c; --redbg:#fdf1ef; --green:#2f8a5a; --greenbg:#eef8f2;
  --amber:#a86a12; --amberbg:#fdf6e9;
}
.pg{position:relative;width:600px;height:850px;background:var(--paper);overflow:hidden;
  font-family:'Gmarket Sans TTF','Noto Sans KR',sans-serif;color:var(--ink);font-weight:500;
  font-size:13.5px;line-height:1.75;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:break-word}
.pg *{box-sizing:border-box}
.rh{position:absolute;top:26px;left:52px;right:52px;display:flex;justify-content:space-between;
  font-size:10.5px;font-weight:300;color:#8a90a2;border-bottom:1px solid var(--line);padding-bottom:7px;line-height:1.3}
.pf{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:11px;font-weight:300;color:#8a90a2}
.pc{position:absolute;top:66px;bottom:58px;left:52px;right:52px;overflow:hidden}
.pc>*:first-child{margin-top:0}

/* 제목 */
.pc h2{font-size:21px;font-weight:700;color:var(--navy);line-height:1.4;margin:0 0 14px;letter-spacing:-0.02em}
.pc h2 .no{display:block;font-size:11px;font-weight:500;color:var(--blue);letter-spacing:0.06em;margin-bottom:4px}
.pc h3{font-size:15.5px;font-weight:700;color:var(--navy);margin:18px 0 6px;line-height:1.45}
.pc h4{font-size:13.5px;font-weight:700;color:var(--blue);margin:12px 0 4px}
.pc p{margin:0 0 10px}
.pc ul,.pc ol{margin:0 0 10px;padding-left:20px}
.pc li{margin-bottom:3px}
.pc b,.pc strong{font-weight:700;color:var(--navy)}
.pc .hl{background:linear-gradient(transparent 58%,#d7e3ff 58%);font-weight:700}
.pc .small{font-size:12px;color:var(--sub);font-weight:300}
.pc .lead{font-size:14.5px;color:var(--sub);font-weight:300;line-height:1.8}

/* 상자 */
.box{border:1px solid var(--line);background:var(--sky2);border-radius:8px;padding:12px 15px;margin:12px 0}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.box-label{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--blue);border-radius:3px;padding:2px 8px;margin-bottom:7px;line-height:1.5}
.box.interviewer{background:#fff;border:1.5px solid var(--navy)}
.box.interviewer .box-label{background:var(--navy)}
.box.key{background:var(--sky);border:none;border-left:4px solid var(--blue);border-radius:0 8px 8px 0}
.box.warn{background:var(--redbg);border-color:#f0cfc9}
.box.warn .box-label{background:var(--red)}
.box.tip{background:var(--greenbg);border-color:#cfe8da}
.box.tip .box-label{background:var(--green)}

/* 인용 */
.quote{font-size:17px;font-weight:700;color:var(--navy);line-height:1.6;border-left:4px solid var(--blue);padding:4px 0 4px 16px;margin:16px 0}
.quote small{display:block;font-size:11.5px;font-weight:300;color:var(--sub);margin-top:6px}

/* 표 */
.tbl{width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:12px;line-height:1.55}
.tbl th{background:var(--navy);color:#fff;font-weight:700;padding:7px 8px;text-align:left;border:1px solid var(--navy)}
.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--sky2)}

/* 단계 */
.steps{list-style:none;padding:0;margin:10px 0;counter-reset:st}
.steps li{position:relative;padding:2px 0 8px 40px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:27px;height:27px;border-radius:50%;
  background:var(--blue);color:#fff;font-weight:700;font-size:13px;text-align:center;line-height:28px}
.steps li b{display:block}

/* 비교(고치기 전/후) */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.compare.stack{grid-template-columns:1fr}
.compare>div{border-radius:8px;padding:11px 13px;font-size:12.3px;line-height:1.65}
.compare .bad{background:var(--redbg);border:1px solid #f0cfc9}
.compare .good{background:var(--greenbg);border:1px solid #cfe8da}
.compare .bad::before{content:'고치기 전';display:block;font-weight:700;color:var(--red);font-size:11px;margin-bottom:4px}
.compare .good::before{content:'고친 후';display:block;font-weight:700;color:var(--green);font-size:11px;margin-bottom:4px}

/* 예시 원고 */
.example{border:1px dashed #aab6d6;border-radius:8px;padding:12px 15px;margin:10px 0;font-size:12.5px;line-height:1.75;background:#fff}
.example .ex-label{display:block;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:5px}

/* 카드 그리드 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.cards.c3{grid-template-columns:1fr 1fr 1fr}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;background:#fff}
.card b{display:block;font-size:13px;margin-bottom:3px;color:var(--navy)}

/* 체크리스트(읽기용) */
.checks{list-style:none;padding:0;margin:8px 0}
.checks li{position:relative;padding-left:24px;margin-bottom:5px}
.checks li::before{content:'';position:absolute;left:2px;top:4px;width:13px;height:13px;border:1.5px solid var(--blue);border-radius:3px}

/* ===== 장 표지 (밝은 톤) ===== */
.pg.opener{background:linear-gradient(180deg,#f3f7ff 0%,#ffffff 62%)}
.pg.opener .rh,.pg.opener .pf{display:none}
.pg.opener .pc{top:0;bottom:0;left:0;right:0;padding:120px 60px 60px}
.pg.opener::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--blue)}
.opener .chap-no{font-size:13px;font-weight:700;letter-spacing:0.25em;color:var(--blue);margin-bottom:18px}
.opener h1{font-size:36px;font-weight:700;line-height:1.3;margin:0 0 22px;color:var(--navy);letter-spacing:-0.03em}
.opener .lead{color:var(--sub);font-size:14.5px;line-height:1.85;font-weight:300}
.opener .chap-list{list-style:none;padding:0;margin:36px 0 0;border-top:2px solid var(--navy)}
.opener .chap-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink);margin:0}
.opener .chap-bar{position:absolute;left:60px;bottom:60px;width:60px;height:4px;background:var(--blue)}

/* ===== 워크시트 ===== */
.ws-head{border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:12px}
.ws-tag{display:inline-block;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:3px;letter-spacing:.04em}
.ws-head h2{margin:7px 0 0}
.ws-guide{font-size:12px;color:var(--sub);font-weight:300;background:var(--sky2);border-radius:6px;padding:8px 12px;margin-bottom:12px;line-height:1.65}
.ws-q{font-weight:700;color:var(--navy);font-size:13px;margin:10px 0 4px}
.f{font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink);width:100%;border:1px solid #c5cde0;border-radius:5px;
  background:#fbfcff;padding:6px 9px;line-height:1.6;resize:none;outline:none;display:block}
.f:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 2px #dbe5ff}
textarea.f{min-height:52px}
input.f{height:30px}
.ws-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0 10px}
.ws-table th{background:var(--sky);color:var(--navy);font-weight:700;padding:6px;border:1px solid var(--line);text-align:center;line-height:1.4}
.ws-table td{border:1px solid var(--line);padding:3px;vertical-align:middle}
.ws-table td.lbl{background:var(--sky2);font-weight:700;color:var(--navy);padding:5px 7px;font-size:11.5px;line-height:1.45}
.ws-table .f{border:none;background:transparent;border-radius:0;padding:4px 6px}
.ws-table .f:focus{box-shadow:none;background:#f3f6ff}
.ws-check{list-style:none;padding:0;margin:6px 0}
.ws-check li{margin-bottom:5px}
.ws-check label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.ws-check input[type=checkbox]{width:15px;height:15px;margin:3px 0 0;accent-color:var(--blue);flex:none}
.scale{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--sub)}
.scale label{display:flex;align-items:center;gap:2px;cursor:pointer}
.scale input{accent-color:var(--blue);margin:0}
.lines{border-bottom:1px solid #c5cde0;height:26px}

/* 이론 노트 */
.box.theory{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:0 0 8px 8px}
.box.theory .box-label{background:var(--navy)}
.src{font-size:11px;color:#8a90a2;font-weight:300;margin-top:8px;line-height:1.5}

/* ===== 화면 틀 ===== */
html,body{margin:0;height:100%;background:#eef1f7;font-family:'Gmarket Sans TTF','Noto Sans KR',sans-serif;color:#24262e}
*{box-sizing:border-box}
.bar{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid #d9deea;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:20}
.bar .ttl{font-weight:700;color:#1f2a5c;font-size:15px;white-space:nowrap;margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{font-weight:300;color:#5b6070;font-size:12px;margin-left:8px}

<div class="page"><div class="pg"><div class="rh"><span>머리말</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>면접관석에서 본 장면</h2>
<p>면접장 문이 열리고 지원자가 들어옵니다. 저는 그 사람의 얼굴보다 먼저 책상 위에 놓인 자기소개서를 봅니다. 미리 읽으며 밑줄을 그어 둔 문장, 여백에 적어 둔 질문 두세 개가 그 종이 위에 있습니다.</p>
<p>"동아리에서 갈등을 조율했다고 쓰셨는데, 구체적으로 어떤 갈등이었나요?" 첫 질문을 던지면 지원자의 표정이 굳는 경우가 많습니다. 자기가 쓴 문장인데도 그 장면을 떠올리지 못하는 것입니다. 남의 글을 빌려 왔거나, 그럴듯한 말을 이어 붙였기 때문입니다.</p>
<p>반대로 짧고 투박하게 썼어도 자기 경험을 정확히 적은 지원자는 다릅니다. 어떤 질문을 받아도 그때의 상황과 자기가 한 행동을 술술 풀어냅니다. 면접관은 그 순간 <span class="hl">이 사람의 서류는 진짜</span>라고 판단합니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 기업 채용 면접관으로 앉을 때마다 같은 생각을 합니다. 탈락한 지원자 중 상당수는 능력이 없어서가 아니라, 자기가 가진 것을 회사의 언어로 옮기지 못해서 떨어졌다는 것입니다.</p></div>
<h3>왜 이 책을 썼는가</h3>
<p>저는 면접관으로 지원자를 평가하고, 대학 취업교과목 교수로 학생들을 가르치고, 취업 컨설턴트로 한 사람 한 사람의 서류를 함께 고쳐 왔습니다. 세 자리에서 본 문제는 놀랍도록 같았습니다. 학생들은 자기소개서를 '글쓰기 시험'으로 여기고, 첫 문장부터 고민하다 지쳐 버립니다.</p></div><div class="pf">5</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>머리말</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><p>하지만 자기소개서는 글솜씨로 승부하는 문서가 아닙니다. <b>나를 분석하고, 직무와 기업을 분석하고, 그 사이를 경험으로 연결하는 문서</b>입니다. 분석이 끝나면 문장은 생각보다 쉽게 나옵니다. 이 순서를 제 강의실에서처럼 차근차근 따라갈 수 있도록 이 책을 썼습니다.</p>
<h3>이 책이 다른 점</h3>
<div class="cards">
<div class="card"><b>분석부터 작성까지 한 흐름</b>자기분석, 직무분석, 기업분석, 경험 정리, 문항별 작성, 퇴고와 면접 연결까지 한 권 안에서 이어집니다. 앞 장의 결과가 다음 장의 재료가 됩니다.</div>
<div class="card"><b>직접 쓰는 워크시트</b>읽기만 하는 책이 아닙니다. 장마다 워크시트가 있고, 칸을 채우다 보면 자기소개서의 초안이 저절로 모입니다.</div>
<div class="card"><b>면접관의 시선</b>평가하는 사람이 어디에 밑줄을 긋고 어디서 고개를 갸웃하는지, 현장에서 본 그대로 적었습니다.</div>
<div class="card"><b>고치기 전과 후</b>추상적인 조언 대신, 실제 학생 원고를 바탕으로 만든 예문을 어떻게 고치는지 보여 드립니다.</div>
</div>
<p>이 책을 덮을 때 여러분 손에는 잘 쓴 남의 예문이 아니라, <span class="hl">자기 경험으로 만든 자기소개서와 면접 대비 노트</span>가 남아 있기를 바랍니다. 서류는 결국 나를 처음 만나는 사람에게 건네는 첫인사입니다. 그 첫인사를 자신 있게 건넬 수 있도록 끝까지 곁에서 돕겠습니다.</p>
<div class="quote">자기소개서는 잘 쓴 글이 아니라,<br>나를 정확히 보여 주는 글입니다.</div>
<p><b>이미영</b><br><span class="small">CNP교육컨설팅 대표</span></p></div><div class="pf">6</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>이 책 사용법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>이 책 사용법</h2>
<p>이 책은 여덟 개의 PART가 <b>분석, 재료 정리, 작성, 점검</b>의 순서로 이어집니다. 건너뛰지 말고 앞에서부터 따라오세요.</p>
<ol class="steps">
<li><b>PART 1 면접관의 시선</b>채용이 어떻게 진행되고 서류가 어떻게 읽히는지 이해합니다.</li>
<li><b>PART 2~4 분석</b>자기분석, 직무분석, 기업분석으로 나와 회사를 각각 들여다봅니다.</li>
<li><b>PART 5 재료 정리</b>흩어진 경험을 STAR 구조의 이야기로 정리해 재료 창고를 채웁니다.</li>
<li><b>PART 6~7 작성</b>자기소개서 작성 원리를 익히고, 문항별로 실제 원고를 씁니다.</li>
<li><b>PART 8 점검</b>퇴고하고 점검표로 확인한 뒤, 면접 질문으로 연결합니다.</li>
</ol>
<div class="box tip"><span class="box-label">워크시트 저장</span>
<p>워크시트 칸에 입력한 내용은 <b>지금 쓰는 기기의 브라우저에 자동으로 저장</b>됩니다. 다른 기기나 다른 브라우저에서는 보이지 않으니 한 기기에서 이어서 쓰세요. 브라우저 기록을 지우면 내용도 사라질 수 있으니 중요한 원고는 따로 옮겨 두세요.</p></div>
<div class="cards">
<div class="card"><b>수업에서 쓸 때</b>한 주에 한 PART씩 진행합니다. 수업 시간에는 개념과 예문을 함께 보고, 워크시트는 과제로 채운 뒤 다음 시간에 짝과 바꿔 읽으며 피드백합니다.</div>
<div class="card"><b>혼자 쓸 때</b>하루 한두 쪽씩 읽고 워크시트를 바로 채웁니다. 다 채우지 못한 칸은 비워 두고 넘어갔다가, 경험이 떠오를 때 다시 돌아와 채우세요.</div>
</div></div><div class="pf">7</div></div></div>
<div class="page"><div class="pg opener"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 1</div>
<h1>면접관은 서류를<br>이렇게 읽는다</h1>
<p class="lead">자기소개서를 쓰기 전에 먼저 알아야 할 것은 읽는 사람입니다. 채용이 어떤 단계로 진행되고, 평가자가 서류에서 무엇을 찾는지 알면 무엇을 써야 할지가 보입니다.</p>
<ul class="chap-list"><li>01 채용 절차와 채용 방식, 블라인드·NCS 채용</li><li>02 평가자가 서류를 읽는 방식과 평가 기준</li><li>03 이론 노트: 적합성, 신호, 구조화 면접</li><li>04 분석이 합격을 가르는 이유와 준비 설계도</li><li>05 로드맵·12주 계획과 준비 현황 진단</li><li>06 공기업과 사기업의 이해, 나의 선택</li></ul>
<div class="chap-bar"></div></div><div class="pf">8</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-1</span>채용 절차 한눈에 보기</h2>
<p>회사마다 이름은 다르지만, 신입 채용은 대체로 비슷한 길을 거칩니다. 각 단계는 지원자를 다른 각도에서 확인하는 관문입니다.</p>
<ol class="steps">
<li><b>서류전형</b>입사지원서와 자기소개서로 기본 요건과 직무 적합성을 봅니다. 가장 많은 인원이 이 단계에서 걸러집니다.</li>
<li><b>인적성검사·필기전형</b>인성검사, 직무 적성검사, 공기업의 경우 NCS 직업기초능력 시험과 전공 시험 등이 치러집니다.</li>
<li><b>면접전형</b>실무진 면접과 임원 면접으로 나뉘는 경우가 많습니다. 토론, 발표, 상황 면접이 함께 진행되기도 합니다.</li>
<li><b>최종 합격과 입사</b>채용 검진, 서류 확인 등을 거쳐 입사합니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>많은 학생이 서류를 '통과만 하면 끝나는 단계'로 생각합니다. 그런데 제가 면접장에서 가장 먼저 펼치는 것이 바로 그 서류입니다. 서류는 첫 관문이자, 면접 내내 따라다니는 기록입니다.</p></div>
<div class="box key"><span class="box-label">핵심</span>
<p>자기소개서는 서류전형에서 한 번, 면접에서 또 한 번 읽힙니다. 처음부터 <b>면접에서 설명할 수 있는 내용만</b> 쓰세요.</p></div></div><div class="pf">9</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-2</span>공채, 수시, 상시 채용</h2>
<p>요즘 채용은 한 가지 방식만 있지 않습니다. 어떤 방식으로 뽑느냐에 따라 준비하는 방법도 달라집니다.</p>
<table class="tbl">
<tr><th style="width:20%">방식</th><th>특징</th><th style="width:34%">준비 포인트</th></tr>
<tr><td><b>정기 공채</b></td><td>정해진 시기에 여러 직무를 한꺼번에 뽑습니다. 공기업과 일부 대기업이 유지하고 있습니다.</td><td>일정을 미리 확인하고 공통 문항을 준비해 둡니다.</td></tr>
<tr><td><b>수시 채용</b></td><td>부서에 사람이 필요할 때 직무 단위로 공고를 냅니다. 직무 설명이 구체적입니다.</td><td>공고의 담당 업무와 자격 요건을 문장 단위로 분석합니다.</td></tr>
<tr><td><b>상시 채용</b></td><td>공고를 열어 두고 지원이 들어오는 대로 검토합니다.</td><td>준비가 되는 대로 빨리 지원하는 것이 유리합니다.</td></tr>
</table>
<p>수시 채용이 늘면서 가장 크게 달라진 점은 <span class="hl">'어느 회사'보다 '어떤 일'을 먼저 묻는다</span>는 것입니다. 회사 이름만 바꿔 같은 자기소개서를 돌려 쓰는 방식은 더 이상 통하지 않습니다.</p>
<div class="example"><span class="ex-label">지민(경영학과 4학년)의 경우</span>
지민은 "마케팅"이라는 큰 이름만 보고 여러 회사에 같은 서류를 냈습니다. 공고를 다시 읽어 보니 한 곳은 데이터 분석, 다른 곳은 온라인 판매 운영 업무였습니다. 같은 이름의 직무라도 하는 일이 달랐던 것입니다.</div>
<div class="box tip"><span class="box-label">팁</span>
<p>관심 기업의 채용 페이지와 공식 채용 채널을 미리 확인해 두면 수시 공고를 놓치지 않습니다. 공기업과 사기업의 채용 차이는 1-19부터 따로 다룹니다.</p></div></div><div class="pf">10</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-3</span>블라인드 채용과 NCS가 바꾼 것</h2>
<p>블라인드 채용은 출신 학교, 가족 관계, 사진처럼 직무와 관계없는 정보를 지원서에서 빼고 평가하는 방식입니다. 공공기관을 중심으로 자리 잡았고, 민간 기업도 비슷한 원칙을 따르는 곳이 많아졌습니다.</p>
<p>NCS(국가직무능력표준) 기반 채용은 직무에 필요한 지식, 기술, 태도를 기준으로 사람을 뽑는 방식입니다. 공고에 직무기술서가 붙고, 지원서에는 교육 사항과 경험·경력 사항을 직무와 연결해 적게 됩니다.</p>
<h3>그래서 무엇이 달라졌나</h3>
<div class="compare"><div class="bad">학교 이름, 학점, 자격증 개수만 보고도 어느 정도 판단할 수 있었습니다.</div><div class="good">가려진 정보 대신 <b>무엇을 배우고 어떤 경험을 했는지</b>를 직무 기준으로 봅니다.</div></div>
<p>정리하면 <span class="hl">자기소개서와 경험 기술서의 비중이 커졌습니다.</span> 스펙을 가린 자리에 남는 것은 결국 지원자가 쓴 문장입니다.</p>
<div class="box warn"><span class="box-label">주의</span>
<p>블라인드 채용에서는 학교명, 지역, 가족 직업 등 개인을 알아볼 수 있는 정보를 자기소개서에 쓰면 감점되거나 불이익을 받을 수 있습니다. "○○대학교 학생회장"은 "학과 학생회장"처럼 바꿔 쓰세요.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>블라인드 평가표를 받아 들면 제 눈은 자연스럽게 경험 칸으로 갑니다. 그 사람을 판단할 단서가 거기밖에 없기 때문입니다.</p></div></div><div class="pf">11</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-4</span>평가자는 서류를 이렇게 읽는다</h2>
<p>서류 평가 기간이 되면 평가자 한 사람 앞에 많은 지원서가 쌓입니다. 저 역시 평가위원으로 앉으면 정해진 시간 안에 상당한 분량을 읽어야 했습니다. 그러다 보니 한 편을 처음부터 끝까지 정독하기보다 <b>먼저 훑고, 눈에 걸리는 곳에서 멈추는</b> 방식으로 읽게 됩니다.</p>
<h3>평가자의 눈이 머무는 곳</h3>
<ol class="steps">
<li><b>소제목</b>이 문항에서 무엇을 말하려는지 한 줄로 파악합니다.</li>
<li><b>첫 문장</b>질문에 대한 답이 바로 나오는지 봅니다. 성장 배경이나 명언으로 시작하면 다음 문단으로 넘어갑니다.</li>
<li><b>숫자와 행동</b>결과가 구체적인지, 내가 한 일이 분명한지 확인합니다.</li>
<li><b>마지막 문장</b>그 경험이 지원 직무와 어떻게 이어지는지 봅니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>솔직히 말씀드리면 첫 문단에서 무엇을 말하려는지 보이지 않는 서류는 끝까지 집중해서 읽기 어렵습니다.</p></div>
<div class="box key"><span class="box-label">핵심</span>
<p>소제목과 첫 문장만 읽어도 내용이 전달되게 쓰세요. <span class="hl">결론을 먼저, 근거는 뒤에</span> 놓는 두괄식이 기본입니다.</p></div></div><div class="pf">12</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-5</span>평가 기준 세 가지</h2>
<p>회사마다 평가표의 항목 이름은 다르지만, 제가 여러 평가표를 받아 보며 정리한 기준은 결국 세 가지로 모입니다.</p>
<div class="cards c3">
<div class="card"><b>직무적합성</b>이 일을 할 수 있는가. 필요한 지식, 기술, 경험을 갖추었는가.</div>
<div class="card"><b>조직적합성</b>우리와 함께 일할 수 있는가. 회사의 가치와 일하는 방식에 맞는가.</div>
<div class="card"><b>성장가능성</b>앞으로 더 잘하게 될 사람인가. 배우고 고치는 힘이 있는가.</div>
</div>
<h3>세 기준은 문장으로 드러난다</h3>
<table class="tbl">
<tr><th style="width:24%">기준</th><th>평가자가 찾는 문장</th></tr>
<tr><td><b>직무적합성</b></td><td>"생산 공정 수업에서 배운 불량 분석 방법으로 팀 과제의 오류 원인을 찾았습니다."</td></tr>
<tr><td><b>조직적합성</b></td><td>"의견이 갈렸을 때 각자 근거를 표로 정리해 합의점을 찾았습니다."</td></tr>
<tr><td><b>성장가능성</b></td><td>"첫 발표에서 지적받은 부분을 기록해 두고 다음 발표 전에 세 번 연습했습니다."</td></tr>
</table>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>신입에게 직무 경험이 많지 않다는 것은 평가자도 압니다. 그래서 신입 서류에서는 성장가능성을 보여 주는 장면이 생각보다 큰 힘을 가집니다.</p></div>
<div class="box key"><span class="box-label">핵심</span>
<p>한 편의 자기소개서 안에서 세 기준이 모두 한 번 이상 드러나는지 확인하세요.</p></div></div><div class="pf">13</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-6</span>이론 노트: 개인-직무 적합성과 개인-조직 적합성</h2>
<p>앞에서 본 직무적합성과 조직적합성은 채용 현장에서 만든 말이 아닙니다. 산업·조직심리학이 오래 연구해 온 <b>적합성(fit)</b> 개념이 평가표의 언어로 옮겨진 것입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>개인-직무 적합성(P-J fit)</b> 개인이 가진 지식·기술·능력이 직무의 요구와 맞는 정도(요구-능력 적합), 그리고 직무가 주는 것이 개인이 원하는 것과 맞는 정도(욕구-공급 적합)를 말합니다.</p>
<p><b>개인-조직 적합성(P-O fit)</b> 개인의 가치·목표·성격이 조직의 문화·가치와 맞는 정도입니다. 조직과 닮아서 맞는 유사 적합과, 조직에 부족한 것을 채워서 맞는 보완 적합으로 나누어 설명합니다.</p></div>
<h3>평가자의 질문으로 바꾸면</h3>
<table class="tbl">
<tr><th style="width:22%">적합성</th><th style="width:34%">평가자의 속 질문</th><th>서류에 보여 줄 것</th></tr>
<tr><td><b>요구-능력</b></td><td>이 일을 해낼 수 있는가</td><td>직무가 요구하는 능력을 써 본 경험</td></tr>
<tr><td><b>욕구-공급</b></td><td>이 일을 오래 하고 싶어 할까</td><td>이 직무를 원하는 구체적 이유</td></tr>
<tr><td><b>개인-조직</b></td><td>우리와 같은 방식으로 일할까</td><td>조직의 가치와 닮은 나의 선택과 행동</td></tr>
</table>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>제가 "왜 하필 이 일입니까"를 꼭 묻는 이유가 욕구-공급 적합입니다. 능력은 맞는데 원하는 것이 다른 신입은 일찍 떠난다는 것을 회사는 경험으로 압니다.</p></div>
<p class="src">출처: Edwards, J. R., Person-job fit (1991) / Kristof, A. L., Person-organization fit (1996), Personnel Psychology</p></div><div class="pf">14</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-7</span>이론 노트: 서류는 신호다</h2>
<p>채용은 정보가 한쪽으로 기운 만남입니다. 지원자는 자기 능력을 알지만 회사는 모릅니다. 경제학자 마이클 스펜스는 이런 상황에서 정보를 가진 쪽이 상대가 볼 수 있는 <b>신호</b>를 보내 자신을 알린다고 설명했습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>신호 이론(signaling theory)</b> 정보 비대칭 상황에서 한쪽이 관찰 가능한 자격이나 행동으로 자기 특성을 알리는 것을 말합니다. 신호가 믿을 만하려면 만드는 데 시간과 노력이 들어서, 그 특성이 없는 사람은 흉내 내기 어려워야 합니다. 스펜스가 든 대표적인 예는 학력이었습니다.</p></div>
<h3>강한 신호와 약한 신호</h3>
<div class="compare">
<div class="bad">저는 꼼꼼하고 책임감이 강한 사람입니다. 맡은 일은 끝까지 해냅니다.</div>
<div class="good">학과 행사 예산 장부를 1년간 맡아 매주 영수증과 대조했고, 학기 말 결산 감사에서 수정 요청 없이 마감했습니다.</div>
</div>
<p>왼쪽 문장은 누구나 공짜로 쓸 수 있습니다. 오른쪽은 1년의 시간과 반복된 행동이 들어 있어 흉내 내기 어렵습니다. 평가자에게 <span class="hl">비용이 든 문장만 신호로 읽힙니다.</span></p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>블라인드 채용으로 학교 이름이라는 신호가 가려지자, 제 눈은 더 오래 경험 문장에 머물게 되었습니다. 형용사는 지나치고, 시간과 노력이 들어간 흔적에 밑줄을 긋습니다.</p></div>
<p class="src">출처: Spence, M., Job Market Signaling, Quarterly Journal of Economics (1973)</p></div><div class="pf">15</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-8</span>이론 노트: 구조화 면접과 역량 기반 평가</h2>
<p>요즘 면접은 면접관 마음대로 묻는 대화가 아닙니다. 많은 기업과 공공기관이 미리 정한 역량, 질문, 채점 기준으로 모든 지원자를 같은 방식으로 평가합니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>역량 기반 평가</b> 심리학자 맥클리랜드는 지능검사 점수보다 실제 직무 성과와 이어지는 행동 특성, 즉 역량을 보아야 한다고 주장했습니다.</p>
<p><b>구조화 면접</b> 직무 분석으로 정한 역량을 바탕으로 같은 질문과 같은 채점 기준을 적용하는 면접입니다. 과거 행동을 묻는 경험 면접과 가상 상황을 주는 상황 면접이 대표적입니다. 선발 도구 연구를 종합한 메타분석에서 구조화 면접은 비구조화 면접보다 직무 성과를 더 잘 예측하는 것으로 보고되었습니다.</p></div>
<h3>서류에 주는 의미</h3>
<ol class="steps">
<li><b>역량 단위로 쓴다</b>평가표는 역량 이름으로 칸이 나뉩니다. 한 문단에는 한 역량만 담으세요.</li>
<li><b>과거 행동으로 증명한다</b>"하겠습니다"보다 "그때 이렇게 했습니다"가 점수가 됩니다.</li>
<li><b>상황, 행동, 결과를 모두 쓴다</b>하나라도 빠지면 채점 근거가 사라집니다. PART 5의 STAR 구조입니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>제가 받아 본 구조화 면접 평가표에는 역량마다 확인할 행동이 적혀 있었습니다. 서류에 그 행동이 보이면 면접 질문은 그 장면을 확인하는 쪽으로 갑니다.</p></div>
<p class="src">출처: McClelland, D. C., Testing for competence rather than for "intelligence" (1973) / Schmidt, F. L. &amp; Hunter, J. E., Psychological Bulletin (1998)</p></div><div class="pf">16</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-9</span>합격 서류와 탈락 서류의 차이</h2>
<p>합격 서류가 특별한 경험을 담고 있는 것은 아닙니다. 같은 경험이라도 <b>어떻게 쓰느냐</b>에서 차이가 납니다. 기계공학과 준호의 지원동기를 보겠습니다.</p>
<div class="compare stack">
<div class="bad">어릴 때부터 기계를 좋아했고, 세계적인 기업인 귀사에서 꿈을 펼치고 싶어 지원했습니다. 입사하게 된다면 열정과 성실함으로 최선을 다하겠습니다.</div>
<div class="good">설계 프로젝트에서 부품 공차를 잘못 잡아 시제품이 조립되지 않았던 경험이 있습니다. 그때 도면 단계의 작은 오차가 생산 비용으로 이어진다는 것을 배웠고, 이후 검토 목록을 만들어 팀 과제에 적용했습니다. 생산기술 직무에서 공정 문제를 설계 단계부터 줄이는 일을 하고 싶어 지원했습니다.</div>
</div>
<table class="tbl">
<tr><th style="width:50%">탈락 서류</th><th>합격 서류</th></tr>
<tr><td>어느 회사에 내도 되는 문장</td><td>이 직무에만 해당하는 문장</td></tr>
<tr><td>형용사로 나를 설명함</td><td>행동과 결과로 나를 보여 줌</td></tr>
<tr><td>"최선을 다하겠습니다"로 끝남</td><td>입사 후 할 일이 구체적임</td></tr>
<tr><td>질문과 다른 이야기가 길게 나옴</td><td>첫 문장에서 질문에 답함</td></tr>
</table>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>고치기 전 문장은 회사 이름만 바꾸면 어디에나 낼 수 있습니다. 평가자는 그 사실을 첫 줄에서 알아챕니다.</p></div></div><div class="pf">17</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-10</span>자기소개서는 면접 대본이다</h2>
<p>면접관은 질문을 허공에서 만들지 않습니다. 대부분 지원자의 서류에서 뽑습니다. 저도 면접 전에 서류를 읽으며 궁금한 문장에 표시를 하고, 그 옆에 질문을 적어 둡니다.</p>
<div class="example"><span class="ex-label">서연(간호학과 4학년)의 자기소개서 한 줄</span>
"실습 중 환자 보호자의 불만을 경청하고 응대하여 신뢰를 얻었습니다."</div>
<h3>이 한 줄에서 나오는 질문</h3>
<ul class="checks">
<li>보호자가 불만을 가진 이유는 무엇이었나요?</li>
<li>경청했다는 것은 구체적으로 어떻게 했다는 뜻인가요?</li>
<li>신뢰를 얻었다는 것은 무엇으로 알 수 있었나요?</li>
<li>같은 상황이 다시 온다면 무엇을 다르게 하겠습니까?</li>
</ul>
<p>한 문장에서 꼬리 질문이 네 개나 나옵니다. 서연이 이 질문에 막힘없이 답할 수 있다면 이 문장은 강력한 무기가 됩니다. 답할 수 없다면 <span class="hl">스스로 판 함정</span>이 됩니다.</p>
<div class="box warn"><span class="box-label">주의</span>
<p>부풀린 성과, 다른 사람이 한 일, 기억나지 않는 경험은 쓰지 마세요. 꼬리 질문 두세 번이면 드러납니다.</p></div>
<div class="box key"><span class="box-label">핵심</span>
<p>한 문장을 쓸 때마다 "이걸 물어보면 3분 동안 이야기할 수 있는가"를 스스로 확인하세요.</p></div></div><div class="pf">18</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-11</span>회사가 신입에게 진짜 원하는 것</h2>
<p>학생들은 회사가 '완성된 인재'를 원한다고 생각합니다. 그래서 자기소개서에 전문가처럼 보이는 말을 늘어놓습니다. 하지만 신입을 뽑는 자리에서 면접관들이 나누는 대화는 조금 다릅니다.</p>
<div class="quote">"일은 들어와서 가르치면 됩니다.<br>가르칠 수 있는 사람인지가 중요하죠."<small>신입 채용 평가 회의에서 자주 오가는 말</small></div>
<h3>신입에게 기대하는 네 가지</h3>
<div class="cards">
<div class="card"><b>기본기</b>전공 기초, 문서 작성, 약속 지키기처럼 일의 바탕이 되는 힘</div>
<div class="card"><b>배우는 태도</b>모르는 것을 묻고, 피드백을 받아들여 고치는 자세</div>
<div class="card"><b>함께 일하는 힘</b>자기 몫을 해내고, 동료와 정보를 나누는 습관</div>
<div class="card"><b>직무에 대한 이해</b>이 일이 실제로 무엇을 하는지 알고 지원했다는 증거</div>
</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"입사하면 바로 성과를 내겠습니다"라는 말보다 "처음 석 달은 이런 것부터 익히겠습니다"라는 말이 더 믿음직합니다. 일을 아는 사람만 할 수 있는 말이기 때문입니다.</p></div>
<p>거창한 포부보다 <span class="hl">구체적인 준비와 현실적인 계획</span>이 신입의 서류를 빛나게 합니다.</p></div><div class="pf">19</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-12</span>왜 분석이 합격을 가르는가</h2>
<p>수업 첫 과제로 자기소개서를 받아 보면, 같은 경험을 써도 점수가 크게 갈립니다. 차이는 문장력이 아니라 <b>쓰기 전에 무엇을 알고 있었느냐</b>입니다. 지민이 영업관리 직무에 쓴 두 원고를 보겠습니다.</p>
<div class="compare stack">
<div class="bad">학회 활동을 통해 리더십과 소통 능력을 길렀습니다. 다양한 의견을 조율하며 팀을 이끌었고, 이 역량을 바탕으로 귀사의 영업관리 직무에서 최선을 다하겠습니다.</div>
<div class="good">영업관리는 대리점별 실적을 보고 원인을 찾아 지원책을 내는 일이라고 이해했습니다. 학회에서 회원 이탈이 늘자 출석 기록을 분석해 모임 시간을 바꿨고, 다음 학기 이탈 인원이 12명에서 5명으로 줄었습니다. 숫자에서 원인을 찾고 현장에 맞는 해법을 내는 방식으로 대리점을 관리하겠습니다.</div>
</div>
<table class="tbl">
<tr><th style="width:26%">분석</th><th>고친 후 원고에 들어간 것</th></tr>
<tr><td><b>직무분석</b></td><td>영업관리를 '실적에서 원인을 찾아 지원하는 일'로 정의</td></tr>
<tr><td><b>자기분석</b></td><td>막연한 리더십 대신 '숫자로 원인 찾기' 경험을 고름</td></tr>
<tr><td><b>연결</b></td><td>경험 속 일하는 방식이 입사 후 일하는 방식으로 이어짐</td></tr>
</table>
<div class="box key"><span class="box-label">핵심</span>
<p>문장은 분석의 결과물입니다. 글이 막히면 문장을 붙잡지 말고 <span class="hl">분석으로 돌아가세요.</span></p></div></div><div class="pf">20</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-13</span>스펙보다 연결이 중요한 이유</h2>
<p>상담을 하다 보면 "저는 내세울 스펙이 없어요"라는 말을 자주 듣습니다. 그런데 서류를 함께 펼쳐 보면 재료가 없는 것이 아니라, <b>재료와 직무를 잇는 선이 없는</b> 경우가 대부분입니다.</p>
<div class="compare">
<div class="bad">카페 아르바이트 1년. 성실하게 근무했습니다.</div>
<div class="good">카페 아르바이트에서 재고 기록 방식을 바꿔 발주 누락을 줄였습니다. 이 경험은 영업관리 직무의 재고·주문 관리와 이어집니다.</div>
</div>
<p>같은 아르바이트라도 지원 직무와 연결하는 순간 의미가 달라집니다. 반대로 자격증이 많아도 직무와 이어지지 않으면 평가자에게는 목록에 불과합니다.</p>
<h3>연결의 세 단계</h3>
<ol class="steps">
<li><b>직무가 요구하는 능력 찾기</b>공고와 직무기술서에서 필요한 능력을 뽑습니다. (PART 3)</li>
<li><b>그 능력을 보여 준 내 경험 찾기</b>자기분석에서 꺼낸 장면 중 맞는 것을 고릅니다. (PART 2, 5)</li>
<li><b>둘을 한 문장으로 잇기</b>"이 경험에서 얻은 OO 능력으로 OO 업무를 하겠다"로 마무리합니다. (PART 6, 7)</li>
</ol>
<div class="box key"><span class="box-label">핵심</span>
<p>평가자가 보는 것은 스펙의 양이 아니라 <span class="hl">스펙과 직무 사이의 연결선</span>입니다.</p></div></div><div class="pf">21</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-14</span>취업 준비의 전체 설계도</h2>
<p>집을 지을 때 벽지부터 고르는 사람은 없습니다. 그런데 자기소개서를 쓰는 학생 대부분은 첫 문장, 즉 벽지부터 고릅니다. 그래서 저는 수업 첫 주에 칠판에 네 칸을 그리고 시작합니다.</p>
<ol class="steps">
<li><b>분석: 무엇을 보여 줄지 정한다</b>나(PART 2), 직무(PART 3), 기업(PART 4)을 들여다봅니다. 결과물은 강점 목록, 직무 역량표, 기업 분석표입니다.</li>
<li><b>재료: 보여 줄 증거를 모은다</b>경험을 꺼내 STAR 구조로 정리하고 역량별로 나눕니다(PART 5). 결과물은 경험 재료 창고입니다.</li>
<li><b>작성: 문항에 맞게 짓는다</b>문항이 묻는 것을 해석하고 재료를 골라 원고로 만듭니다(PART 6, 7). 결과물은 문항별 초안입니다.</li>
<li><b>점검: 제출과 면접에 대비한다</b>퇴고하고 점검표로 확인한 뒤 예상 질문을 뽑습니다(PART 8). 결과물은 제출본과 면접 노트입니다.</li>
</ol>
<div class="box key"><span class="box-label">핵심</span>
<p>앞 단계의 결과물이 다음 단계의 재료가 됩니다. 한 칸을 건너뛰면 그 빈자리는 반드시 <span class="hl">뒤 단계에서 막힘</span>으로 나타납니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>분석을 건너뛴 흔적은 지원동기에서 가장 잘 보입니다. 회사 소개 문구를 옮겨 놓고 각오로 끝나는 글은 첫 칸을 비워 둔 채 지은 집입니다.</p></div></div><div class="pf">22</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-15</span>막히는 곳에서 설계도를 펼쳐라</h2>
<p>자기소개서를 쓰다 막히는 증상은 대개 앞 단계 중 하나가 비어 있다는 신호입니다. 상담에서 자주 듣는 하소연을 설계도에 대어 보면 돌아갈 곳이 보입니다.</p>
<table class="tbl">
<tr><th style="width:32%">막히는 증상</th><th>실제로 빠진 것</th><th style="width:17%">돌아갈 곳</th></tr>
<tr><td>"첫 문장이 안 써져요"</td><td>문항에 쓸 경험이 정해지지 않음</td><td>PART 5</td></tr>
<tr><td>"쓸 경험이 없어요"</td><td>경험 목록을 만들어 본 적이 없음</td><td>PART 2, 5</td></tr>
<tr><td>"지원동기가 다 비슷해요"</td><td>직무와 기업을 구분해 보지 않음</td><td>PART 3, 4</td></tr>
<tr><td>"글자 수가 안 맞아요"</td><td>문항 해석과 구성 설계가 없음</td><td>PART 6, 7</td></tr>
<tr><td>"면접에서 말이 막혀요"</td><td>꼬리 질문 점검을 하지 않음</td><td>PART 8</td></tr>
</table>
<div class="example"><span class="ex-label">준호(기계공학과 4학년)의 경우</span>
준호는 3주 동안 지원동기 첫 문단만 고쳐 썼습니다. 설계도를 펼쳐 직무분석부터 다시 하자 생산기술 직무가 요구하는 것이 '공정 문제를 설계 단계에서 줄이는 일'이라는 것이 보였고, 쓸 경험으로 설계 프로젝트를 고를 수 있었습니다. 초안은 이틀 만에 나왔습니다.</div>
<div class="box tip"><span class="box-label">팁</span>
<p>저는 전체 준비 시간의 절반 이상을 분석과 재료 정리에 쓰라고 권합니다. 앞이 탄탄하면 작성은 생각보다 빨리 끝납니다.</p></div></div><div class="pf">23</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-16</span>학년별 취업 준비 로드맵</h2>
<p>취업 준비는 4학년 2학기에 시작하는 일이 아닙니다. 학년마다 해야 할 일을 나누면 부담이 줄고, 자기소개서에 쓸 재료도 자연스럽게 쌓입니다.</p>
<table class="tbl">
<tr><th style="width:16%">학년</th><th style="width:28%">목표</th><th>할 일</th></tr>
<tr><td><b>1학년</b></td><td>탐색과 기초</td><td>전공 기초 다지기, 동아리·봉사 등 다양한 경험, 경험 기록 시작</td></tr>
<tr><td><b>2학년</b></td><td>관심 분야 좁히기</td><td>진로 검사와 상담, 관심 직무 2~3개 정하기, 관련 수업 선택</td></tr>
<tr><td><b>3학년</b></td><td>직무 경험 쌓기</td><td>현장실습·인턴·공모전 도전, 직무 관련 자격 준비, 직무 인터뷰</td></tr>
<tr><td><b>4학년 1학기</b></td><td>서류 기반 만들기</td><td>자기분석·직무분석 완료, 경험 정리, 기본 자기소개서 완성</td></tr>
<tr><td><b>4학년 2학기</b></td><td>실전 지원</td><td>기업별 맞춤 수정, 인적성·필기 대비, 모의 면접</td></tr>
</table>
<div class="box tip"><span class="box-label">팁</span>
<p>학년과 관계없이 지금 바로 시작할 수 있는 일은 <b>경험 기록</b>입니다. 활동이 끝날 때마다 무엇을 했고 무엇이 어려웠는지 세 줄만 적어 두세요. 나중에 자기소개서를 쓸 때 가장 큰 재산이 됩니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>3학년 때 직무 인터뷰를 한 번이라도 해 본 학생은 지원동기의 깊이가 다릅니다. 현직자의 말을 직접 들은 사람의 문장은 읽으면 바로 티가 납니다.</p></div></div><div class="pf">24</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-17</span>12주 집중 계획</h2>
<p>이미 4학년이거나 졸업을 앞두고 있다면 12주 집중 계획을 권합니다. 이 책의 PART 순서와 맞추어 짰기 때문에, 책을 따라가면 계획도 함께 진행됩니다.</p>
<table class="tbl">
<tr><th style="width:18%">주차</th><th style="width:26%">단계</th><th>할 일과 결과물</th></tr>
<tr><td><b>1주</b></td><td>방향 잡기</td><td>채용 구조 이해, 준비 현황 진단, 목표 직무 1차 설정 (PART 1)</td></tr>
<tr><td><b>2~3주</b></td><td>자기분석</td><td>라이프라인, 가치관, 강점 정리 (PART 2)</td></tr>
<tr><td><b>4~5주</b></td><td>직무·기업분석</td><td>직무 역량표, 지원 기업 분석표 (PART 3, 4)</td></tr>
<tr><td><b>6~7주</b></td><td>경험 정리</td><td>핵심 경험 STAR 정리 (PART 5)</td></tr>
<tr><td><b>8~10주</b></td><td>작성</td><td>문항별 초안 작성과 수정 (PART 6, 7)</td></tr>
<tr><td><b>11주</b></td><td>퇴고와 점검</td><td>점검표 확인, 다른 사람에게 읽히기 (PART 8)</td></tr>
<tr><td><b>12주</b></td><td>면접 연결</td><td>예상 질문 정리, 모의 면접, 실제 지원</td></tr>
</table>
<div class="box warn"><span class="box-label">주의</span>

<p>평가 회의에서 면접관들이 서류를 내려놓으며 하는 말에는 공통점이 있습니다. 다음 신호가 보이면 내용을 읽기 전에 이미 점수가 깎이기 시작합니다.</p>

<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>다른 회사 이름이 남아 있는 서류는 생각보다 자주 나옵니다. 그 서류를 본 평가자가 다음 문장을 너그럽게 읽기는 어렵습니다. 제출 전 회사명 검색은 꼭 하세요.</p></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-19</span>공공기관은 어떻게 나뉘는가</h2>
<p>학생들이 '공기업'이라고 부르는 곳 중에는 법적으로 공기업이 아닌 기관도 많습니다. 정부가 출자하거나 재정을 지원하는 기관은 「공공기관의 운영에 관한 법률」에 따라 공공기관으로 지정되고, 성격에 따라 세 가지로 나뉩니다.</p>
<table class="tbl">
<tr><th style="width:20%">구분</th><th>성격</th><th style="width:36%">세부 유형</th></tr>
<tr><td><b>공기업</b></td><td>사업으로 버는 자체수입이 총수입의 절반 이상인 기관 중에서 지정</td><td><b>시장형</b> 자산 규모와 자체수입 비중이 특히 큰 곳<br><b>준시장형</b> 시장형이 아닌 공기업</td></tr>
<tr><td><b>준정부기관</b></td><td>공기업이 아닌 기관 중에서 지정. 정부 업무를 위탁받아 집행하거나 기금을 관리</td><td><b>기금관리형</b> 법에 따른 기금을 관리<br><b>위탁집행형</b> 그 밖의 위탁 업무</td></tr>
<tr><td><b>기타공공기관</b></td><td>공기업과 준정부기관이 아닌 공공기관</td><td>연구기관 등 성격이 다양</td></tr>
</table>
<div class="box key"><span class="box-label">핵심</span>
<p>공공기관 지정과 유형은 해마다 다시 정해지고 바뀔 수 있습니다. 지원하려는 기관의 현재 분류는 <b>알리오</b>에서 확인하세요.</p></div>
<p>유형은 자기소개서에도 영향을 줍니다. 제가 본 바로는 사업 수입으로 운영되는 공기업은 사업 성과와 공공성을 함께 묻고, 정부 업무를 집행하는 준정부기관은 정확하고 공정한 업무 처리를 더 깊이 묻는 경우가 많았습니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"공기업이라 지원했습니다"라는 지원자에게 기관의 유형을 물으면 답하지 못하는 경우가 많습니다. 기관이 어떤 돈으로 무슨 일을 하는지 아는 것이 지원동기의 출발점입니다.</p></div></div><div class="pf">30</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-20</span>공공기관 채용의 특징</h2>
<p>공공기관 채용은 <b>NCS 기반 블라인드 채용</b>이 기본 틀입니다. 사기업과 가장 다른 점은 무엇을 평가할지가 공고 단계에서 미리 공개된다는 것입니다.</p>
<ol class="steps">
<li><b>공고와 직무기술서</b>직무별 업무, 필요한 지식·기술·태도, 직업기초능력이 적혀 있습니다.</li>
<li><b>입사지원서</b>사진·학교·출신지 없이 교육, 자격, 경험·경력을 적습니다.</li>
<li><b>직무능력 기반 자기소개서</b>직업기초능력과 직무 관련 경험을 묻습니다.</li>
<li><b>필기시험</b>직업기초능력평가와 직무수행능력(전공) 평가를 치르는 경우가 많습니다.</li>
<li><b>면접</b>경험 면접, 상황 면접, 토론, 발표 등 구조화된 방식으로 진행됩니다.</li>
</ol>
<h3>채용정보는 어디서 찾나</h3>
<div class="cards c3">
<div class="card"><b>잡알리오</b>공공기관 채용정보를 모아 볼 수 있는 곳</div>
<div class="card"><b>알리오</b>공공기관의 경영정보가 공개되는 곳</div>
<div class="card"><b>기관 채용 누리집</b>공고문 원문과 직무기술서 확인</div>
</div>
<div class="box tip"><span class="box-label">팁</span>
<p>잡알리오에서 공고를 찾았다면 같은 기관을 알리오에서도 찾아보세요. 기관의 사업과 경영 정보까지 읽으면 지원동기가 깊어집니다. 자세한 기관분석 방법은 PART 4에서 다룹니다.</p></div></div><div class="pf">31</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-21</span>직업기초능력 10개 영역과 필기시험</h2>
<p>NCS는 어떤 직무든 직업인이라면 갖추어야 할 공통 능력을 <b>직업기초능력</b> 10개 영역으로 정리해 두었습니다.</p>
<table class="tbl">
<tr><th style="width:30%">영역</th><th>쉽게 말하면</th></tr>
<tr><td><b>의사소통능력</b></td><td>글과 말로 뜻을 정확히 주고받는 힘</td></tr>
<tr><td><b>수리능력</b></td><td>계산하고 도표와 통계를 읽는 힘</td></tr>
<tr><td><b>문제해결능력</b></td><td>문제의 원인을 찾아 해결책을 내는 힘</td></tr>
<tr><td><b>자기개발능력</b></td><td>부족한 점을 알고 스스로 배워 가는 힘</td></tr>
<tr><td><b>자원관리능력</b></td><td>시간, 예산, 물자, 인력을 알맞게 쓰는 힘</td></tr>
<tr><td><b>대인관계능력</b></td><td>협력하고 갈등을 풀고 고객을 응대하는 힘</td></tr>
<tr><td><b>정보능력</b></td><td>정보를 찾고 정리하며 컴퓨터로 다루는 힘</td></tr>
<tr><td><b>기술능력</b></td><td>업무에 필요한 기술을 이해하고 적용하는 힘</td></tr>
<tr><td><b>조직이해능력</b></td><td>조직의 구조, 업무, 문화를 이해하는 힘</td></tr>
<tr><td><b>직업윤리</b></td><td>정직, 책임, 공정함을 지키는 태도</td></tr>
</table>
<p>기관은 이 중 직무에 필요한 영역을 골라 직무기술서에 적고, 필기시험과 자기소개서 문항도 대개 그 영역에서 나옵니다. 출제 영역, 문항 수, 전공 시험 여부는 기관마다 다릅니다.</p>
<div class="box warn"><span class="box-label">주의</span>
<p>자격증, 지역인재 등 <b>가산점 항목과 비율은 기관과 직렬마다 다르고</b> 해마다 바뀔 수 있습니다. 반드시 그해 공고문 원문으로 확인하세요.</p></div></div><div class="pf">32</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-22</span>사기업 채용의 특징: 대기업</h2>
<p>사기업은 회사마다 채용 방식이 훨씬 다양합니다. 가장 큰 흐름은 대기업의 변화입니다. 예전에는 1년에 한두 번 여는 정기 공채가 중심이었지만, 여러 대기업이 공채를 줄이거나 없애고 <b>부서에 사람이 필요할 때 뽑는 수시·상시 채용</b>으로 바꾸었습니다. 공채를 유지하는 곳도 있으니 지원할 회사의 방식은 직접 확인해야 합니다.</p>
<h3>수시 채용이 바꾼 것</h3>
<div class="cards">
<div class="card"><b>직무 단위 공고</b>팀과 업무가 구체적으로 적힌 공고가 늘었습니다.</div>
<div class="card"><b>현업 중심 평가</b>실제로 함께 일할 부서가 서류와 면접에 깊이 참여합니다.</div>
<div class="card"><b>직무 경험 중시</b>인턴, 현장실습, 프로젝트처럼 일을 해 본 흔적을 봅니다.</div>
<div class="card"><b>연중 지원</b>공고가 수시로 열리고 닫혀 미리 준비한 사람이 유리합니다.</div>
</div>
<h3>인적성검사</h3>
<p>대기업은 서류 다음에 인적성검사를 두는 경우가 많습니다. 인성검사는 성격과 가치관이 일관되게 답해지는지를, 적성검사는 언어, 수리, 추리 같은 기초 사고력을 봅니다. 검사 이름, 영역, 시행 방식은 회사마다 다릅니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>수시 채용 서류를 읽는 사람은 현업 팀장인 경우가 많습니다. 그들은 "이 사람이 우리 팀에서 다음 달부터 무엇을 할 수 있나"를 봅니다.</p></div></div><div class="pf">33</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-23</span>중견·중소기업, 외국계, 스타트업</h2>
<p>대기업과 공기업만 바라보다 좋은 기회를 놓치는 학생을 자주 봅니다. 기업 유형마다 뽑는 방식과 서류에서 보는 것이 다릅니다.</p>
<div class="cards">
<div class="card"><b>중견기업</b>특정 분야에서 오래 자리 잡은 곳이 많습니다. 공채와 수시가 섞여 있습니다. 회사의 주력 제품과 고객을 구체적으로 아는 지원자가 눈에 띕니다.</div>
<div class="card"><b>중소기업</b>필요할 때 바로 뽑는 경우가 많고 대표나 팀장이 직접 면접을 봅니다. 한 사람이 여러 일을 맡으니 폭넓은 실무 감각과 오래 일할 이유를 보여 주세요.</div>
<div class="card"><b>외국계 기업</b>자리가 비면 그 자리만 뽑는 경우가 많습니다. 영문 이력서와 커버레터, 영어 면접이 흔합니다. 짧고 성과 중심으로 쓰는 문서에 익숙해져야 합니다.</div>
<div class="card"><b>스타트업</b>채용 플랫폼, 추천, 과제 전형으로 뽑는 경우가 많습니다. 회사 서비스를 직접 써 보고 개선 의견을 낼 수 있는지, 빨리 실행하는 사람인지를 봅니다.</div>
</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>회사가 작을수록 "왜 우리 회사입니까"에 대한 답을 더 오래 듣습니다. 이름이 알려진 회사가 아니기에, 그 회사를 찾아내고 고른 이유가 곧 지원자의 분석력으로 읽히기 때문입니다.</p></div>
<div class="box tip"><span class="box-label">팁</span>
<p>기업 유형이 달라도 서류의 뼈대는 같습니다. 직무에 맞는 경험과 그 회사를 고른 이유입니다. 유형에 따라 바꾸는 것은 문서 형식과 강조점입니다. 기업 정보를 찾는 방법은 PART 4에서 다룹니다.</p></div></div><div class="pf">34</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-24</span>공기업과 사기업, 한 장으로 비교하기</h2>
<p>지금까지 살펴본 내용을 한 표로 모았습니다. 지원 방향을 정할 때와 서류를 쓰기 직전에 다시 펼쳐 보세요.</p>
<table class="tbl">
<tr><th style="width:17%">구분</th><th>공기업·공공기관</th><th>사기업</th></tr>
<tr><td><b>채용 방식</b></td><td>기관별 정기 채용 중심, NCS 기반 블라인드 채용, 공고에 직무기술서</td><td>대기업은 수시·상시 확대, 회사마다 방식이 다양</td></tr>
<tr><td><b>평가 초점</b></td><td>직무 능력과 함께 공공기관 구성원으로서의 윤리, 공정성, 책임감</td><td>성과를 내는 실행력, 회사 사업과 직무에 대한 이해</td></tr>
<tr><td><b>자소서 문항</b></td><td>직업기초능력별 경험을 묻는 문항이 많음, 기관 이해와 지원동기</td><td>지원동기, 직무역량, 입사 후 포부, 회사별 고유 문항</td></tr>
<tr><td><b>필기</b></td><td>직업기초능력평가와 전공 시험이 많음</td><td>회사별 인적성검사, 없는 곳도 있음</td></tr>
<tr><td><b>준비 포인트</b></td><td>직무기술서 문장 분석, 기관의 사업과 공공성 이해, 필기 병행</td><td>직무 공고 분석, 사업·제품·고객 이해, 수시 공고 관리</td></tr>
</table>
<div class="box key"><span class="box-label">핵심</span>
<p>두 쪽 모두 출발점은 <b>직무</b>입니다. 차이는 그 위에 무엇을 더 묻느냐입니다. 공공기관은 <span class="hl">공공성과 윤리</span>를, 사기업은 <span class="hl">사업 성과</span>를 더 묻습니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>표는 경향일 뿐입니다. 같은 공기업이라도 기관마다, 같은 대기업이라도 계열사마다 다릅니다. 마지막 기준은 언제나 그해 공고문입니다.</p></div></div><div class="pf">35</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-25</span>공기업 자소서와 사기업 자소서는 무엇이 다른가</h2>
<p>두 곳의 면접관석에 모두 앉아 보면, 같은 경험도 어느 쪽 서류냐에 따라 밑줄 긋는 곳이 다릅니다. 지민이 학과 행사 예산을 관리한 경험을 두 서류에 어떻게 썼는지 보겠습니다.</p>
<div class="example"><span class="ex-label">공공기관 문항(자원관리능력·직업윤리)에 쓴 문단</span>
행사 예산을 맡으며 지출 기준표를 만들어 모든 구매를 같은 기준으로 심사했습니다. 친한 동기의 요청도 기준에 맞지 않으면 돌려보냈고, 모든 영수증을 공개 게시판에 올려 누구나 확인할 수 있게 했습니다.</div>
<div class="example"><span class="ex-label">사기업 문항(직무역량)에 쓴 문단</span>
행사 예산을 맡아 지난해 지출 내역을 분석해 보니 간식비 비중이 컸습니다. 업체 세 곳의 견적을 비교해 바꾸고 남은 돈으로 참가 기념품을 마련했고, 참가 신청이 전년보다 늘었습니다.</div>
<table class="tbl">
<tr><th style="width:50%">공공기관 면접관이 밑줄 긋는 곳</th><th>사기업 면접관이 밑줄 긋는 곳</th></tr>
<tr><td>같은 기준, 투명한 절차, 예외 없는 원칙</td><td>원인 분석, 비용 대비 효과, 늘어난 결과</td></tr>
</table>
<div class="box warn"><span class="box-label">주의</span>
<p>공공기관 서류에 매출과 성장 이야기만 쓰거나, 사기업 서류에 사회 공헌 이야기만 쓰면 방향이 엇갈립니다. 경험은 하나여도 <b>보여 주는 면</b>은 지원처에 맞게 고르세요.</p></div></div><div class="pf">36</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">1-26</span>나에게 맞는 쪽 고르기</h2>
<p>"공기업이 안정적이라고 해서요." 상담에서 가장 많이 듣는 이유입니다. 솔직하지만 안정만으로 고르면 지원동기가 비어 버립니다. 면접관은 안정 말고 <b>이 일을 하려는 이유</b>를 묻기 때문입니다.</p>
<h3>스스로에게 던질 다섯 질문</h3>
<ol class="steps">
<li><b>일의 의미</b>공공의 이익을 지키는 일과 회사의 성장을 이끄는 일 중 어디서 힘이 나는가?</li>
<li><b>일하는 방식</b>정해진 규정과 절차 속의 정확함이 편한가, 빠른 변화와 성과 경쟁이 편한가?</li>
<li><b>준비 방식</b>필기시험 공부에 꾸준히 시간을 낼 수 있는가, 직무 경험과 포트폴리오를 쌓는 쪽이 맞는가?</li>
<li><b>근무 지역</b>지방 소재 기관이나 순환 근무를 받아들일 수 있는가?</li>
<li><b>경력의 모양</b>한 조직에서 오래 성장하고 싶은가, 옮겨 가며 넓히고 싶은가?</li>
</ol>
<div class="box key"><span class="box-label">핵심</span>
<p>둘 다 준비해도 됩니다. 다만 경험 재료는 함께 쓰되, <span class="hl">서류는 따로</span> 써야 합니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>안정성을 말해도 괜찮습니다. 그 안정 위에서 무엇을 오래 하고 싶은지까지 말하면 평범한 이유가 설득력 있는 이유로 바뀝니다.</p></div></div><div class="pf">37</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 1 · 면접관의 시선</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">PART 1 정리</span>면접관의 시선으로 다시 보기</h2>
<p>PART 1에서는 자기소개서를 쓰기 전에 읽는 사람의 자리에 먼저 앉아 보았습니다. 핵심을 다시 정리합니다.</p>
<table class="tbl">
<tr><th style="width:30%">주제</th><th>기억할 한 줄</th></tr>
<tr><td><b>채용 절차</b></td><td>서류는 서류전형과 면접에서 두 번 읽힌다.</td></tr>
<tr><td><b>채용 방식</b></td><td>수시 채용 시대에는 회사보다 직무를 먼저 분석한다.</td></tr>
<tr><td><b>블라인드·NCS</b></td><td>스펙을 가린 자리에 남는 것은 경험과 문장이다.</td></tr>
<tr><td><b>읽는 방식</b></td><td>소제목과 첫 문장만으로 전달되게 두괄식으로 쓴다.</td></tr>
<tr><td><b>평가 기준</b></td><td>직무적합성, 조직적합성, 성장가능성을 장면으로 보여 준다.</td></tr>
<tr><td><b>이론 노트</b></td><td>노력이 든 과거 행동으로 적합성과 역량을 증명한다.</td></tr>
<tr><td><b>면접 연결</b></td><td>모든 문장은 꼬리 질문에 답할 수 있어야 한다.</td></tr>
<tr><td><b>분석과 설계도</b></td><td>분석, 재료, 작성, 점검의 순서를 지킨다.</td></tr>
<tr><td><b>공기업·사기업</b></td><td>둘 다 직무가 출발. 공공은 공공성·윤리, 사기업은 성과.</td></tr>
</table>

<p>읽는 사람을 알면 쓰는 일이 쉬워집니다. 이제 그 사람에게 보여 줄 재료를 꺼낼 차례입니다. PART 2에서는 나 자신부터 들여다봅니다.</p></div></div><div class="pf">39</div></div></div>
<div class="page"><div class="pg opener"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 2</div>
<h1>쓸 거리는<br>이미 내 안에 있다</h1>
<p class="lead">자기소개서가 막히는 이유는 문장력이 아니라 재료가 없어서입니다. 이 장에서는 지나온 시간, 중요하게 여기는 것, 끌리는 일, 잘하는 행동, 남이 보는 나를 검증된 진로 이론의 틀로 차례로 꺼내어 한 장의 지도로 정리합니다.</p>
<ul class="chap-list"><li>01 분석의 깊이가 자기소개서의 깊이를 정한다</li><li>02 생애진로발달 이론과 라이프라인으로 지나온 시간 읽기</li><li>03 직업가치, 경력 닻, 홀랜드 흥미 이론으로 나의 기준 찾기</li><li>04 강점 기반 접근과 자기효능감으로 강점과 약점 말하기</li><li>05 경험 인벤토리, 계획된 우연, 나의 키워드</li><li>06 분석 결과를 기업의 언어로 번역하기</li></ul>
<div class="chap-bar"></div></div><div class="pf">40</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-1</span>면접관은 질문 두 개로 알아챕니다</h2>
<p>면접장에서 저는 자기소개서에 적힌 문장 하나를 골라 "그때 구체적으로 무엇을 하셨어요?"라고 묻습니다. 대답이 바로 나오면 한 번 더 묻습니다. "그 경험이 지금 지원하신 일과 어떻게 이어진다고 보세요?"</p>
<p>두 번째 질문에서 많은 지원자가 멈춥니다. 글은 잘 다듬었는데, 그 경험이 자기에게 어떤 의미였는지 스스로 정리해 본 적이 없기 때문입니다. 남이 고쳐 준 문장은 첫 질문까지는 버팁니다. 그러나 <span class="hl">자기 생각으로 정리하지 않은 경험은 두 번째 질문에서 무너집니다.</span></p>
<p>자기분석은 바로 이 두 번째 질문에 대한 준비입니다. 내가 무엇을 했는지, 왜 그렇게 했는지, 그 일이 나에게 무엇을 남겼는지를 미리 꺼내 보는 일입니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>자기분석이 된 지원자는 대답이 길지 않습니다. 짧은데 흔들리지 않습니다. 어떤 각도로 물어도 같은 사람이 대답하고 있다는 느낌을 줍니다. 저는 그 일관성을 '준비된 사람'의 신호로 읽습니다.</p></div>
<div class="compare"><div class="bad">"그냥 좋은 경험이었고, 많이 배웠습니다."</div><div class="good">"처음으로 남의 실수를 탓하지 않고 순서표를 고쳤습니다. 그때부터 문제를 구조로 보는 습관이 생겼습니다."</div></div></div><div class="pf">41</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-2</span>같은 경험, 세 가지 깊이</h2>
<p>제 수업 첫 주에는 "가장 열심히 했던 경험을 세 문장으로 쓰세요"라는 과제를 냅니다. 그리고 자기분석 워크시트를 모두 마친 뒤 같은 경험을 다시 쓰게 합니다. 그사이 문장력은 거의 달라지지 않는데, 글은 완전히 달라집니다. 아래는 경영학과 지민이 카페 아르바이트 경험을 분석의 깊이에 따라 세 번 쓴 문장입니다.</p>
<table class="tbl"><tr><th style="width:22%">분석 단계</th><th>지민의 문장</th></tr>
<tr><td><b>1단계</b><br>사실 나열</td><td>카페에서 1년간 아르바이트를 하며 성실하게 일했고 많은 것을 배웠습니다.</td></tr>
<tr><td><b>2단계</b><br>행동 발견</td><td>주말 피크 시간에 주문이 밀리자, 음료별 준비 순서를 바꾸자고 점장님께 제안해 대기 줄을 줄였습니다.</td></tr>
<tr><td><b>3단계</b><br>패턴·의미·연결</td><td>일이 밀릴 때 저는 사람보다 순서를 먼저 봅니다. 카페의 준비 순서를 바꾼 일도, 동아리 회계 장부를 다시 짠 일도 같은 습관에서 나왔습니다. 이 습관을 물류 흐름을 다루는 운영관리 업무에서 쓰고 싶습니다.</td></tr>
</table>
<p>1단계에는 무엇을 했는지가 없습니다. 2단계는 행동이 보이지만 한 번의 사건에 머뭅니다. 3단계에 와서야 <span class="hl">반복되는 행동(패턴), 그렇게 하는 이유, 지원 직무와의 연결</span>이 한꺼번에 나타납니다.</p>
<div class="box key"><span class="box-label">핵심</span><p>1단계에서 3단계로 가는 동안 지민이 한 일은 표현 연습이 아니었습니다. 라이프라인과 경험 인벤토리를 채우며 자기 행동의 반복을 발견한 것입니다. 문장의 깊이는 분석의 깊이를 넘지 못합니다.</p></div></div><div class="pf">42</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-3</span>분석이 부족한 글의 세 가지 증상</h2>
<p>면접관으로 서류를 읽다 보면 분석이 덜 된 글은 몇 줄 만에 드러납니다. 증상은 대개 세 가지입니다.</p>
<h4>1. 어느 회사에 내도 되는 글</h4>
<p>내가 누구인지 정리되지 않으면 문장은 일반론으로 흐릅니다. 성실, 열정, 소통 같은 단어만 남아서 이름을 가리면 누구의 글인지 알 수 없습니다.</p>
<h4>2. 문항끼리 따로 노는 글</h4>
<p>성장과정에서는 신중한 사람이었다가 도전 문항에서는 무작정 뛰어드는 사람이 됩니다. 중심 키워드가 없으면 문항마다 다른 사람이 등장합니다.</p>
<h4>3. 꼬리 질문에 무너지는 글</h4>
<p>"왜 그렇게 하셨어요?"라는 질문에 답이 없는 글입니다. 행동의 이유, 곧 가치관과 동기를 스스로 정리해 보지 않았기 때문입니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 서류에서 문장이 매끄러운지보다 '이 사람이 자기 이야기를 하고 있는가'를 먼저 봅니다. 매끄럽지만 누구의 것인지 모를 글보다, 조금 투박해도 자기 경험에서 나온 글에 손이 갑니다.</p></div>
<p>그래서 이 책은 문장 쓰기보다 분석을 앞에 둡니다. 이 장의 진로 이론과 가치·흥미 점검은 '나의 기준'을, 강점과 경험 정리는 '증거'를, 키워드와 번역은 '연결'을 만들어 세 증상을 막습니다.</p></div><div class="pf">43</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-4</span>자기분석 지도: 네 갈래</h2>
<p>자기분석은 막연히 "나는 어떤 사람일까"를 고민하는 일이 아닙니다. 네 갈래로 나누어 하나씩 채우면 됩니다. 각 갈래는 자기소개서의 특정 문항으로 그대로 이어집니다.</p>
<div class="cards"><div class="card"><b>가치관</b>무엇을 중요하게 여기는가. 선택의 기준.</div><div class="card"><b>흥미</b>어떤 일에 시간 가는 줄 모르는가.</div><div class="card"><b>성격·강점</b>어떤 행동을 반복해서 잘해 왔는가.</div><div class="card"><b>경험</b>무엇을 해 왔고 그 안에서 무엇을 했는가.</div></div>
<table class="tbl"><tr><th style="width:22%">갈래</th><th>주로 쓰이는 문항</th></tr>
<tr><td>가치관</td><td>성장과정, 입사 후 포부, 직업관·생활신조</td></tr>
<tr><td>흥미</td><td>지원동기, 직무 선택 이유</td></tr>
<tr><td>성격·강점</td><td>성격의 장단점, 직무역량, 협업 경험</td></tr>
<tr><td>경험</td><td>도전·실패·갈등 해결 경험 등 모든 경험형 문항</td></tr>
</table>
<div class="box key"><span class="box-label">핵심</span><p>네 갈래는 따로 놀지 않습니다. 하나의 경험 안에 가치관과 강점이 함께 들어 있습니다. 이 장의 워크시트를 다 채우고 나면 같은 장면이 여러 칸에 반복해서 등장하는데, 그것이 바로 나의 중심 재료입니다.</p></div></div><div class="pf">44</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-5</span>생애진로발달: 나는 지금 어느 단계인가</h2>
<p>진로를 한 번의 선택이 아니라 평생에 걸친 발달 과정으로 본 학자가 도널드 슈퍼(Donald E. Super)입니다. 그는 진로 선택을 <span class="hl">자기개념을 직업 속에서 실현해 가는 과정</span>으로 설명하고, 단계마다 풀어야 할 발달 과업이 있다고 보았습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>성장기</b>(아동기~10대 초반) 흥미와 능력에 대한 자기개념이 만들어집니다.<br><b>탐색기</b>(10대 중반~20대 중반) 여러 역할과 일을 시험해 보며 진로를 좁혀 갑니다.<br><b>확립기</b>(20대 중반~40대) 한 분야에 자리 잡고 기반을 다집니다.<br><b>유지기</b>(40대 중반~60대) 이룬 자리를 지키고 다듬습니다.<br><b>쇠퇴기</b>(이후) 일의 비중을 줄이고 새 역할로 옮겨 갑니다.</p>
<p class="small">나이는 대략의 기준이며, 학자와 시대에 따라 구분이 조금씩 다릅니다.</p></div>
<p>취업을 앞둔 학생은 대부분 탐색기의 끝에 있습니다. 슈퍼는 이 시기의 과업을 <b>결정화</b>(막연한 관심을 방향으로 모으기), <b>구체화</b>(특정 직무로 좁히기), <b>실행</b>(그 직무를 위해 실제로 준비하고 지원하기)으로 나누었습니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>지원동기에서 제가 확인하는 것이 바로 이 순서입니다. 관심이 어디서 생겼고, 왜 이 직무로 좁혔으며, 그 뒤에 무엇을 준비했는가. 한 단계라도 비면 동기가 얇게 읽힙니다.</p></div>
<p class="src">출처: Donald E. Super, 『The Psychology of Careers』(1957) 및 이후의 생애진로발달 연구</p></div><div class="pf">45</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-6</span>생애역할과 생애진로 무지개</h2>
<p>슈퍼는 뒤에 시간의 축(발달 단계)에 공간의 축(생애역할)을 더했습니다. 사람은 한 시기에 여러 역할을 함께 맡고, 각 역할에 쏟는 시간과 마음의 비중은 시기마다 달라진다는 것입니다. 이를 무지개처럼 겹친 띠로 그린 그림이 <b>생애진로 무지개</b>(Life-Career Rainbow)입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p>무지개의 바깥 띠는 나이와 발달 단계, 안쪽 띠들은 역할입니다. 대표적인 생애역할은 <b>자녀, 학생, 여가인, 시민, 직업인, 배우자, 가정관리자, 부모</b>이며, 은퇴 뒤의 역할도 포함됩니다. 띠의 두께가 그 시기 그 역할의 비중을 뜻합니다.</p></div>
<p>자기소개서에서 이 이론이 쓸모 있는 이유는 간단합니다. 대학 시절의 나는 '학생'만이 아니었습니다. 아르바이트생(직업인), 동아리 회원(여가인), 봉사자(시민), 가족을 돌본 자녀이기도 했습니다. <span class="hl">역할별로 경험을 다시 보면 빠뜨린 재료가 보입니다.</span></p>
<div class="example"><span class="ex-label">예시: 간호학과 서연</span>
학생 역할만 떠올렸을 때는 실습 이야기뿐이었습니다. '자녀' 역할을 떠올리자 할머니의 입원 기간에 보호자로 병원을 오가며 설명을 듣는 쪽의 불안을 처음 겪은 장면이 나왔습니다. 이 장면이 서연의 지원동기 첫 문단이 되었습니다.</div>
<div class="box tip"><span class="box-label">팁</span><p>다음 쪽 라이프라인을 그릴 때 시기마다 그때 맡았던 역할을 한두 개 함께 적어 보세요.</p></div>
<p class="src">출처: Donald E. Super, "A Life-Span, Life-Space Approach to Career Development", Journal of Vocational Behavior(1980)</p></div><div class="pf">46</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-7</span>라이프라인 그리기</h2>
<p>라이프라인은 지나온 시간을 가로축에, 그때의 만족도를 세로축에 놓고 굴곡을 그려 보는 방법입니다. 그래프의 모양보다 중요한 것은 <span class="hl">높은 점과 낮은 점에서 내가 무엇을 했는가</span>입니다.</p>
<ol class="steps"><li><b>시기를 나눈다</b>초등, 중학, 고등, 대학 저학년, 대학 고학년, 최근 1년처럼 나눕니다.</li><li><b>사건을 하나씩 적는다</b>시기마다 가장 먼저 떠오르는 일 하나면 충분합니다.</li><li><b>만족도를 매긴다</b>1(매우 낮음)부터 5(매우 높음)까지 숫자로 매깁니다.</li><li><b>행동과 배운 점을 붙인다</b>그때 내가 한 행동 하나, 남은 것 하나를 적습니다.</li></ol>
<div class="example"><span class="ex-label">예시: 기계공학과 4학년 준호의 라이프라인 일부</span>
고등 2학년, 만족도 2. 성적이 떨어져 진로를 고민함. 행동: 학교 과학실 동아리에서 작은 로봇을 처음 만들어 봄. 배운 점: 손으로 만들어 확인할 때 공부가 된다.<br>
대학 3학년, 만족도 5. 설계 공모전 본선 진출. 행동: 팀의 도면 검토 순서를 정리함. 배운 점: 나는 정리하는 역할에서 힘이 난다.</div>
<p class="small">준호는 낮은 시기와 높은 시기 모두에서 '직접 만들고 정리하는' 행동이 반복된다는 것을 발견했습니다.</p></div><div class="pf">47</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-8</span>가치관: 선택의 기준을 말로 꺼내기</h2>
<p>가치관은 "무엇이 옳은가"라는 거창한 질문이 아닙니다. 두 가지 중 하나를 골라야 할 때 <span class="hl">내가 무엇을 기준으로 골라 왔는가</span>입니다. 아르바이트를 고를 때 시급이 높은 곳보다 배울 것이 많은 곳을 골랐다면, 그 선택 안에 '성장'이라는 가치가 들어 있습니다.</p>
<p>가치관이 중요한 이유는 기업이 지원자와 오래 함께할 수 있을지를 여기에서 가늠하기 때문입니다. 회사의 일하는 방식과 나의 기준이 크게 어긋나면, 입사해도 서로 힘들어집니다.</p>
<h3>가치관을 찾는 세 가지 질문</h3>
<ul><li>지금까지 가장 고민했던 선택은 무엇이었고, 결국 무엇을 기준으로 골랐는가?</li><li>어떤 상황에서 화가 나거나 불편했는가? 그 반대편에 내가 지키고 싶은 것이 있다.</li><li>누군가를 존경했다면, 그 사람의 어떤 점 때문이었는가?</li></ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"정직이 제 가치관입니다"라는 말은 누구나 합니다. 제가 기억하는 지원자는 "손해를 보더라도 정산 오류를 먼저 말했던 날"을 이야기한 사람입니다. 가치관은 선언이 아니라 그 가치 때문에 무언가를 포기한 장면으로 증명됩니다.</p></div></div><div class="pf">50</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-9</span>내재적 가치와 외재적 가치</h2>
<p>직업가치는 일을 통해 얻고 싶은 것입니다. 진로 연구에서는 이를 크게 두 갈래로 나눕니다. 일 그 자체에서 얻는 보상을 중시하는 <b>내재적 가치</b>와, 일의 결과로 따라오는 조건을 중시하는 <b>외재적 가치</b>입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<table class="tbl"><tr><th style="width:22%">구분</th><th>예</th></tr>
<tr><td>내재적 가치</td><td>성취, 성장과 배움, 창의, 자율, 사회적 기여, 일의 재미</td></tr>
<tr><td>외재적 가치</td><td>경제적 보상, 고용 안정, 근무 환경, 사회적 인정, 일과 생활의 균형</td></tr>
</table>
<p class="small">슈퍼는 직업가치검사(Work Values Inventory)를 만들어 이런 가치들을 측정하고자 했습니다.</p></div>
<p>외재적 가치를 중요하게 여기는 것은 부끄러운 일이 아닙니다. 다만 지원동기의 중심에 외재적 가치만 놓이면 <span class="hl">"이 회사가 아니어도 되는 이유"</span>가 됩니다. 보수와 안정은 다른 회사도 줄 수 있기 때문입니다.</p>
<div class="compare"><div class="bad">안정적인 기관에서 오래 일하고 싶어 지원했습니다.</div><div class="good">민원 한 건을 끝까지 따라가 해결할 때 보람을 느껴 왔습니다. 그 전문성을 오래 쌓을 수 있는 곳에서 일하고 싶습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"회사를 고르는 기준"을 물을 때 안정이나 보수를 솔직히 말해도 됩니다. 그 앞에 내재적 이유 하나를 먼저 세워 두면 대답이 가벼워 보이지 않습니다.</p></div>
<p class="src">출처: Donald E. Super, Work Values Inventory(직업가치검사)</p></div><div class="pf">51</div></div></div>

<div class="page"><div class="pg ws"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 2-2</span><h2>가치관 카드 고르기 ②</h2></div>
<div class="ws-guide">5개 가운데 1순위를 정하고, 그 가치를 지키느라 무언가를 포기했던 장면을 찾아 적습니다.</div>

<p class="ws-q">3. 그 가치 때문에 손해를 보거나 무언가를 포기한 경험은?</p>

<p class="ws-q">4. 그 가치가 지원하려는 직무에서는 어떤 모습으로 드러날까요?</p>
<textarea class="f" data-k="ws2-2-q4" rows="3"></textarea>
<p class="ws-q">5. 반대로, 내가 일하면서 견디기 어려울 것 같은 환경은?</p>

<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-10</span>경력 닻: 끝까지 놓지 않을 한 가지</h2>
<p>에드거 샤인(Edgar H. Schein)은 직장인의 경력을 오래 추적하며, 사람마다 경력을 고를 때 끝까지 포기하지 않으려는 중심이 있다는 것을 발견했습니다. 배를 붙잡아 주는 닻에 빗대어 이를 <b>경력 닻</b>(career anchor)이라 불렀습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<table class="tbl"><tr><th style="width:30%">경력 닻</th><th>끝까지 지키려는 것</th></tr>
<tr><td>기술·기능 역량</td><td>한 분야의 전문가로 인정받는 것</td></tr>
<tr><td>관리 역량</td><td>사람과 조직을 이끌어 성과를 내는 것</td></tr>
<tr><td>자율·독립</td><td>내 방식과 속도로 일하는 것</td></tr>
<tr><td>안정·보장</td><td>고용과 생활의 예측 가능성</td></tr>
<tr><td>창업·창의</td><td>새로운 것을 내 손으로 시작하는 것</td></tr>
<tr><td>봉사·헌신</td><td>가치 있다고 믿는 일에 기여하는 것</td></tr>
<tr><td>순수한 도전</td><td>어려운 문제를 이겨 내는 것</td></tr>
<tr><td>라이프스타일</td><td>일과 삶 전체의 조화</td></tr>
</table></div>
<p>샤인은 경력 닻이 실제로 일을 해 본 뒤에 분명해진다고 보았습니다. 그러니 신입 지원자에게는 확정된 닻이 아니라 <span class="hl">닻의 후보</span>입니다. 그래도 미리 짐작해 두면 직무와 회사를 고르는 기준이 선명해지고, "왜 이 일인가"에 흔들리지 않는 답이 생깁니다.</p>
<p class="src">출처: Edgar H. Schein, 『Career Dynamics』(1978) 및 『Career Anchors』</p></div><div class="pf">54</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-11</span>흥미: 어떤 일에 끌리는가</h2>
<p>흥미는 지원동기의 뿌리입니다. 직업흥미 이론으로 널리 쓰이는 홀랜드(Holland)의 분류는 사람의 흥미를 여섯 유형으로 나눕니다. 머리글자를 따서 RIASEC이라고 부릅니다. 대부분의 사람은 한 유형이 아니라 두세 유형이 섞여 있습니다.</p>
<table class="tbl"><tr><th style="width:24%">유형</th><th>끌리는 일</th><th style="width:30%">관련 직무 예</th></tr>
<tr><td>현실형(R)</td><td>도구·기계를 다루고 몸으로 만들어 내는 일</td><td>생산, 설비, 시공</td></tr>
<tr><td>탐구형(I)</td><td>원리를 파고들고 분석해 답을 찾는 일</td><td>연구개발, 데이터 분석</td></tr>
<tr><td>예술형(A)</td><td>새로운 것을 표현하고 만들어 내는 일</td><td>디자인, 콘텐츠 기획</td></tr>
<tr><td>사회형(S)</td><td>사람을 돕고 가르치고 돌보는 일</td><td>교육, 간호, 상담, 인사</td></tr>
<tr><td>진취형(E)</td><td>사람을 설득하고 이끌어 목표를 이루는 일</td><td>영업, 마케팅, 사업기획</td></tr>
<tr><td>관습형(C)</td><td>정해진 기준에 맞춰 정확히 정리하는 일</td><td>회계, 총무, 품질관리</td></tr>
</table>
<div class="box warn"><span class="box-label">주의</span><p>유형은 나를 이해하는 출발점일 뿐 직무를 정해 주는 판정이 아닙니다. 여기서는 간단한 자가점검만 합니다. 정식 검사는 대학 취업지원센터나 고용노동부 워크넷 같은 공공 진로 서비스에서 받아 볼 수 있습니다.</p></div></div><div class="pf">56</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 2-3</span><h2>흥미 유형 자가점검</h2></div>
<div class="ws-guide">문장이 나와 얼마나 닮았는지 0~5점으로 적고, 점수가 높은 두 유형을 흥미 코드로 삼습니다.</div>
<table class="ws-table"><tr><th style="width:17%">유형</th><th>이런 순간에 시간 가는 줄 모른다</th><th style="width:14%">점수</th></tr>
<tr><td class="lbl">R 현실형</td><td>고장 난 물건을 뜯어 고치거나 직접 만들어 볼 때</td><td><input class="f" data-k="ws2-3-r"></td></tr>

<tr><td class="lbl">A 예술형</td><td>글, 영상, 디자인으로 내 생각을 표현할 때</td><td><input class="f" data-k="ws2-3-a"></td></tr>

<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-12</span>홀랜드 육각형과 세 가지 개념</h2>
<p>홀랜드 이론의 힘은 여섯 유형을 육각형 위에 놓고 <span class="hl">유형 사이의 거리</span>를 본다는 데 있습니다. 육각형 둘레는 R, I, A, S, E, C 순서로 돌아갑니다. 이웃한 유형끼리는 닮았고, 마주 보는 유형(R와 S, I와 E, A와 C)끼리는 거리가 멉니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>일관성</b>(consistency) 흥미 코드의 두 유형이 육각형에서 얼마나 가까운가. RI, SE처럼 이웃하면 높고, RS처럼 마주 보면 낮습니다.<br><b>변별성</b>(differentiation) 가장 높은 유형과 낮은 유형의 점수 차이가 얼마나 뚜렷한가. 점수가 고르게 비슷하면 변별성이 낮습니다.<br><b>일치성</b>(congruence) 나의 유형과 일할 환경의 유형이 얼마나 맞는가. 홀랜드는 직업환경도 같은 여섯 유형으로 나눌 수 있다고 보았습니다.</p></div>
<p>WORKSHEET 2-3의 점수를 다시 보세요. 일관성이 낮다고 나쁜 것은 아닙니다. 다만 두 흥미가 멀리 떨어져 있다면, <b>둘이 함께 쓰이는 일</b>을 찾아 설명해야 합니다. 변별성이 낮다면 아직 직접 해 본 일이 적다는 신호일 수 있습니다.</p>
<div class="example"><span class="ex-label">예시: 기계공학과 준호</span>
준호의 흥미 코드는 R과 S, 마주 보는 조합이었습니다. 처음에는 "설비 일과 사람 일 중 하나를 골라야 하나" 고민했지만, 현장 설비를 다루면서 작업자에게 안전 절차를 교육하는 설비안전 직무에서 두 흥미가 함께 쓰인다는 것을 찾았습니다.</div>
<p class="src">출처: John L. Holland, 『Making Vocational Choices: A Theory of Vocational Personalities and Work Environments』</p></div><div class="pf">58</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-13</span>일치성: 나와 맞는 일의 환경</h2>
<p>홀랜드 이론의 중심 가정은 사람이 자기 유형과 맞는 환경을 찾아가고, 맞는 환경에서 더 만족하며 오래 머문다는 것입니다. 같은 회사 안에서도 직무마다 환경의 유형이 다릅니다.</p>
<table class="tbl"><tr><th style="width:26%">직무 환경 예</th><th style="width:18%">주된 유형</th><th>그 환경에서 날마다 반복되는 일</th></tr>
<tr><td>생산기술·설비</td><td>R, I</td><td>장비 점검, 고장 원인 찾기, 공정 개선</td></tr>
<tr><td>데이터 분석</td><td>I, C</td><td>자료 수집과 정리, 원인 규명</td></tr>
<tr><td>콘텐츠 기획</td><td>A, E</td><td>아이디어 표현, 메시지 설계</td></tr>
<tr><td>인사·교육</td><td>S, E</td><td>사람 선발과 육성, 면담</td></tr>
<tr><td>영업</td><td>E, S</td><td>고객 설득, 관계 유지, 목표 관리</td></tr>
<tr><td>회계·재무</td><td>C, E</td><td>기준에 맞춘 기록과 검증</td></tr>
</table>
<p class="small">표의 유형은 이해를 돕는 예시입니다. 실제 업무 구성은 회사마다 다르며, PART 3 직무분석에서 직접 확인합니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>지원동기에서 제가 보는 것이 일치성입니다. 이 일을 하면 날마다 무엇을 반복하게 되는지 아는가, 그리고 그 반복이 이 사람에게 힘이 되는가.</p></div>
<div class="compare"><div class="bad">어릴 때부터 사람을 좋아해 영업 직무에 지원했습니다.</div><div class="good">처음 보는 사람을 설득해 결정을 끌어낼 때 가장 힘이 났습니다. 축제 협찬을 받으려 상가 열두 곳을 돌며 제안서를 고쳐 쓴 일이 그랬습니다.</div></div></div><div class="pf">59</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-14</span>강점은 형용사가 아니라 행동입니다</h2>
<p>"저는 꼼꼼합니다", "소통을 잘합니다". 강점을 물으면 대부분 형용사로 대답합니다. 그런데 형용사는 확인할 방법이 없습니다. 읽는 사람이 믿을지 말지만 남습니다.</p>
<p>강점을 <span class="hl">행동 언어</span>로 바꾸면 달라집니다. 행동 언어란 '어떤 상황에서, 무엇을, 어떻게 했는지'가 보이는 동사 중심의 표현입니다. 다른 사람이 따라 할 수 있을 만큼 구체적이면 잘 바꾼 것입니다.</p>
<table class="tbl"><tr><th style="width:26%">형용사</th><th>행동 언어로 바꾸면</th></tr>
<tr><td>꼼꼼하다</td><td>제출 전 항목별 확인표를 만들어 두 번 점검한다</td></tr>
<tr><td>소통을 잘한다</td><td>회의가 끝나면 결정 사항을 정리해 바로 공유한다</td></tr>
<tr><td>리더십이 있다</td><td>막힌 일을 쪼개 각자 맡을 부분을 먼저 제안한다</td></tr>
<tr><td>끈기가 있다</td><td>실패한 실험 조건을 기록해 하나씩 바꿔 다시 한다</td></tr>
</table>
<div class="compare"><div class="bad">저는 책임감이 강하고 꼼꼼한 성격입니다.</div><div class="good">저는 맡은 일의 마감을 사흘 앞당겨 잡고, 남는 시간에 확인표로 다시 점검합니다.</div></div>
<div class="box key"><span class="box-label">핵심</span><p>바꾼 문장 끝에 "예를 들면"을 붙여 장면 하나가 바로 떠오르면, 그 강점은 쓸 수 있는 강점입니다.</p></div></div><div class="pf">60</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-15</span>강점 기반 접근: 재능에 투자하기</h2>
<p>긍정심리학은 약점을 고치는 일보다 이미 가진 강점을 찾아 키우는 일에 관심을 둡니다. 크리스토퍼 피터슨과 마틴 셀리그만은 여러 문화에서 공통으로 존중받는 성격 강점을 6개 덕목(지혜, 용기, 인간애, 정의, 절제, 초월) 아래 24개 강점으로 정리했습니다. 갤럽의 도널드 클리프턴은 재능과 강점을 구분했습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>재능</b> 자연스럽게 반복되는 생각, 느낌, 행동의 패턴<br><b>투자</b> 연습하고 지식과 기술을 쌓는 데 들인 시간<br><b>강점</b> 재능에 투자가 더해져 일관되게 좋은 결과를 내는 상태</p></div>
<p>이 구분은 자기소개서에서 특히 중요합니다. "저는 꼼꼼합니다"는 재능을 말했을 뿐입니다. 기업이 알고 싶은 것은 <span class="hl">그 재능에 무엇을 투자해 어떤 결과를 반복해서 냈는가</span>, 곧 강점입니다.</p>
<div class="example"><span class="ex-label">예시: 경영학과 지민</span>
재능: 숫자가 맞지 않으면 불편해서 끝까지 확인한다.<br>
투자: 전산회계 자격증을 준비하고, 동아리 장부를 스프레드시트 함수로 다시 짰다.<br>
강점: 동아리 회계를 1년 맡는 동안 학기 말 감사에서 한 번도 수정 요청을 받지 않았다.</div>
<div class="box tip"><span class="box-label">팁</span><p>성격 강점 검사를 받아 보았다면 결과 이름(예: 공정성, 신중함)을 그대로 옮겨 적지 마세요. 결과는 출발점이고, 증거는 언제나 행동이어야 합니다.</p></div>
<p class="src">출처: Christopher Peterson·Martin E. P. Seligman, 『Character Strengths and Virtues』(2004) / Donald O. Clifton의 강점 연구(Gallup)</p></div><div class="pf">61</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-16</span>약점을 말하는 법</h2>
<p>약점 문항에서 지원자는 두 가지 극단으로 갑니다. 하나는 "완벽주의라서 너무 열심히 한다"처럼 장점을 약점인 척 포장하는 것, 다른 하나는 직무에 치명적인 약점을 솔직하게 털어놓는 것입니다. 둘 다 좋은 인상을 남기기 어렵습니다.</p>
<h3>두 가지 원칙</h3>
<ol class="steps"><li><b>강점 뒤집기</b>약점은 대개 강점의 그림자입니다. 꼼꼼함의 그림자는 느린 속도, 추진력의 그림자는 성급함입니다. 내 강점의 뒷면에서 약점을 찾으면 진솔하면서도 균형이 잡힙니다.</li><li><b>보완 노력을 함께 말하기</b>약점 자체보다 그것을 알고 어떻게 다루고 있는지가 평가됩니다. 지금 실제로 하고 있는 방법을 구체적으로 붙입니다.</li></ol>
<div class="compare stack"><div class="bad">제 단점은 완벽주의입니다. 일을 너무 잘하려다 보니 스스로를 힘들게 합니다.</div><div class="good">한 부분을 오래 붙잡다가 전체 일정이 밀린 적이 있습니다. 그 뒤로는 작업을 시작할 때 단계마다 끝낼 시각을 먼저 적어 두고, 시각이 되면 80% 상태로라도 다음 단계로 넘어갑니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 약점 대답에서 '자기를 관찰하는 힘'을 봅니다. 약점을 정확히 아는 사람은 입사 후에도 스스로 고쳐 나갑니다.</p></div></div><div class="pf">62</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 2-4</span><h2>강점·약점 증거 찾기</h2></div>
<div class="ws-guide">강점 세 개와 약점 한 개를 적고 증거 장면을 붙입니다. 증거 칸이 비면 아직 쓸 수 없는 강점입니다.</div>
<table class="ws-table"><tr><th style="width:19%">구분</th><th style="width:37%">행동 언어로 쓴 강점</th><th>증거가 되는 장면</th></tr>
<tr><td class="lbl">강점 1</td><td><textarea class="f" data-k="ws2-4-t-r1c1" rows="3" placeholder="예) 회의 결정 사항을 바로 정리해 공유한다"></textarea></td><td><textarea class="f" data-k="ws2-4-t-r1c2" rows="3" placeholder="예) 학과 학생회 회의록을 1년간 당일 공유"></textarea></td></tr>
<tr><td class="lbl">강점 2</td><td><textarea class="f" data-k="ws2-4-t-r2c1" rows="3"></textarea></td><td><textarea class="f" data-k="ws2-4-t-r2c2" rows="3"></textarea></td></tr>
<tr><td class="lbl">강점 3</td><td><textarea class="f" data-k="ws2-4-t-r3c1" rows="3"></textarea></td><td><textarea class="f" data-k="ws2-4-t-r3c2" rows="3"></textarea></td></tr>
</table>
<table class="ws-table"><tr><th style="width:19%">구분</th><th style="width:37%">약점(어느 강점의 그림자인가)</th><th>지금 하고 있는 보완 노력</th></tr>
<tr><td class="lbl">약점</td><td><textarea class="f" data-k="ws2-4-w1" rows="2"></textarea></td><td><textarea class="f" data-k="ws2-4-w2" rows="2"></textarea></td></tr>
<tr><td class="lbl">보완 결과</td><td colspan="2"><textarea class="f" data-k="ws2-4-w3" rows="2" placeholder="보완 노력으로 달라진 점이 있다면 적어 보세요"></textarea></td></tr>
</table>
<p class="ws-q">세 강점 중 지원 직무에 가장 필요한 것은 무엇이며, 왜 그런가요?</p>
<textarea class="f" data-k="ws2-4-q1" rows="2"></textarea>
<ul class="ws-check"><li><label><input type="checkbox" class="f" data-k="ws2-4-c1">강점을 모두 동사로 끝나는 문장으로 썼다</label></li><li><label><input type="checkbox" class="f" data-k="ws2-4-c2">약점이 지원 직무의 핵심 역량과 정면으로 충돌하지 않는다</label></li></ul></div><div class="pf">63</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-17</span>자기효능감: 자신 있는 문장의 근거</h2>
<p>사회인지진로이론(SCCT)은 렌트, 브라운, 해킷이 반두라의 사회인지이론을 진로에 적용한 이론입니다. 진로 선택을 세 가지 요인이 서로 주고받는 과정으로 설명합니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>자기효능감</b> "나는 이 일을 해낼 수 있다"는 믿음<br><b>결과기대</b> "이 일을 하면 이런 결과가 올 것이다"라는 예상<br><b>목표</b> 그 결과를 위해 무엇을 얼마나 하겠다는 결심<br>자기효능감과 결과기대가 흥미를 키우고, 흥미가 목표와 행동으로 이어진다고 봅니다.</p></div>
<p>반두라는 자기효능감이 네 경로로 만들어진다고 했습니다. 직접 해낸 경험(성취 경험), 남이 해내는 것을 본 경험(대리 경험), 주변의 격려(언어적 설득), 그리고 몸과 마음의 상태입니다. 가장 힘이 센 것은 <span class="hl">직접 해낸 경험</span>입니다.</p>
<p>"자신 있습니다"가 공허하게 들리는 이유가 여기 있습니다. 자신감의 근거인 성취 경험을 빼고 결론만 말했기 때문입니다.</p>
<div class="compare"><div class="bad">어떤 업무든 빠르게 배워 잘 해낼 자신이 있습니다.</div><div class="good">처음 써 보는 회계 프로그램을 2주 만에 익혀 동아리 결산을 맡았습니다. 새 업무 시스템도 같은 방식으로 익히겠습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>자신감은 형용사가 아니라 이력에서 나옵니다. "해 봤기 때문에 할 수 있다"는 문장이 가장 설득력 있습니다.</p></div>
<p class="src">출처: Robert W. Lent·Steven D. Brown·Gail Hackett, 사회인지진로이론(1994) / Albert Bandura, 『Self-Efficacy: The Exercise of Control』(1997)</p></div><div class="pf">64</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-18</span>남이 보는 나: 조하리의 창</h2>
<p>혼자 하는 자기분석에는 한계가 있습니다. 내가 당연하게 하는 행동은 나에게 보이지 않기 때문입니다. 심리학자 조셉 러프트와 해리 잉햄이 만든 '조하리의 창'은 나를 네 개의 창으로 나누어 봅니다.</p>
<table class="tbl"><tr><th style="width:24%"></th><th>내가 아는 나</th><th>내가 모르는 나</th></tr>
<tr><td><b>남이 아는 나</b></td><td><b>열린 창</b><br>나도 남도 아는 모습</td><td><b>보이지 않는 창</b><br>남은 아는데 나만 모르는 모습</td></tr>
<tr><td><b>남이 모르는 나</b></td><td><b>숨겨진 창</b><br>나만 알고 드러내지 않은 모습</td><td><b>미지의 창</b><br>아직 아무도 모르는 가능성</td></tr>
</table>
<p>자기소개서에서 특히 쓸모 있는 것은 <span class="hl">보이지 않는 창</span>입니다. 간호학과 서연은 스스로를 평범하다고 여겼는데, 실습 동기들은 하나같이 "환자 보호자에게 설명을 제일 쉽게 하는 사람"이라고 말했습니다. 서연은 그제야 그것을 자신의 강점으로 쓰기 시작했습니다.</p>
<div class="box tip"><span class="box-label">팁</span><p>피드백을 부탁할 때는 "나 어때?"라고 묻지 마세요. "같이 일할 때 내가 자주 하는 행동이 뭐였어?"처럼 행동을 물어야 쓸 수 있는 대답이 돌아옵니다.</p></div></div><div class="pf">65</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 2-5</span><h2>주변 3인 피드백 조사지</h2></div>
<div class="ws-guide">가족, 친구, 함께 일하거나 활동해 본 사람처럼 나를 서로 다른 자리에서 본 세 사람에게 묻고 받은 말을 그대로 옮겨 적습니다.</div>

<textarea class="f" data-k="ws2-5-q2" rows="2"></textarea>
<p class="ws-q">3. 그 말을 뒷받침하는 나의 경험을 하나 떠올려 적어 보세요.</p>
<textarea class="f" data-k="ws2-5-q3" rows="2"></textarea></div><div class="pf">66</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-19</span>경험 인벤토리: 작은 경험도 재료입니다</h2>
<p>"저는 내세울 만한 경험이 없어요." 제 수업에서 가장 자주 듣는 말입니다. 그런데 이야기를 나눠 보면 거의 모든 학생에게 쓸 만한 장면이 있습니다. 다만 <span class="hl">그것을 경험이라고 부르지 않았을 뿐</span>입니다.</p>
<p>경험 인벤토리는 해 온 일을 크기와 상관없이 창고에 쌓아 두는 목록입니다. 수상 실적이나 해외 연수만 경험이 아닙니다. 편의점 아르바이트에서 재고 정리 순서를 바꾼 일, 조별과제에서 아무도 맡지 않던 발표 자료를 맡은 일도 훌륭한 재료입니다.</p>
<div class="compare"><div class="bad">"그냥 카페 알바만 했어요. 쓸 게 없어요."</div><div class="good">"주말 피크 시간에 주문이 밀려서, 음료별 준비 순서를 바꿔 보자고 점장님께 제안했어요."</div></div>
<h3>인벤토리를 채우는 요령</h3>
<ul><li>평가하지 말고 일단 적습니다. 고르는 일은 나중에 합니다.</li><li>결과보다 그 안에서 <b>내가 맡은 역할과 행동</b>을 적습니다.</li><li>기간, 인원, 숫자처럼 확인 가능한 정보는 기억날 때 함께 적어 둡니다.</li></ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>경험의 크기로 지원자를 나누지 않습니다. 작은 일에서 스스로 무엇을 생각하고 바꿨는지가 훨씬 많은 것을 말해 줍니다.</p></div></div><div class="pf">67</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-20</span>계획된 우연: 우연을 기회로 바꾼 기록</h2>
<p>"그 동아리는 친구 따라 우연히 들어간 거라 쓸 게 없어요." 존 크럼볼츠(John D. Krumboltz)는 많은 사람의 진로가 계획보다 예상치 못한 사건에서 시작된다는 데 주목했습니다. 중요한 것은 우연 자체가 아니라 <span class="hl">우연을 기회로 바꾸는 태도와 행동</span>입니다. 이를 계획된 우연(planned happenstance)이라 부릅니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>호기심</b> 새로운 배움의 기회를 탐색한다<br><b>인내</b> 좌절이 있어도 노력을 이어 간다<br><b>유연성</b> 태도와 상황을 바꿀 줄 안다<br><b>낙관성</b> 새 기회를 이룰 수 있는 것으로 본다<br><b>위험 감수</b> 결과가 불확실해도 행동한다</p></div>
<p>우연한 경험은 "우연히 시작했지만, 그다음에 내가 무엇을 했는가"로 쓰면 강한 재료가 됩니다. 경험 인벤토리에서 우연히 시작한 일을 골라 다섯 기술 중 무엇이 들어 있는지 찾아보세요.</p>
<div class="example"><span class="ex-label">예시: 기계공학과 준호</span>
친구 대신 나간 용접 체험 행사(우연)에서 담당 기사에게 현장 견학을 부탁했고(호기심, 위험 감수), 두 번 거절당한 끝에 현장실습 기회를 얻었습니다(인내).</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 "원래 꿈이었다"는 동기보다 "우연히 접했지만 그 뒤로 이렇게 파고들었다"는 동기를 더 믿습니다. 행동이 증명해 주기 때문입니다.</p></div>
<p class="src">출처: Kathleen E. Mitchell·Al S. Levin·John D. Krumboltz, "Planned Happenstance: Constructing Unexpected Career Opportunities", Journal of Counseling &amp; Development(1999)</p></div><div class="pf">71</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-21</span>나를 설명하는 키워드 뽑기</h2>
<p>여기까지 채웠다면 책상 위에 재료가 꽤 쌓였을 것입니다. 이제 그것을 묶어 <span class="hl">나를 설명하는 키워드 세 개</span>로 줄입니다. 키워드는 자기소개서 전체를 꿰는 실이 됩니다.</p>
<ol class="steps"><li><b>반복되는 단어에 표시한다</b>라이프라인, 가치관, 강점, 피드백, 인벤토리를 펼쳐 놓고 두 번 이상 나온 행동과 단어에 표시합니다.</li><li><b>비슷한 것끼리 묶는다</b>'정리', '기록', '확인표'는 하나의 묶음이 될 수 있습니다.</li><li><b>묶음에 이름을 붙인다</b>"꼼꼼함"보다 "기록으로 실수를 줄이는 사람"처럼 행동이 보이게 짓습니다.</li><li><b>직무와 맞춰 본다</b>지원 직무에 필요한 역량과 닿는 키워드를 앞에 둡니다.</li></ol>
<div class="example"><span class="ex-label">예시: 경영학과 4학년 지민의 키워드</span>
1. 숫자로 확인하는 사람 (동아리 회계 장부 정리, 카페 재고표 작성)<br>
2. 끝까지 남아 마무리하는 사람 (조별과제 최종 편집, 축제 철수 담당)<br>
3. 처음 온 사람을 챙기는 사람 (신입 부원 안내 자료 제작)</div>
<div class="box warn"><span class="box-label">주의</span><p>근거 경험이 하나뿐인 키워드는 아직 키워드가 아닙니다. 최소 두 개의 장면이 받쳐 줄 때 면접의 꼬리 질문을 견딥니다.</p></div></div><div class="pf">72</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-22</span>분석 결과를 기업의 언어로 번역하기</h2>
<p>자기분석의 언어는 나의 언어이고, 서류를 읽는 사람은 기업의 언어로 평가합니다. 키워드를 정했다면 마지막으로 그것을 상대가 쓰는 말로 옮겨야 합니다. 채용 제도와 기업 조사는 다른 장에서 자세히 다루고, 여기서는 번역하는 방법만 익힙니다.</p>
<h3>공기업: 직업기초능력 10영역</h3>
<p>공공기관 채용에서 쓰이는 국가직무능력표준(NCS)은 어떤 직무에든 필요한 능력을 의사소통, 수리, 문제해결, 자기개발, 자원관리, 대인관계, 정보, 기술, 조직이해, 직업윤리의 10개 영역으로 정리합니다.</p>
<h3>사기업: 인재상</h3>
<p>기업마다 인재상의 표현은 다르지만 도전, 협업, 전문성, 고객 지향, 정직 같은 말로 모이는 경우가 많습니다.</p>
<table class="tbl"><tr><th style="width:34%">지민의 키워드</th><th>공기업 언어</th><th>사기업 언어</th></tr>
<tr><td>숫자로 확인하는 사람</td><td>수리능력, 문제해결능력</td><td>전문성, 데이터 기반 판단</td></tr>
<tr><td>끝까지 남아 마무리하는 사람</td><td>직업윤리, 자원관리능력</td><td>책임감, 실행력</td></tr>
<tr><td>처음 온 사람을 챙기는 사람</td><td>대인관계능력, 의사소통능력</td><td>협업, 고객 지향</td></tr>
</table>
<div class="box warn"><span class="box-label">주의</span><p>번역은 경험을 바꾸는 일이 아닙니다. 증거가 되는 장면은 그대로 두고, 그 장면을 부르는 이름만 상대의 언어로 바꿉니다. 회사에 맞춰 나를 바꾸는 것과는 순서가 정반대입니다.</p></div></div><div class="pf">74</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-23</span>자기분석 단계에서 자주 하는 실수</h2>
<p>수업에서 워크시트를 걷어 보면 비슷한 실수가 되풀이됩니다.</p>
<h4>1. 검사 결과를 나 자신으로 착각한다</h4>
<p>검사의 유형 이름을 그대로 옮겨 적는 경우가 많습니다. 검사는 방향일 뿐, 증거는 나의 경험에서 나와야 합니다.</p>
<h4>2. 좋은 경험만 고른다</h4>
<p>실패하고 후회한 일을 빼면 재료의 절반을 버리는 셈입니다. 실패 경험 문항은 대부분의 기업이 묻습니다.</p>
<h4>3. 감정만 적고 행동을 적지 않는다</h4>
<p>"힘들었다", "뿌듯했다"만 남은 기록은 나중에 쓸 수 없습니다. 그때 무엇을 했는지가 있어야 합니다.</p>
<h4>4. 회사에 맞춰 나를 바꾼다</h4>
<p>인재상을 먼저 보고 거기에 맞는 사람인 척 분석을 끼워 맞추면, 면접에서 반드시 어긋납니다. 순서는 나를 먼저, 회사는 그다음입니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>인재상 단어를 그대로 옮겨 온 글은 금방 눈에 띕니다. 지원자 자신의 언어로 쓴 글이 더 오래 읽힙니다.</p></div></div><div class="pf">75</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 2-10</span><h2>자기분석 종합 시트</h2></div>
