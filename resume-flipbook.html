<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-5</span>협업·갈등 해결: 함께 일할 수 있는 사람인가</h2>
<p>회사 일은 대부분 여럿이 합니다. 그래서 면접관은 이 문항에서 <span class="hl">갈등의 원인을 어떻게 읽었고, 그 안에서 내가 맡은 역할이 무엇이었는가</span>를 봅니다. 갈등이 있었다는 사실은 감점이 아닙니다. 갈등을 다루는 방식이 점수입니다.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>상황과 원인</b>무엇 때문에 의견이 갈렸는지 사실대로</li>
<li><b>상대의 입장</b>상대가 그렇게 행동한 이유를 내가 어떻게 이해했는지</li>
<li><b>나의 조율 행동</b>대화, 역할 조정, 기준 마련 등 구체적인 행동</li>
<li><b>결과와 배움</b>일의 결과와 관계의 결과, 그리고 지금의 습관</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>무임승차한 팀원 탓으로 채워진 글</li><li>"결국 제가 다 맡아서 끝냈습니다"로 끝나는 혼자만의 해결</li><li>"소통이 중요하다는 것을 배웠습니다"처럼 누구나 쓰는 결론</li></ul></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>혼자 다 해냈다는 글을 읽으면 저는 오히려 걱정이 됩니다. 입사 후에도 혼자 떠안다가 지칠 사람으로 보이기 때문입니다. 함께 일하게 만든 과정을 쓰세요.</p></div></div><div class="pf">176</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>협업·갈등, 고치기 전과 후</h2>
<p>산업디자인학과 4학년 유진이 서비스 기획 직무에 낸 초안입니다.</p>
<div class="compare stack"><div class="bad">조별 과제에서 한 팀원이 연락이 잘 되지 않아 갈등이 있었습니다. 저는 팀장으로서 책임감을 갖고 그 팀원의 몫까지 맡아 밤을 새워 과제를 완성했고, A+를 받았습니다. 이 경험으로 소통의 중요성을 배웠습니다.</div>
<div class="good">[역할을 다시 나누자 대화가 시작됐습니다] 앱 디자인 과제에서 한 팀원이 회의에 자주 빠져 팀 분위기가 나빠졌습니다. 따로 만나 이야기해 보니 그 팀원은 아르바이트 때문에 회의 시간을 맞추기 어려웠고, 맡은 화면 작업이 본인에게 낯설어 진행을 미루고 있었습니다.<br>저는 회의 시간을 바꾸는 대신 공유 문서에 각자 진행 상황을 적는 방식을 제안했고, 그 팀원이 잘하는 사용자 인터뷰를 맡도록 역할을 바꿨습니다. 그 팀원이 인터뷰 열 건을 정리해 온 덕분에 화면 설계의 근거가 탄탄해졌습니다. 이후로 저는 팀 작업을 시작할 때 각자 잘하는 일과 가능한 시간을 먼저 묻습니다.</div></div>
<div class="box key"><span class="box-label">핵심</span>
<p>고친 글에서 상대는 "문제 팀원"이 아니라 "사정이 있는 동료"로 나옵니다. 상대를 이해한 문장이 하나 들어가는 순간, 글쓴이의 협업 태도가 보입니다.</p></div></div><div class="pf">177</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-6</span>실패·도전 극복: 넘어진 뒤에 무엇을 했나</h2>
<p>이 문항에서 면접관이 보는 것은 실패의 크기가 아닙니다. <span class="hl">실패의 원인을 자기 몫에서 찾고, 다음 시도에서 행동을 바꾸었는가</span>입니다. 회사에서도 일은 자주 틀어집니다. 그때 다시 일어서는 방식을 미리 보고 싶은 것입니다.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>도전 목표</b>무엇을 왜 하려 했는지</li>
<li><b>실패의 사실</b>결과를 꾸미지 않고 담백하게</li>
<li><b>원인 분석</b>환경이 아니라 내가 바꿀 수 있었던 부분</li>
<li><b>바꾼 행동과 다음 결과</b>두 번째 시도에서 달라진 점</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>"아깝게 2등을 했습니다"처럼 실패가 아닌 실패</li><li>심사 기준, 팀원, 시간 부족 등 바깥에서 찾은 원인</li><li>"포기하지 않는 끈기를 배웠다"로 끝나고 행동 변화가 없는 글</li></ul></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>실패 이야기를 담담하게 쓰는 지원자에게 저는 신뢰가 갑니다. 실패를 인정하는 문장이 짧고 분명할수록, 그 뒤에 이어지는 극복이 더 믿음직하게 읽힙니다.</p></div></div><div class="pf">179</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>실패·도전, 완성 예문</h2>
<p>전자공학과 4학년 태윤이 반도체 공정 엔지니어 직무에 낸 글입니다.</p>
<div class="example"><span class="ex-label">예문 · 실패와 극복</span>
[첫 공모전 탈락이 알려 준 것] 3학년 때 친구 둘과 스마트 화분을 만들어 교내 창업 공모전에 나갔지만 예선에서 떨어졌습니다. 심사평은 "기능은 많지만 왜 필요한지 보이지 않는다"였습니다.<br>
처음에는 심사 기준이 아쉬웠지만, 발표 자료를 다시 보니 이유가 분명했습니다. 저희는 센서를 몇 개 달았는지만 설명했고, 누가 어떤 불편 때문에 쓰는지는 한 줄도 없었습니다. 만들기 전에 사용자를 만나지 않은 것이 제 실수였습니다.<br>
다음 학기에는 순서를 바꿨습니다. 기숙사생 스무 명에게 화분을 키우다 실패한 이유를 먼저 물었고, 대부분이 물 주는 때를 놓친다는 답을 듣고 기능을 수분 알림 하나로 줄였습니다. 같은 공모전에서 본선에 올랐습니다.<br>
공정 엔지니어의 일도 문제의 원인을 정확히 정의하는 데서 시작한다고 생각합니다. 결과가 나쁠 때 바깥보다 제 과정부터 점검하는 습관으로 일하겠습니다.</div>
<div class="box key"><span class="box-label">핵심</span>
<p>"제 실수였습니다"라는 한 문장이 이 글의 중심입니다. 원인을 자기 몫에서 찾았기 때문에 다음 행동의 변화가 설득력을 얻습니다.</p></div></div><div class="pf">180</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-7</span>입사 후 포부: 이 회사에서의 내 시간표</h2>
<p>포부 문항에서 면접관이 보는 것은 꿈의 크기가 아니라 <span class="hl">현실성</span>입니다. 이 직무가 실제로 어떤 일을 하는지 알고, 그 안에서 단계를 밟아 성장할 계획이 있는 사람인지, 그리고 오래 함께할 사람인지를 확인합니다.</p>
<p>그래서 포부는 시간표로 쓰는 것이 좋습니다. 입사 첫해, 3년 안팎, 그 이후로 나누고 각 시기에 내가 할 일을 동사로 적으면 막연함이 사라집니다.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>입사 초기</b>업무 기본기와 적응을 위해 할 구체적 행동</li>
<li><b>성장기</b>맡은 영역에서 쌓을 전문성과 성과</li>
<li><b>기여기</b>팀과 회사에 돌려줄 수 있는 것</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>"최고의 전문가가 되겠습니다", "CEO가 되겠습니다" 같은 선언</li><li>"많이 배우고 싶습니다"처럼 회사에 바라는 것만 있는 글</li><li>기간도 방법도 없이 다짐만 반복하는 글</li></ul></div>
<div class="box tip"><span class="box-label">팁</span>
<p>PART 4에서 조사한 회사의 사업 방향과 직무 소개를 다시 보세요. 포부에 회사가 실제로 하고 있는 일이 한 가지 들어가면 글이 단번에 현실로 내려옵니다.</p></div></div><div class="pf">182</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>입사 후 포부, 고치기 전과 후</h2>
<p>무역학과 4학년 하은이 중견 제조사 해외영업 직무에 낸 초안입니다.</p>
<div class="compare stack"><div class="bad">입사 후에는 끊임없이 배우고 노력하여 회사에 꼭 필요한 인재가 되겠습니다. 글로벌 역량을 키워 세계 시장을 누비는 최고의 해외영업 전문가로 성장하겠습니다. 나아가 회사의 비전 달성에 앞장서겠습니다.</div>
<div class="good">[첫해는 서류, 3년 차는 거래처, 그 뒤는 시장] 입사 첫해에는 수출 서류와 거래 조건을 정확히 처리하는 기본기를 다지겠습니다. 무역 실무 수업에서 익힌 신용장 조건 검토를 실제 계약서로 반복하며, 선배들의 거래처 메일을 정리해 저만의 응대 사례집을 만들겠습니다.<br>3년 차에는 동남아 거래처 몇 곳을 직접 맡아, 분기마다 거래처별 주문 흐름을 정리해 공유하는 담당자가 되겠습니다. 교환학생 시절 익힌 베트남어로 현지 담당자와 직접 소통하는 것도 강점이 될 것입니다.<br>그 이후에는 회사가 넓히고 있는 동남아 시장에서 새 거래처를 발굴하는 일에 기여하고, 제가 만든 사례집을 후배들과 나누겠습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>고친 글은 거창하지 않지만 그대로 믿을 수 있습니다. 첫해에 무엇을 하겠다는 문장이 구체적일수록, 면접관은 이 사람이 일을 알고 있다고 판단합니다.</p></div></div><div class="pf">183</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 7-7</span><h2>입사 후 포부 쓰기</h2></div>
<div class="ws-guide">PART 3의 직무 분석과 PART 4의 기업 분석을 옆에 두고, 각 시기에 할 일을 동사로 적어 보세요.</div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-8</span>공기업 자기소개서는 무엇이 다른가</h2>
<p>공기업 문항을 처음 본 학생들은 "질문이 다 비슷해 보인다"고 말합니다. 문항 대부분이 PART 1에서 본 직업기초능력 10영역 중 하나를 겨냥해 만들어지기 때문입니다. 그래서 공기업 문항을 받으면 먼저 <span class="hl">"이 문항은 어느 영역을 재는가"</span>를 찾아 문항 옆에 적어 두는 것이 출발점입니다.</p>
<table class="tbl"><tr><th style="width:18%">구분</th><th>공기업</th><th style="width:34%">사기업</th></tr>
<tr><td><b>문항의 뿌리</b></td><td>직업기초능력·직무수행능력. 영역 이름이 문항에 거의 그대로 드러납니다</td><td>회사 인재상과 직무. 회사마다 문항이 다릅니다</td></tr>
<tr><td><b>글자 수</b></td><td>문항 수가 많고 문항당 분량이 짧은 편이 많습니다. 글자 대신 바이트로 세는 기관도 있습니다</td><td>회사마다 차이가 크고, 긴 문항도 흔합니다</td></tr>
<tr><td><b>블라인드</b></td><td>학교명, 출신지, 가족 정보 등을 쓰지 않는 것이 원칙입니다</td><td>회사 방침에 따릅니다</td></tr></table>
<div class="box warn"><span class="box-label">주의</span>
<p>블라인드 위반은 기관에 따라 감점이나 불이익 사유가 될 수 있습니다. 드러내면 안 되는 정보는 6-7에서 정리했습니다. 공고문의 작성 유의사항과 제한 단위(글자인지 바이트인지, 공백 포함인지)를 쓰기 전에 먼저 확인하세요.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>공공기관 서류에서 학교 이름이 지워진 자리에 남는 것은 행동뿐입니다. 그래서 공기업 자기소개서는 행동 문장이 얼마나 촘촘한가로 갈립니다.</p></div></div><div class="pf">185</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-9</span>직업기초능력형 ① 의사소통·대인관계</h2>
<div class="example"><span class="ex-label">문항 예 (가상)</span>상대방의 입장을 고려하여 의견을 조율하고 공동의 목표를 달성한 경험을 구체적으로 기술해 주십시오.</div>
<h3>면접관이 보는 것</h3>
<p>의사소통 문항은 말을 잘하는지를 묻지 않습니다. <span class="hl">상대의 말을 정확히 듣고, 내 뜻을 알아듣게 전달했는가</span>를 봅니다. 대인관계는 그 뒤 관계가 어떻게 유지되었는지입니다. 뼈대는 7-5 협업·갈등 해결과 같으니, 문항에 경청이나 협상 같은 하위 요소가 보이면 그 행동을 장면으로 넣으세요.</p>
<h3>구성 틀</h3>
<ol>
<li><b>입장 차이</b>: 누가 무엇을 원했고 왜 부딪혔는지</li>
<li><b>듣기와 확인</b>: 상대의 요구를 내가 어떻게 파악하고 확인했는지</li>
<li><b>전달과 조율</b>: 합의를 위해 내가 제안한 방법</li>
<li><b>결과와 관계</b>: 목표의 결과와 관계에 남은 것</li>
</ol>
<div class="compare"><div class="bad">팀원들과 원활하게 소통하여 갈등을 해결했습니다.</div>
<div class="good">회의 뒤 각자 말한 요구를 한 장으로 정리해 돌리고 "제가 이해한 것이 맞는지" 답을 받았습니다. 그 표로 역할을 나누자 같은 논쟁이 반복되지 않았습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"소통"이라는 단어가 몇 번 나오는지는 점수가 되지 않습니다. 내가 무엇을 듣고, 무엇을 정리해, 누구에게 어떻게 확인했는지가 보여야 점수를 줄 수 있습니다.</p></div></div><div class="pf">186</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>직업기초능력형 ② 문제해결·자원관리</h2>
<div class="example"><span class="ex-label">문항 예 (가상)</span>시간, 예산, 인력 등 제한된 자원을 효율적으로 활용하여 문제를 해결한 경험을 기술해 주십시오.</div>
<h3>면접관이 보는 것</h3>
<p>이 문항에서 저는 세 가지를 차례로 확인합니다. 문제를 정확히 정의했는가, 대안을 비교하고 기준을 세워 골랐는가, 그리고 <span class="hl">한정된 시간·돈·물자·사람을 어디에 먼저 썼는가</span>입니다. 대안이 하나뿐인 글은 문제해결이 아니라 실행 기록으로 읽히니, 버린 대안도 한 줄 쓰세요.</p>
<h3>구성 틀</h3>
<ol>
<li><b>문제와 제약</b>: 무엇이 문제였고, 무엇이 부족했는지</li>
<li><b>대안과 기준</b>: 검토한 방법들과 그중 하나를 고른 이유</li>
<li><b>자원 배분</b>: 부족한 자원을 어떻게 나누고 아꼈는지</li>
<li><b>결과와 점검</b>: 결과를 무엇으로 확인했는지</li>
</ol>
<div class="example"><span class="ex-label">짧은 예문 · 행정학과 4학년 민재</span>학과 행사 사흘 전, 대여 업체 사정으로 음향 장비 예산이 모자라게 되었습니다. 저는 추가 대여, 학교 장비 대여, 프로그램 축소의 세 가지 안을 비용과 준비 시간으로 비교했고, 학교 장비를 빌리되 운반은 학생회 인원이 맡는 안을 골랐습니다. 남은 예산은 비상 상황에 쓰도록 따로 두었고, 행사는 계획한 순서대로 마쳤습니다.</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>이 예문에서 제가 밑줄을 긋는 곳은 "세 가지 안을 비교했다"는 문장입니다. 면접에서 "왜 그 안을 골랐나요?"라고 물었을 때 답이 바로 나오는 사람이 자원관리 점수를 가져갑니다.</p></div></div><div class="pf">187</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>직업기초능력형 ③ 조직이해·기관 지원동기</h2>
<div class="example"><span class="ex-label">문항 예 (가상)</span>우리 공사의 주요 사업 중 관심 있는 분야를 쓰고, 지원 분야에서 기여할 수 있는 방안을 기술해 주십시오.</div>
<h3>면접관이 보는 것</h3>
<p>사기업 지원동기가 "왜 이 회사인가"라면 공기업은 <span class="hl">"이 기관이 국민에게 하는 일 가운데 어디에 나를 놓을 것인가"</span>를 묻습니다. 기관의 설립 목적과 사업, 그 안에서 지원 직무의 자리를 아는지가 조직이해의 핵심입니다(자료 찾기는 PART 4).</p>
<h3>구성 틀</h3>
<ol>
<li><b>기관의 일</b>: 설립 목적과 이어진 사업 하나</li>
<li><b>직무의 자리</b>: 그 사업에서 지원 직무가 하는 일</li>
<li><b>나의 연결</b>: 그 일과 이어지는 경험</li>
<li><b>기여 방안</b>: 입사 후 할 수 있는 구체적 행동</li>
</ol>
<div class="compare stack"><div class="bad">국민의 삶의 질 향상에 앞장서는 귀 공사의 인재가 되고 싶습니다.</div>
<div class="good">OO공사의 노후 시설 안전점검 사업 중 점검 기록을 관리하는 행정 업무에 관심이 있습니다. 시설관리 아르바이트에서 점검표가 빠지는 것을 보고 한 장짜리 목록으로 바꿔 쓴 경험이 있어, 입사 후 점검 기록이 빠짐없이 쌓이게 하는 일부터 맡겠습니다.</div></div>
<div class="box tip"><span class="box-label">팁</span>
<p>기관명을 가려도 말이 되는 글이라면 다시 쓰세요. 7-1에서 본 회사 이름 가리기 점검은 공기업에서 더 엄격하게 적용됩니다.</p></div></div><div class="pf">188</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>직업기초능력형 ④ 직업윤리·공공성</h2>
<div class="example"><span class="ex-label">문항 예 (가상)</span>원칙과 규정을 지키기 위해 개인적인 손해나 불편을 감수했던 경험을 기술해 주십시오.</div>
<h3>면접관이 보는 것</h3>
<p>공공기관의 일은 국민의 세금과 신뢰 위에서 이루어집니다. 그래서 이 문항은 <span class="hl">원칙이 나의 편의나 이익과 부딪혔을 때 실제로 어떻게 행동했는가</span>를 봅니다. 정직, 공정 같은 단어보다 그 때문에 무언가를 포기한 장면을 찾습니다.</p>
<h3>구성 틀</h3>
<ol>
<li><b>원칙과 유혹</b>: 지키기 어려웠던 규칙과 쉬운 길</li>
<li><b>판단의 근거</b>: 왜 원칙 쪽을 골랐는지</li>
<li><b>행동과 대가</b>: 그래서 감수한 불편이나 손해</li>
<li><b>지금의 기준</b>: 그 일 뒤로 일하는 방식에 남은 것</li>
</ol>
<div class="example"><span class="ex-label">짧은 예문 · 경영학과 4학년 지민</span>카페 마감 정산에서 현금이 장부보다 조금 많았습니다. 함께 마감하던 동료는 다음 날 맞추면 된다고 했지만, 저는 점장님께 그대로 보고하고 영수증을 다시 맞춰 보느라 한 시간 늦게 퇴근했습니다. 원인은 거스름돈 실수였고, 이후 마감 때 두 사람이 따로 세어 비교하는 방식이 생겼습니다.</div>
<p class="small">거창한 이야기를 지어낼 필요는 없습니다. 작은 장면이라도 실제로 감수한 것이 있으면 충분합니다.</p></div><div class="pf">189</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 7-8</span><h2>공기업 직업기초능력 문항 작성</h2></div>
<div class="ws-guide">기관의 실제 문항 하나를 옮겨 적고 겨냥하는 영역부터 찾으세요. 에피소드는 PART 5의 경험기술서에서 고릅니다.</div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-10</span>사기업은 유형마다 강조점이 다르다</h2>
<p>공기업이 같은 잣대를 모든 지원자에게 적용한다면, 사기업은 회사마다 잣대가 다릅니다. 기업 유형별 분석 방법은 4-7에서 보았으니, 여기서는 그 분석이 <span class="hl">자기소개서의 어느 문장에 들어가야 하는가</span>만 정리합니다.</p>
<table class="tbl"><tr><th style="width:17%">유형</th><th>자소서에서 강조할 것</th><th style="width:30%">피할 것</th></tr>
<tr><td><b>대기업</b></td><td>직무 전문성의 증거, 큰 조직에서 협업한 방식, 회사가 제시한 인재상과 맞닿는 행동</td><td>회사 규모와 명성을 칭찬하는 지원동기</td></tr>
<tr><td><b>중견·중소</b></td><td>여러 일을 함께 맡아 본 경험, 빠른 적응, 회사의 주력 제품과 고객을 아는 구체성</td><td>"큰 회사로 가기 위한 경험"으로 읽히는 문장</td></tr>
<tr><td><b>외국계</b></td><td>스스로 정한 목표와 그 결과, 의견을 분명하게 말한 장면, 지원 공고에 적힌 언어 요건을 충족한 근거</td><td>겸손을 이유로 성과를 흐리게 쓰는 것</td></tr>
<tr><td><b>스타트업</b></td><td>지시 없이 시작해 끝까지 해 본 일, 작게 시도하고 고친 과정, 회사가 풀려는 문제에 대한 내 생각</td><td>안정적인 성장, 체계적인 교육을 기대하는 포부</td></tr></table>
<div class="box key"><span class="box-label">핵심</span>
<p>유형이 달라도 에피소드를 새로 만들 필요는 없습니다. 같은 경험에서 어느 단락을 길게 쓸지, 마지막 문장을 무엇으로 맺을지가 달라질 뿐입니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>제가 중소기업 면접에 들어가 가장 반가운 지원자는 그 회사 제품을 실제로 만져 보고 온 사람입니다. 유형별 강조점보다 먼저, 그 회사를 직접 들여다본 흔적이 있어야 합니다.</p></div></div><div class="pf">191</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-11</span>300자, 500자, 1000자로 쓰기</h2>
<p>글자 수에 따른 분량 배분은 6-6에서 보았습니다. 여기서는 같은 경험을 실제로 줄이고 늘려 봅니다. 원칙은 하나입니다. <span class="hl">줄일 때는 장면 하나만 남기고, 늘릴 때는 판단과 행동을 늘린다.</span></p>
<table class="tbl"><tr><th style="width:15%">분량</th><th>남기는 것</th><th style="width:36%">더하는 것</th></tr>
<tr><td><b>300자</b></td><td>결론 한 문장, 핵심 행동 하나, 결과 한 줄</td><td>없음. 배경과 배움은 거의 뺍니다</td></tr>
<tr><td><b>500자</b></td><td>300자 구성 그대로</td><td>문제 상황 한두 문장, 직무와의 연결</td></tr>
<tr><td><b>1000자</b></td><td>500자 구성 그대로</td><td>내가 고민한 대안, 두 번째 행동, 이후 달라진 습관</td></tr></table>
<div class="example"><span class="ex-label">300자 압축 · 통계학과 4학년 현우</span>[버려지는 빵을 숫자로 줄였습니다] 학교 카페에서 매주 남는 빵이 많다는 것을 보고, 석 달 치 판매 기록을 엑셀로 정리했습니다. 요일마다 팔리는 양이 다르다는 것을 확인해 요일별 발주량을 점장님께 제안했고, 이 제안이 받아들여져 폐기량이 줄었습니다. 데이터에서 현장이 바로 쓸 수 있는 결정을 끌어내는 분석가가 되겠습니다.</div>
<div class="box tip"><span class="box-label">늘릴 때의 기준</span>
<p>1000자로 늘릴 때 "왜 요일별로 봤는가", "다른 방법은 없었는가"처럼 면접관이 물을 질문에 미리 답하는 문장을 더하세요. 꾸밈말로 늘린 1000자는 300자보다 약합니다.</p></div></div><div class="pf">192</div></div></div>

<div class="page"><div class="pg opener"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 8</div>
<h1>다 쓴 뒤에<br>진짜 글이 된다</h1>
<p class="lead">초안은 재료를 모아 놓은 상태입니다. 읽는 사람의 눈으로 다시 보고, 덜어 내고, 점검해야 제출할 수 있는 글이 됩니다. 이 장에서는 평가자가 글을 읽는 심리와 가독성, 퇴고와 자가 채점, AI 활용 원칙, 그리고 공기업·사기업 면접으로 넘어가는 다리를 다룹니다.</p>
<ul class="chap-list"><li>01 평가자 심리와 가독성</li><li>02 퇴고 5단계와 자가 채점</li><li>03 생성형 AI 활용 원칙</li><li>04 제출 전 최종 체크리스트</li><li>05 자소서에서 면접으로: 구조화 면접과 꼬리질문</li><li>06 공기업 면접과 사기업 면접</li></ul>
<div class="chap-bar"></div></div><div class="pf">194</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-1</span>평가자의 마음은 첫 문장에서 기운다</h2>
<p>평가표가 아무리 잘 짜여 있어도 서류를 읽는 것은 사람입니다. 사람의 판단에는 잘 알려진 치우침이 있습니다. 퇴고를 시작하기 전에 이 세 가지를 알아 두면 어디부터 고칠지가 분명해집니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<ul><li><b>초두효과</b> 먼저 들어온 정보가 뒤의 정보보다 전체 인상에 더 크게 작용하는 현상. 같은 성격 묘사도 제시 순서에 따라 인상이 달라진다는 실험으로 알려졌습니다.</li>
<li><b>후광효과</b> 한 가지 두드러진 특성에 대한 평가가 다른 특성의 평가까지 끌어올리거나 끌어내리는 현상.</li>
<li><b>대비효과</b> 같은 대상도 바로 앞에 본 대상과 비교되어 더 좋게 또는 더 나쁘게 평가되는 현상. 채용 면접에서도 앞 지원자에 따라 평가가 달라진다는 연구가 있습니다.</li></ul></div>
<h3>그래서 서류에서는</h3>
<p>첫 문장이 인상을 정하고(초두효과), 그 인상이 뒤 문단의 평가까지 물들입니다(후광효과). 내 서류가 몇 번째로 읽힐지는 고를 수 없으니(대비효과) <span class="hl">어느 서류 뒤에 놓여도 버티는 첫 문장</span>이 필요합니다.</p>
<div class="compare"><div class="bad">저는 어려서부터 사람들과 어울리는 것을 좋아하는 활발한 성격이었습니다.</div>
<div class="good">회의 뒤 각자의 요구를 한 장으로 정리해 돌리는 것이 제 협업 방식입니다.</div></div>
<p class="src">출처: S. E. Asch(1946) 인상 형성 연구 · E. L. Thorndike(1920) 평정의 후광효과 · K. N. Wexley 외, 채용 면접의 대비효과 연구</p></div><div class="pf">195</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-2</span>읽히는 글의 모양: 가독성</h2>
<p>내용이 좋아도 읽기 힘들면 평가자는 내용까지 가지 못합니다. 가독성은 꾸밈이 아니라 <span class="hl">읽는 사람의 수고를 줄여 주는 설계</span>입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<ul><li><b>작업기억의 한계</b> 사람이 한 번에 붙잡아 둘 수 있는 정보의 덩어리는 많지 않습니다. 긴 문장은 앞부분을 잊게 하고, 정보를 묶어 주면(청킹) 더 많이 기억합니다.</li>
<li><b>화면 읽기의 시선 흐름</b> 화면의 글은 처음부터 끝까지 읽기보다 위쪽 몇 줄을 가로로 읽고, 그 아래로는 줄의 첫머리를 따라 훑어 내려가는 경향이 관찰되었습니다(F자형 패턴).</li></ul></div>
<h3>자기소개서에 적용하면</h3>
<ul class="checks">
<li><b>문장 길이</b> 한 문장에 한 가지 행동만 담고, 두 줄을 넘으면 나눕니다.</li>
<li><b>단락</b> 한 단락에 한 가지 생각. 단락이 바뀌면 줄을 바꿔 덩어리를 보여 줍니다.</li>
<li><b>소제목</b> 맨 위 한 줄에 글 전체의 결론을 담습니다. 가장 먼저, 가장 확실하게 읽히는 자리입니다.</li>
<li><b>단락 첫머리</b> 훑어 읽어도 뜻이 이어지도록 단락의 첫 문장에 핵심을 둡니다.</li>
</ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>입력창에 줄바꿈 없이 꽉 찬 글을 열면 저도 숨이 막힙니다. 반대로 소제목과 단락 첫 문장만 읽어도 흐름이 잡히는 글은 끝까지 편하게 읽힙니다.</p></div>
<p class="src">출처: G. A. Miller(1956) "The Magical Number Seven, Plus or Minus Two" · J. Nielsen, 웹 읽기 아이트래킹 연구(F자형 패턴)</p></div><div class="pf">196</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-3</span>퇴고 5단계</h2>
<p>제 수업에서 학생들에게 가장 많이 하는 말은 "다 썼으면 이제 절반 왔다"입니다. 퇴고는 맞춤법을 보는 일이 아니라, 면접관의 자리에 앉아 내 글을 처음 읽는 일입니다.</p>
<ol class="steps">
<li><b>하루 묵히기</b>쓴 직후에는 머릿속 내용으로 빈칸을 메워 읽게 됩니다. 최소 하룻밤은 두고 다시 여세요.</li>
<li><b>소리 내어 읽기</b>숨이 차는 문장, 읽다가 멈칫하는 곳이 고칠 곳입니다. 한 문장이 두 줄을 넘으면 나눕니다.</li>
<li><b>덜어내기</b>"정말", "매우", "다양한" 같은 꾸밈말과 같은 뜻을 반복한 문장을 지웁니다. 글자 수가 남아도 지웁니다.</li>
<li><b>두괄식 점검</b>각 단락의 첫 문장만 이어 읽어 보세요. 그것만으로 내 주장이 전달되어야 합니다.</li>
<li><b>사실·형식 확인</b>숫자, 기간, 고유명사, 회사명과 직무명, 글자 수 제한을 마지막으로 확인합니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 서류를 읽다가 다른 회사 이름이 나오면 그 뒤를 읽지 않습니다. 실력의 문제가 아니라 성의의 문제로 보이기 때문입니다. 마지막 단계는 절대 건너뛰지 마세요.</p></div></div><div class="pf">197</div></div></div>
<div class="page"><div class="pg ws"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="ws-head"><span class="ws-tag">WORKSHEET 8-1</span><h2>면접관 평가표로 자가 채점</h2></div>
<div class="ws-guide">PART 7에서 쓴 완성본 하나를 골라, 면접관의 눈으로 항목마다 1점(부족)부터 5점(충분)까지 매겨 보세요.</div>
<p class="ws-q">채점할 문항</p>

<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-4</span>생성형 AI, 이렇게 쓰세요</h2>
<p>요즘 제 수업의 학생들은 대부분 AI 도구를 써 봅니다. 저는 쓰지 말라고 하지 않습니다. 다만 <span class="hl">AI는 편집자이지 작가가 아니다</span>라는 원칙을 지키라고 합니다.</p>
<div class="cards"><div class="card"><b>써도 되는 일</b>초안의 논리 점검, 문항 의도에 맞는지 묻기, 긴 문장 나누기, 반복 표현 찾기, 예상 질문 뽑기</div><div class="card"><b>하면 안 되는 일</b>없는 경험 만들기, 수치 부풀리기, 회사 정보를 확인 없이 옮기기, 결과를 그대로 붙여 넣기</div></div>
<div class="box warn"><span class="box-label">주의</span>
<p>지어낸 경험은 면접 첫 꼬리질문에서 무너집니다. 또 기업에 따라 제출 서류의 유사도를 확인하는 경우도 있을 수 있으니, AI가 써 준 문장을 그대로 내는 것은 피하세요. 모든 문장은 내 말투로 다시 써야 합니다.</p></div>
<h3>쓸 만한 요청 예</h3>
<div class="example"><span class="ex-label">요청 1 · 문항 의도 점검</span>아래는 '직무역량' 문항에 쓴 자기소개서입니다. 면접관 입장에서 문항 의도에 맞지 않는 부분과 근거가 부족한 주장을 찾아 주세요. 문장을 새로 써 주지는 말고 지적만 해 주세요.</div>
<div class="example"><span class="ex-label">요청 2 · 문장 다듬기</span>다음 글에서 두 줄이 넘는 문장과 꾸밈말을 찾아 표시하고, 의미를 바꾸지 않고 짧게 나누는 방법을 제안해 주세요. 내용은 추가하지 마세요.</div>
<div class="example"><span class="ex-label">요청 3 · 예상 질문</span>이 자기소개서를 읽은 면접관이 물을 만한 꼬리질문 열 개를 문단별로 뽑아 주세요.</div></div><div class="pf">199</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-5</span>자소서에서 면접으로</h2>
<p>서류를 통과하면 그 자기소개서는 면접관의 손에 들려 면접장에 들어옵니다. 저는 면접 전에 지원자의 자기소개서를 읽으며 질문할 곳에 표시를 해 둡니다. 그러니 <span class="hl">내 자소서가 곧 면접 질문지</span>입니다.</p>
<h3>예상 질문 뽑는 방법</h3>
<ol class="steps">
<li><b>밑줄 긋기</b>숫자, 고유명사, "~했습니다"로 끝나는 행동 문장에 밑줄을 긋습니다. 면접관도 같은 곳에 표시합니다.</li>
<li><b>꼬리질문 세 가지</b>밑줄마다 "왜 그렇게 했나요?", "구체적으로 어떻게 했나요?", "다시 한다면 무엇을 바꾸겠나요?"를 붙여 봅니다.</li>
<li><b>약한 고리 찾기</b>내가 답하기 가장 불편한 질문에 별도 표시를 합니다. 그 질문이 가장 먼저 나온다고 생각하세요.</li>
<li><b>1분 답변 메모</b>결론 한 문장과 근거 두 개만 적습니다. 외울 원고가 아니라 말할 순서입니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>자기소개서와 면접 답변이 어긋나는 순간 면접관은 고개를 갸웃합니다. 반대로 서류에 쓴 장면을 더 자세히, 더 생생하게 말하는 지원자를 만나면 저는 그 글을 다시 펼쳐 봅니다. 글과 말이 같은 사람이라는 것이 가장 강한 신뢰입니다.</p></div></div><div class="pf">201</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-6</span>구조화 면접은 자소서 문장을 파고든다</h2>
<p>요즘 많은 기업과 공공기관의 면접은 즉흥 질문보다 미리 설계된 질문과 기준으로 진행됩니다. 이 방식을 알면 내 자기소개서의 어느 문장이 질문이 될지 미리 볼 수 있습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<ul><li><b>구조화 면접</b> 직무 분석을 바탕으로 질문과 평가 척도를 미리 정하고, 모든 지원자에게 같은 방식으로 적용하는 면접. 인사 선발 연구에서 비구조화 면접보다 직무 성과를 더 잘 예측하는 것으로 거듭 보고되었습니다.</li>
<li><b>행동사건면접(BEI)</b> 과거에 실제로 한 행동을 구체적으로 묻는 방식. 과거의 행동이 미래 행동을 가장 잘 알려 준다는 전제에서 출발합니다.</li></ul></div>
<h3>꼬리질문은 이렇게 뽑힙니다</h3>
<table class="tbl"><tr><th style="width:34%">자소서 문장</th><th>면접관의 꼬리질문 순서</th></tr>
<tr><td>"요일별 발주량을 점장님께 제안했습니다."</td><td>그때 어떤 상황이었나요? 그 일을 누가 시켰나요? 어떤 자료를 어떻게 정리했나요? 점장님이 반대했다면? 폐기량이 줄었다는 것은 어떻게 확인했나요?</td></tr></table>
<p>STAR의 각 칸을 한 단계 더 깊이 내려가는 질문입니다. 대비법도 여기서 나옵니다. PART 5에서 쓴 경험기술서의 칸마다 <span class="hl">"그다음은요?"를 두 번 더 물어 답을 적어 두세요.</span> 그리고 "우리"가 아니라 "나"의 행동으로 말할 수 있는지 확인합니다.</p>
<p class="src">출처: F. L. Schmidt · J. E. Hunter(1998) 인사 선발 방법의 타당도 메타분석 · D. C. McClelland의 행동사건면접 · L. M. Spencer · S. M. Spencer, Competence at Work(1993)</p></div><div class="pf">202</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 8 · 퇴고와 점검</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">8-7</span>공기업 면접과 사기업 면접</h2>
<p>서류에서 면접으로 넘어가는 다리도 공기업과 사기업이 조금 다릅니다. 공기업은 블라인드 면접이 원칙이라 면접관 손에 인적 정보 대신 <span class="hl">자기소개서와 경험기술서가 거의 유일한 자료</span>로 들려 있는 경우가 많습니다. 서류의 문장 하나하나가 그대로 질문지가 됩니다.</p>
<table class="tbl"><tr><th style="width:21%">면접 형태</th><th>무엇을 보나</th><th style="width:33%">자소서와의 연결</th></tr>
<tr><td><b>경험면접</b></td><td>과거 행동으로 직업기초능력 확인</td><td>문항별 에피소드가 질문의 출발점</td></tr>
<tr><td><b>상황면접</b></td><td>직무에서 생길 법한 가상 상황에서의 판단</td><td>직업윤리·공공성 문항에 쓴 기준과 같은 답인지</td></tr>
<tr><td><b>직무 PT</b></td><td>주어진 과제를 분석하고 발표하는 능력</td><td>조직이해 문항의 기관 사업 이해가 바탕</td></tr>
<tr><td><b>토론</b></td><td>다른 의견을 듣고 조율하는 태도</td><td>의사소통·대인관계 문항의 행동이 실제로 나오는지</td></tr></table>
<p>사기업은 회사에 따라 면접 구성이 크게 다르고, 면접관의 재량도 넓은 편입니다. 실무진 면접에서는 직무 경험을 깊이 묻고, 임원 면접에서는 회사와 산업에 대한 생각, 조직에 맞는 사람인지를 묻는 경우가 많습니다. 형태는 지원하는 회사의 전형 안내에서 반드시 확인하세요.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>공공기관 면접에서 저는 서류에 쓴 기준을 상황 질문으로 다시 확인합니다. "원칙을 지켰다"고 쓴 사람이 가상 상황에서 쉬운 길을 고르면 두 답이 모두 흔들립니다. 서류와 면접에서 같은 사람이 되세요.</p></div></div><div class="pf">203</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>맺음말</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>맺음말</h2>
<p>면접장에서 저는 수많은 지원자를 만납니다. 긴장해서 목소리가 떨리는 사람, 준비한 답을 잊어 한참 말을 고르는 사람도 있습니다. 그런데 그런 순간에도 제 마음에 남는 사람은 따로 있습니다. 자기 이야기를 자기 말로 하는 사람입니다.</p>
<p>이 책에서 여러분은 자신을 들여다보고, 직무와 회사를 조사하고, 경험을 이야기로 바꾸고, 문항마다 한 편씩 글을 써 보았습니다. 빈칸을 채우는 일이 쉽지 않았을 것입니다. 그 빈칸 하나하나가 여러분이 지나온 시간이었고, 이제 그 시간이 여러분의 언어가 되었습니다.</p>
<p>서류에서 떨어지는 날도 있을 것입니다. 그것은 여러분이 부족하다는 뜻이 아니라, 그 자리와 이번에는 맞지 않았다는 뜻일 때가 많습니다. 떨어진 자기소개서를 버리지 말고 WORKSHEET 8-1의 평가표로 다시 채점해 보세요. 고친 만큼 다음 글은 분명히 나아집니다.</p>
<p>면접관의 자리에서 한 가지만 약속드릴 수 있습니다. 저희는 화려한 문장을 찾지 않습니다. <span class="hl">이 사람과 함께 일하고 싶은가</span>를 찾습니다. 여러분이 이 책에 적어 넣은 진짜 장면들이 그 질문에 대한 가장 좋은 답입니다.</p>
<p>언젠가 면접장에서, 혹은 같은 회사의 복도에서 여러분을 만나게 되기를 기다리겠습니다. 끝까지 함께해 주셔서 고맙습니다.</p>
<div class="quote">자기 이야기를 자기 말로 하는 사람이 결국 기억에 남습니다.<small>이미영</small></div></div><div class="pf">205</div></div></div>
<div class="page" data-density="hard"><div class="pg cover"><div class="rh"><span></span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="cv back">
<div class="big">"저는 성실합니다"라는 말 대신<br>성실했던 장면 하나를 보여 주세요.</div>
<p>면접관석에 앉아 수많은 자기소개서를 읽으며 알게 된 것은, 합격하는 서류가 화려한 스펙이 아니라 잘 정리된 생각에서 나온다는 사실입니다.</p>
<p>이 책은 나를 분석하고, 직무와 기업을 읽고, 경험을 이야기로 바꾸어, 문항마다 면접관이 읽고 싶은 답을 쓰기까지의 전 과정을 워크시트와 함께 안내합니다.</p>
<p>한 장씩 채워 나가다 보면, 마지막 장에서 당신의 자기소개서가 완성되어 있을 것입니다.</p>

</script>
<script>
(function(){
const KEY='cnp-jobbook-v1';
const PW=600, PH=850;
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));flash('저장했습니다')}catch(e){flash('이 브라우저에서는 저장이 되지 않습니다')}}
let ft;function flash(t){const s=document.getElementById('saved');s.textContent=t;s.classList.add('on');clearTimeout(ft);ft=setTimeout(()=>s.classList.remove('on'),1200)}

const tpl=document.getElementById('pagesTpl').innerHTML;
const TOTAL=(tpl.match(/class="page[" ]/g)||[]).length;
document.getElementById('pgTot').textContent=TOTAL;

/* 입력칸 저장/복원 */
function fill(root){
  root.querySelectorAll('.f[data-k]').forEach(el=>{
    const k=el.dataset.k, v=store[k];
    if(el.type==='checkbox') el.checked=!!v;
    else if(el.type==='radio') el.checked=(v!==undefined && String(v)===el.value);
    else el.value=v||'';
  });
}
let saveT;
function onInput(e){
  const el=e.target; if(!el.classList||!el.classList.contains('f')||!el.dataset.k) return;
  const k=el.dataset.k;
  if(el.type==='checkbox') store[k]=el.checked;
  else if(el.type==='radio'){ if(el.checked) store[k]=el.value; }
  else store[k]=el.value;
  clearTimeout(saveT); saveT=setTimeout(persist,500);
}
document.addEventListener('input',onInput); document.addEventListener('change',onInput);

/* 쪽 이동 */
let flip=null, mode='flip', cur=0;
function setNo(i){cur=i;document.getElementById('pgIn').value=i+1}
function go(i){
  i=Math.max(0,Math.min(TOTAL-1,i));
  if(mode==='flip'&&flip){ const now=flip.getCurrentPageIndex(); if(Math.abs(i-now)<=2) flip.flip(i); else flip.turnToPage(i); setNo(i); }
  else { const el=document.querySelector('#scrollIn .pg[data-i="'+i+'"]'); if(el) el.scrollIntoView({block:'start'}); setNo(i); }
}
function next(){ if(mode==='flip'&&flip) flip.flipNext(); else go(cur+1) }
function prev(){ if(mode==='flip'&&flip) flip.flipPrev(); else go(cur-1) }

function landscape(){ return window.innerWidth>=1000 && window.innerWidth/ (window.innerHeight-56) > 1.05 }
let isLand=null;
function buildFlip(){
  const keep = flip? flip.getCurrentPageIndex(): (cur||0);
  if(flip){ try{flip.destroy()}catch(e){} flip=null; }
  const viewer=document.getElementById('viewer');
  let stage=document.getElementById('stage');
  stage.innerHTML='<div id="book"></div>';
  const book=document.getElementById('book');
  isLand=landscape();
  const W=isLand?PW*2:PW;
  book.style.width=W+'px';
  book.innerHTML=tpl;
  fill(book);
  fit();
  flip=new St.PageFlip(book,{width:PW,height:PH,size:'fixed',showCover:true,usePortrait:true,useMouseEvents:false,
     maxShadowOpacity:.35,flippingTime:650,drawShadow:true,autoSize:false,startPage:keep});
  flip.loadFromHTML(book.querySelectorAll('.page'));
  flip.on('flip',e=>setNo(e.data));
  setNo(keep);
}
function fit(){
  const stage=document.getElementById('stage'), v=document.getElementById('viewer');
  const W=isLand?PW*2:PW, H=PH;
  const mob=window.innerWidth<760; const padX=isLand?150:(mob?16:120), padY=mob?90:60;
  const s=Math.min((v.clientWidth-padX)/W,(v.clientHeight-padY)/H, 1.6);
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.transform='translate(-50%,-50%) scale('+s+')'+(mob?' translateY('+(-30/s)+'px)':'');
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(mode==='flip'){ if(landscape()!==isLand) buildFlip(); else fit(); } else fitScroll();
},150)});

/* 스크롤 보기 */
function buildScroll(){
  const box=document.getElementById('scrollIn');
  const tmp=document.createElement('div'); tmp.innerHTML=tpl;
  box.innerHTML='';
  [...tmp.querySelectorAll('.page')].forEach((p,i)=>{const pg=p.querySelector('.pg'); pg.dataset.i=i; box.appendChild(pg)});
  fill(box); fitScroll();
}
function fitScroll(){
  const box=document.getElementById('scrollIn');
  const s=Math.min(1,(window.innerWidth-24)/PW);
  box.style.zoom=s<1?s:'';
}
document.getElementById('scroll').addEventListener('scroll',()=>{
  const pgs=document.querySelectorAll('#scrollIn .pg');const top=70;
  for(const p of pgs){const r=p.getBoundingClientRect(); if(r.bottom>top+40){ setNo(+p.dataset.i); break; }}
},{passive:true});

function setMode(m){
  const at=cur; mode=m; document.body.classList.toggle('mode-scroll',m==='scroll');
  if(m==='scroll'){ buildScroll(); go(at); } else { cur=at; if(flip){fill(document.getElementById('book'));flip.turnToPage(at);setNo(at)} else buildFlip(); }
  try{localStorage.setItem(KEY+'-mode',m)}catch(e){}
}

/* 버튼 */
const $=id=>document.getElementById(id);
$('prevBtn').onclick=prev; $('nextBtn').onclick=next; $('sPrev').onclick=prev; $('sNext').onclick=next; $('mPrev').onclick=prev; $('mNext').onclick=next;
$('pgIn').addEventListener('change',e=>{const n=parseInt(e.target.value,10); if(n) go(n-1)});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){next();e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault()}
});
/* 밀어서 넘기기 */
let sx=null,sy=0;
$('viewer').addEventListener('touchstart',e=>{ if(e.target.closest('.f,label,button,.mnav')){sx=null;return} sx=e.touches[0].clientX; sy=e.touches[0].clientY },{passive:true});
$('viewer').addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) (dx<0?next:prev)(); sx=null },{passive:true});
/* 책 바깥(양옆 빈 곳)을 누르면 넘기기 */
$('viewer').addEventListener('click',e=>{
  if(e.target.closest('.f,label,button,.toc li,a,textarea,input')) return;
  const pg=e.target.closest('.pg'); if(!pg) return;
  const r=pg.getBoundingClientRect(), x=e.clientX-r.left;
  if(x>r.width*0.88) next(); else if(x<r.width*0.12) prev();
});
/* 목차 쪽 항목 누르기 */
document.addEventListener('click',e=>{const li=e.target.closest('[data-go]'); if(li){ go(+li.dataset.go); closeDrops(); }});

function closeDrops(){document.querySelectorAll('.drop').forEach(d=>d.classList.remove('open'))}
function toggle(id){const d=$(id);const o=d.classList.contains('open');closeDrops();if(!o)d.classList.add('open')}
$('tocBtn').onclick=e=>{e.stopPropagation();toggle('tocDrop')};
$('moreBtn').onclick=e=>{e.stopPropagation();toggle('moreDrop')};
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeDrops()});
$('tocDrop').innerHTML=TOC.map(t=>'<button data-go="'+t[2]+'">'+t[0]+(t[1]?' '+t[1]:'')+'<span>'+(t[2]+1)+'</span></button>').join('');

$('mFlip').onclick=()=>{closeDrops();setMode('flip')};
$('mScroll').onclick=()=>{closeDrops();setMode('scroll')};
$('mPrint').onclick=()=>{closeDrops(); if(mode!=='scroll'){ buildScroll(); } setTimeout(()=>window.print(),300)};
window.addEventListener('afterprint',()=>{ if(mode!=='scroll') document.getElementById('scrollIn').innerHTML='' });

let dl=null; if(window.claude&&window.claude.use){ window.claude.use('downloads').then(d=>{dl=d}).catch(()=>{}) }
async function download(name,text,type){
  if(dl){ try{ await dl.save({filename:name,data:text}); flash('파일을 받았습니다'); }catch(e){ if(e&&e.code!=='declined') flash('이 화면에서는 파일 받기가 되지 않습니다'); } return; }
  const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('mBackup').onclick=()=>{closeDrops();download('합격설계_입력백업.json',JSON.stringify(store,null,1),'application/json')};
$('mRestore').onclick=()=>{closeDrops();$('restoreFile').click()};
$('restoreFile').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{const o=JSON.parse(r.result); store=Object.assign(store,o); persist(); refreshAll(); flash('불러왔습니다')}catch(err){flash('백업 파일을 읽지 못했습니다')}}; r.readAsText(f); e.target.value=''};
let clearArm=0;
$('mClear').onclick=()=>{
  if(Date.now()-clearArm>4000){clearArm=Date.now(); $('mClear').textContent='한 번 더 누르면 모두 지워집니다'; setTimeout(()=>{$('mClear').textContent='입력 내용 모두 지우기'},4000); return;}
  store={}; persist(); refreshAll(); closeDrops(); $('mClear').textContent='입력 내용 모두 지우기'; flash('모두 지웠습니다');
};
function refreshAll(){ document.querySelectorAll('#book,#scrollIn').forEach(fill) }

/* 내가 쓴 답 모으기 */
$('mExport').onclick=()=>{
  closeDrops();
  const tmp=document.createElement('div'); tmp.innerHTML=tpl; let out='합격을 설계하는 자기소개서 — 내가 쓴 답\n\n';
  tmp.querySelectorAll('.pg.ws').forEach(pg=>{
    const tag=(pg.querySelector('.ws-tag')||{}).textContent||'', h=(pg.querySelector('.ws-head h2')||{}).textContent||'';
    let lines=[];
    pg.querySelectorAll('.f[data-k]').forEach(el=>{
      const v=store[el.dataset.k]; if(v===undefined||v===''||v===false) return;
      if(el.type==='radio'&&String(v)!==el.value) return;
      let label='';
      const td=el.closest('td');
      if(td){ const tr=td.parentElement; const l=tr.querySelector('.lbl'); const tbl=td.closest('table'); const ths=tbl.querySelectorAll('tr:first-child th'); const th=ths[[...tr.children].indexOf(td)];
        label=[l?l.textContent.trim():'', th?th.textContent.trim():''].filter(Boolean).join(' / '); }
      else if(el.type==='checkbox'||el.type==='radio'){ label=(el.closest('label')||{}).textContent.trim(); }
      else { let p=el.previousElementSibling; while(p&&!p.matches('.ws-q,h3,h4,p')) p=p.previousElementSibling; label=p?p.textContent.trim():''; }
      if(el.type==='checkbox') lines.push('  [v] '+label);
      else if(el.type==='radio') lines.push('  '+label.split('\n')[0]+' : '+v);
      else lines.push('  '+(label?label+'\n    ':'')+String(v).replace(/\n/g,'\n    '));
    });
    if(lines.length) out+='■ '+tag+'  '+h+'\n'+lines.join('\n')+'\n\n';
  });
  download('합격설계_내가쓴답.txt',out,'text/plain;charset=utf-8');
};

let startMode='flip'; try{startMode=localStorage.getItem(KEY+'-mode')||'flip'}catch(e){}
if(startMode==='scroll'){ mode='scroll'; document.body.classList.add('mode-scroll'); buildScroll(); }
else buildFlip();
setTimeout(()=>{const h=$('hint'); if(h) h.style.display='none'},9000);
})();
</script>
</body>
