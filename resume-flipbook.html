<div class="page"><div class="pg"><div class="rh"><span>PART 2 · 자기분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">2-24</span>PART 2 정리</h2>
<p>이 장에서는 분석의 깊이가 문장의 깊이를 정한다는 것을 확인하고, 슈퍼, 샤인, 홀랜드, 크럼볼츠, 사회인지진로이론 같은 진로 이론의 틀로 자기소개서의 재료를 꺼냈습니다. 그 재료를 세 개의 키워드로 묶고 기업의 언어로 옮기는 데까지 왔습니다.</p>
<ul class="checks"><li>내 경험 하나를 3단계(패턴·의미·연결) 문장으로 쓸 수 있다</li><li>라이프라인에서 반복되는 나의 행동 패턴을 한 문장으로 말할 수 있다</li><li>1순위 가치와 그 가치 때문에 무언가를 포기한 장면이 있다</li><li>경력 닻 후보 두 개와 흥미 코드의 일관성을 설명할 수 있다</li><li>강점 세 개를 모두 행동 언어로 바꾸고 증거를 붙였다</li><li>약점을 강점의 그림자로 설명하고 보완 노력을 말할 수 있다</li><li>세 사람의 피드백을 받아 보이지 않는 창을 하나 이상 찾았다</li><li>경험 인벤토리에 열다섯 개 안팎의 경험을 적었다</li><li>키워드 세 개마다 근거 경험이 두 개씩 있고, 기업 언어로 옮겨 보았다</li></ul>
<div class="quote">나를 꾸미는 글이 아니라, 나를 증명하는 글을 쓰기 위해 우리는 먼저 나를 꺼내 보았습니다.<small>PART 3에서는 이 재료를 들고 직무 쪽으로 걸어갑니다.</small></div>
<div class="box key"><span class="box-label">다음 장으로</span><p>자기분석 종합 시트는 PART 3 직무분석과 PART 4 기업분석에서 계속 꺼내 씁니다. 나와 직무, 나와 회사가 만나는 지점을 찾는 것이 다음 과제입니다.</p></div></div><div class="pf">77</div></div></div>
<div class="page"><div class="pg opener"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 3</div>
<h1>무엇을 할 사람인지<br>먼저 정하라</h1>
<p class="lead">회사는 '좋은 사람'을 뽑지 않습니다. '이 일을 잘할 사람'을 뽑습니다. 이 장에서는 채용공고와 직무기술서를 읽고, 직무가 요구하는 역량을 쪼개어 내 경험과 연결하는 방법을 익힙니다.</p>
<ul class="chap-list"><li>01 직무분석이 먼저인 이유와 역량 이론</li><li>02 채용공고 읽는 법</li><li>03 NCS 구조와 공공기관 직무기술서</li><li>04 사기업 공고의 행간 읽기</li><li>05 역량을 지식·기술·태도로 쪼개기</li><li>06 현직자 인터뷰와 나와 직무 연결하기</li></ul>
<div class="chap-bar"></div></div><div class="pf">78</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-1</span>직무분석이 왜 먼저인가</h2>
<p>면접관으로 서류를 읽다 보면 이런 자기소개서를 자주 만납니다. 성실하고, 책임감 있고, 소통을 잘한다는 내용인데 정작 <span class="hl">무슨 일을 하러 왔는지가 보이지 않습니다.</span> 영업에 내도, 회계에 내도 그대로 쓸 수 있는 글입니다.</p>
<p>채용은 빈자리를 채우는 일입니다. 회사는 특정 직무에 사람이 필요해서 공고를 냅니다. 그러니 평가 기준도 "이 사람이 그 자리에서 일을 해낼 수 있는가", 곧 <b>직무적합성</b>입니다. 자기분석으로 나를 꺼냈다면, 이제 그 재료를 어느 자리에 맞출지 정해야 합니다.</p>
<div class="compare"><div class="bad">저는 어떤 일이든 최선을 다하는 사람입니다.</div><div class="good">재고 데이터를 매주 정리해 발주 오차를 줄여 본 경험을 구매 직무의 수요 예측 업무에 살리겠습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 서류를 볼 때 공고의 주요업무를 옆에 펴 놓고 읽습니다. 업무와 겹치는 문장이 나오면 그때부터 집중해서 읽습니다. 겹치는 문장이 하나도 없으면, 아무리 문장이 매끄러워도 기억에 남지 않습니다.</p></div>
<div class="box key"><span class="box-label">핵심</span><p>직무를 모르면 무엇을 강조할지 고를 수 없습니다. 자기소개서의 방향은 직무가 정합니다.</p></div></div><div class="pf">79</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-2</span>직무적합성은 세 가지로 본다</h2>
<p>제 수업에서 학생들에게 "직무적합성이 뭐라고 생각하세요?"라고 물으면 대부분 "전공이 맞는 것"이라고 답합니다. 전공은 일부일 뿐입니다. 회사가 확인하고 싶은 것은 크게 세 가지입니다.</p>
<div class="cards c3"><div class="card"><b>할 수 있는가</b>업무에 필요한 지식과 기술을 갖추었거나 빠르게 익힐 수 있는가</div><div class="card"><b>하고 싶은가</b>이 일을 왜 하려는지, 일의 힘든 면까지 알고 선택했는가</div><div class="card"><b>잘 맞는가</b>일하는 방식과 성향이 직무의 특성과 어울리는가</div></div>
<p>세 가지 중 하나라도 비면 면접에서 질문이 들어옵니다. 경영학과 지민이 생산관리에 지원했을 때 면접관이 가장 먼저 물은 것은 "공장 근무, 괜찮겠어요?"였습니다. <span class="hl">하고 싶은가</span>와 <span class="hl">잘 맞는가</span>를 확인하는 질문입니다.</p>
<p>지민은 교내 창업 동아리에서 시제품 제작 일정을 관리하며 현장에서 문제를 직접 확인하는 일이 즐거웠다고 답했습니다. 전공은 달랐지만 세 질문에 모두 근거를 댔습니다.</p>
<div class="box tip"><span class="box-label">팁</span><p>전공이 직무와 다르다면 '할 수 있는가'는 학습 계획으로, '하고 싶은가'와 '잘 맞는가'는 경험으로 채우세요. 비전공자에게는 뒤의 두 가지가 더 중요합니다.</p></div></div><div class="pf">80</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-3</span>역량은 빙산처럼 생겼다</h2>
<p>'역량'이라는 말은 이제 채용공고마다 나옵니다. 이 말이 채용의 중심에 들어온 데에는 배경이 있습니다. 심리학자 맥클리랜드(McClelland)는 학교 성적이나 지능 검사 점수보다 <b>실제로 일을 잘하는 사람과 보통인 사람을 가르는 특성</b>을 찾아야 한다고 주장했습니다. 그 생각을 이어받은 스펜서 부부(Spencer & Spencer)는 역량을 빙산에 빗대어 정리했습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>역량</b>은 어떤 직무에서 뛰어난 성과와 연결되는 개인의 내적 특성입니다. 빙산 모델은 이를 다섯 가지로 나눕니다.</p>
<ul><li><b>수면 위</b> 지식, 기술. 겉으로 보이고, 교육으로 비교적 쉽게 기를 수 있다.</li><li><b>수면 아래</b> 자기개념(태도·가치관·자아상), 특질(상황에 일관되게 반응하는 성향), 동기(행동을 끌어내는 지속적인 욕구). 잘 보이지 않고, 쉽게 바뀌지 않는다.</li></ul></div>
<p>채용 서류에 이 모델을 겹쳐 보면 각 칸의 역할이 분명해집니다. 학력·자격·교육 이수 칸은 수면 위를 보여 줍니다. 수면 아래를 보여 줄 수 있는 서류는 사실상 <span class="hl">자기소개서뿐</span>입니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>자격증이 같은 두 지원자 중 한 사람을 고를 때, 저는 "그 일을 왜 그렇게까지 했는가"가 보이는 글에 점수를 줍니다. 행동의 이유가 곧 동기이고, 그 동기는 입사 뒤에도 쉽게 사라지지 않기 때문입니다.</p></div>
<p class="src">출처: Spencer, L. M. & Spencer, S. M., Competence at Work (1993) / McClelland, D. C., "Testing for Competence Rather Than for Intelligence" (1973)</p></div><div class="pf">81</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-4</span>채용공고는 세 칸으로 읽는다</h2>
<p>채용공고는 회사가 직접 써 준 정답지에 가깝습니다. 그런데 많은 지원자가 마감일과 지원 자격만 확인하고 창을 닫습니다. 공고에서 꼭 읽어야 할 곳은 세 칸입니다.</p>
<table class="tbl"><tr><th style="width:22%">항목</th><th>회사가 하는 말</th><th style="width:34%">내가 할 일</th></tr>
<tr><td>주요업무</td><td>입사하면 실제로 하게 될 일</td><td>업무마다 관련 경험 찾기</td></tr>
<tr><td>자격요건</td><td>없으면 일을 시작하기 어려운 조건</td><td>충족 여부 확인, 근거 준비</td></tr>
<tr><td>우대사항</td><td>있으면 더 빨리 일할 수 있는 조건</td><td>하나라도 있으면 앞에 배치</td></tr></table>
<p>주요업무는 <b>동사</b>에 밑줄을 그으며 읽으세요. "관리한다", "분석한다", "협의한다" 같은 동사가 곧 그 직무의 하루입니다. 자격요건과 우대사항에서는 <b>명사</b>를 찾습니다. 자격증, 도구, 언어처럼 증명할 수 있는 것들입니다.</p>
<div class="box warn"><span class="box-label">주의</span><p>우대사항을 다 갖추지 못했다고 지원을 포기하지 마세요. 우대사항은 말 그대로 우대입니다. 다만 자격요건은 반드시 충족하는지 확인해야 합니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>면접에서 "이 직무가 하는 일을 설명해 보세요"라고 물으면 공고의 주요업무조차 말하지 못하는 지원자가 있습니다. 공고를 세 번만 읽고 와도 이 질문에서 막히지 않습니다.</p></div></div><div class="pf">82</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-5</span>예시 공고 하나 분해하기</h2>
<p>아래는 설명을 위해 만든 가상의 공고입니다. 실제로 이 정도 분량의 공고를 흔히 볼 수 있습니다.</p>
<div class="example"><span class="ex-label">가상 공고 · 식품 제조사 영업관리 신입</span>
<p><b>주요업무</b> 담당 대리점 매출 및 재고 관리, 신제품 입점 제안 및 판촉 행사 운영, 거래처 요청사항 접수와 유관부서 협의<br><b>자격요건</b> 학사 이상, 운전면허 소지자, 지방 근무 가능자<br><b>우대사항</b> 엑셀 활용 능숙자, 유통·판매 관련 경험자</p></div>
<h3>동사로 하루 그려 보기</h3>
<p>'관리', '제안', '운영', '협의'가 보입니다. 숫자를 다루고(매출·재고), 사람을 설득하고(입점 제안), 현장을 움직이고(판촉 행사), 안팎을 조율하는(유관부서 협의) 일입니다.</p>
<table class="tbl"><tr><th style="width:30%">공고 표현</th><th>숨은 요구역량</th></tr>
<tr><td>매출 및 재고 관리</td><td>숫자 감각, 꾸준한 기록 습관</td></tr>
<tr><td>입점 제안</td><td>상대 입장에서 이익을 설명하는 설득력</td></tr>
<tr><td>지방 근무 가능자</td><td>이동이 잦은 환경에 대한 수용</td></tr>
<tr><td>엑셀 능숙자</td><td>데이터 정리·보고 능력</td></tr></table>
<div class="box key"><span class="box-label">핵심</span><p>공고 한 줄은 역량 한 개로 번역됩니다. 번역된 역량마다 내 경험을 하나씩 붙이면 자기소개서의 뼈대가 생깁니다.</p></div></div><div class="pf">83</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-6</span>NCS 직무기술서 활용하기</h2>
<p>공공기관이나 일부 기업은 NCS(국가직무능력표준)를 기반으로 채용합니다. 이런 곳은 공고와 함께 <b>직무기술서</b>를 첨부하는데, 여기에 직무의 내용이 아주 자세히 정리되어 있습니다. NCS 누리집에서는 직무별 능력단위도 직접 찾아볼 수 있습니다.</p>
<h3>직무기술서에서 볼 곳</h3>
<ul><li><b>직무 수행 내용</b> 이 직무가 하는 일을 한두 문장으로 정의한 부분</li><li><b>능력단위</b> 직무를 이루는 작은 업무 단위 (예: 예산 편성, 회계 감사)</li><li><b>필요 지식·기술·태도</b> 각 업무에 필요한 역량을 세 갈래로 나눈 목록</li><li><b>관련 자격</b> 직무와 연결되는 자격증</li><li><b>직업기초능력</b> 의사소통, 문제해결 등 공통으로 요구하는 능력</li></ul>
<p>간호학과 서연은 공공병원 행정직이 아닌 간호직 직무기술서를 보고 '환자 안전 관리'와 '감염 관리'가 능력단위로 들어 있다는 것을 확인했습니다. 실습 때 손 위생 점검표를 정리했던 경험이 바로 그 자리에 맞았습니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>공공기관 면접에서 저는 직무기술서에 나온 단어를 지원자가 얼마나 정확히 이해하는지 봅니다. 직무기술서를 읽고 온 사람은 질문에 대한 답의 결이 다릅니다.</p></div></div><div class="pf">84</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-7</span>NCS의 뼈대: 두 가지 능력과 세 단계</h2>
<p>PART 1에서 직업기초능력 10영역의 이름을 살펴보았습니다. 여기서는 NCS가 한 직무를 어떻게 쪼개 놓았는지 구조를 봅니다. 이 구조를 알면 직무기술서가 '읽히기' 시작합니다.</p>
<div class="cards"><div class="card"><b>직업기초능력</b>어떤 직무에서 일하든 공통으로 필요한 능력. 의사소통, 문제해결 같은 10영역. 기관에 따라 필기시험과 면접에서 주로 확인합니다.</div><div class="card"><b>직무수행능력</b>그 직무를 해내는 데 필요한 전문 능력. 직무마다 다르며 '능력단위'로 구성됩니다. 서류와 직무 면접에서 주로 확인합니다.</div></div>
<div class="box theory"><span class="box-label">이론 노트</span>
<p>NCS는 산업 현장의 직무를 <b>대분류, 중분류, 소분류, 세분류</b>로 나누고, 세분류 하나를 하나의 직무로 봅니다. 직무 아래는 다시 세 단계로 내려갑니다.</p>
<ol><li><b>능력단위</b> 직무를 이루는 업무 덩어리</li><li><b>능력단위요소</b> 능력단위를 이루는 세부 작업</li><li><b>수행준거</b> 그 작업을 제대로 했다고 판단하는 기준 문장. 여기에 필요한 지식·기술·태도가 붙는다.</li></ol></div>
<p>자기소개서에 가장 쓸모 있는 것은 <span class="hl">수행준거</span>입니다. 수행준거는 "자료를 확인하여 오류를 찾아낼 수 있다"처럼 행동으로 쓰여 있습니다. 내 경험을 이 행동 문장에 맞춰 고르면, 평가 기준과 같은 언어로 쓴 글이 됩니다.</p>
<p class="src">출처: 국가직무능력표준(NCS) 누리집, 고용노동부·한국산업인력공단</p></div><div class="pf">85</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-8</span>공공기관 직무기술서 분해 예시</h2>
<p>아래는 설명을 위해 만든 가상의 직무기술서입니다. 실제 공공기관 채용공고에는 이런 표가 첨부파일로 붙습니다.</p>
<table class="tbl"><tr><th style="width:24%">항목</th><th>가상의 ○○공단 · 재무회계</th></tr>
<tr><td>분류체계</td><td>대분류 경영·회계·사무 / 중분류 재무·회계</td></tr>
<tr><td>기관 주요사업</td><td>지역 공공시설 운영, 주민 복지 지원사업</td></tr>
<tr><td>능력단위</td><td>전표 관리, 자금 관리, 결산 관리, 예산 관리</td></tr>
<tr><td>직무수행내용</td><td>기관 예산의 편성·집행을 관리하고 회계 처리와 결산을 수행</td></tr>
<tr><td>필요 지식·기술</td><td>회계 원리, 공공기관 예산 제도 / 회계 프로그램, 엑셀 활용</td></tr>
<tr><td>직무수행태도</td><td>정확성, 규정 준수, 투명성</td></tr>
<tr><td>직업기초능력</td><td>의사소통, 수리, 문제해결, 조직이해, 직업윤리</td></tr></table>
<h3>세 가지 질문으로 읽기</h3>
<ol class="steps"><li><b>이 기관에서 이 직무는 왜 필요한가</b>주요사업과 직무수행내용을 이어 읽습니다. 공공 예산이 사업에 맞게 쓰이도록 지키는 자리입니다.</li><li><b>능력단위 중 내 경험이 닿는 곳은</b>동아리 회비 장부라면 전표·결산 관리에 닿습니다.</li><li><b>태도 단어를 어떤 장면으로 보여 줄까</b>'투명성'이면 장부를 공개하고 확인받은 장면을 찾습니다.</li></ol></div><div class="pf">86</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-9</span>사기업 공고는 행간을 읽는다</h2>
<p>사기업은 대부분 정해진 양식 없이 주요업무, 자격요건, 우대사항을 몇 줄로 씁니다. 직무기술서보다 짧지만, 대신 <b>그 회사의 현업 언어</b>가 들어 있습니다.</p>
<table class="tbl"><tr><th style="width:18%">구분</th><th style="width:41%">공공기관 NCS 직무기술서</th><th>사기업 공고(JD)</th></tr>
<tr><td>형식</td><td>표준화된 표, 항목이 거의 같음</td><td>회사마다 자유, 길이도 제각각</td></tr>
<tr><td>언어</td><td>NCS 표준 용어, 수행준거 문장</td><td>제품명, 도구명, 사업 목표 같은 현업 용어</td></tr>
<tr><td>읽는 법</td><td>능력단위와 내 경험을 하나씩 맞대기</td><td>짧은 문구의 행간을 풀고 다른 공고·현직자로 보완</td></tr>
<tr><td>서류의 초점</td><td>직무 수행 근거, 공정한 비교</td><td>바로 기여할 수 있는지, 회사에 맞춘 이해</td></tr></table>
<div class="example"><span class="ex-label">가상 공고 · 모바일 서비스 기업 그로스 마케팅 신입</span>
<p>앱 이용 데이터 분석을 통한 재방문율 개선, A/B 테스트 설계 및 운영 / SQL 활용 가능자 우대</p></div>
<p>이 두 줄을 풀면 이렇습니다. 광고를 만드는 마케팅이 아니라 <span class="hl">숫자로 가설을 세우고 실험하는 마케팅</span>이고, 데이터를 남에게 부탁하지 않고 직접 꺼내 볼 사람을 원합니다. 그러니 "SNS 홍보 경험"보다 "설문 결과로 가설을 세워 두 가지 안을 비교해 본 경험"이 더 맞는 근거입니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>사기업 면접에서 공고의 도구 이름을 물었을 때 "써 본 적은 없지만 무엇을 하는 도구인지는 압니다"라고 답하는 지원자는 행간을 읽고 온 사람입니다.</p></div></div><div class="pf">87</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-10</span>역량을 지식·기술·태도로 쪼개기</h2>
<p>"영업 역량이 있습니다"라는 말은 너무 큽니다. 역량은 쪼개야 증명할 수 있습니다. NCS가 쓰는 방식처럼 <b>지식(K)·기술(S)·태도(A)</b> 세 갈래로 나누어 보세요.</p>
<div class="cards c3"><div class="card"><b>지식</b>알고 있는 것. 이론, 제도, 제품, 업계 구조</div><div class="card"><b>기술</b>할 줄 아는 것. 도구 활용, 분석, 작성, 응대</div><div class="card"><b>태도</b>일을 대하는 방식. 꼼꼼함, 끈기, 협력</div></div>
<h3>예: 재무·회계 직무의 '결산 업무'</h3>
<table class="tbl"><tr><th style="width:18%">구분</th><th>쪼갠 내용</th><th style="width:36%">나의 근거 예시</th></tr>
<tr><td>지식</td><td>회계 원리, 계정과목, 세법 기초</td><td>회계원리 수업, 관련 자격 공부</td></tr>
<tr><td>기술</td><td>엑셀 함수, 전표 처리, 자료 대사</td><td>동아리 회비 장부 작성</td></tr>
<tr><td>태도</td><td>숫자를 끝까지 맞추는 꼼꼼함, 마감 준수</td><td>장부 차액을 찾을 때까지 대조</td></tr></table>
<p>이렇게 쪼개면 비어 있는 칸이 보입니다. 지식은 있는데 기술이 비었다면 실습형 경험을, 태도가 비었다면 그 태도를 보여 준 장면을 찾으면 됩니다.</p>
<div class="box tip"><span class="box-label">팁</span><p>태도는 형용사로 쓰지 말고 행동으로 쓰세요. '꼼꼼함' 대신 '차액 3천 원을 찾으려고 영수증 120장을 다시 맞춰 본 일'처럼요.</p></div></div><div class="pf">88</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-11</span>직무별 핵심역량 한눈에 보기 (1)</h2>
<p>아래 표는 여러 회사의 공고에서 공통으로 자주 보이는 내용을 일반적으로 정리한 것입니다. 회사마다 다르니 반드시 지원할 회사의 공고로 다시 확인하세요.</p>
<table class="tbl"><tr><th style="width:17%">직무</th><th style="width:38%">주요 업무</th><th>자주 요구되는 역량</th></tr>
<tr><td>영업</td><td>거래처 발굴·관리, 매출 목표 달성, 계약·납품 조율</td><td>관계 형성, 설득, 목표 의식, 숫자 관리</td></tr>
<tr><td>마케팅</td><td>시장·고객 분석, 브랜드·판촉 기획, 성과 측정</td><td>자료 분석, 기획력, 트렌드 감각, 협업</td></tr>
<tr><td>인사·총무</td><td>채용·교육·평가 운영, 근태·급여, 사내 자산·행사 관리</td><td>공정성, 보안 의식, 꼼꼼함, 조율 능력</td></tr>
<tr><td>재무·회계</td><td>전표·결산, 세무 신고 지원, 예산·자금 관리</td><td>회계 지식, 정확성, 마감 준수, 엑셀 활용</td></tr>
<tr><td>생산·품질</td><td>생산 계획·공정 관리, 불량 원인 분석, 품질 기준 관리</td><td>현장 이해, 문제 분석, 안전 의식, 개선 의지</td></tr></table>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>같은 '소통'이라도 영업의 소통은 고객을 설득하는 것이고, 인사의 소통은 구성원의 이야기를 듣고 공정하게 전달하는 것입니다. 역량 이름이 같아도 직무마다 모습이 다르다는 것을 보여 주는 지원자가 눈에 띕니다.</p></div></div><div class="pf">89</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-11</span>직무별 핵심역량 한눈에 보기 (2)</h2>
<table class="tbl"><tr><th style="width:17%">직무</th><th style="width:38%">주요 업무</th><th>자주 요구되는 역량</th></tr>
<tr><td>연구개발</td><td>제품·기술 개발, 실험 설계와 분석, 특허·문서 작성</td><td>전공 지식, 논리적 사고, 끈기, 기록 습관</td></tr>
<tr><td>IT개발</td><td>서비스 설계·구현, 유지보수, 오류 대응</td><td>프로그래밍, 문제 해결, 자기주도 학습, 협업 도구 활용</td></tr>
<tr><td>간호·보건</td><td>환자 간호·관찰, 투약·처치, 감염·안전 관리</td><td>임상 지식, 정확성, 공감, 체력과 침착함</td></tr>
<tr><td>공공행정</td><td>민원 처리, 사업 집행·관리, 공문서 작성</td><td>공공성 이해, 규정 준수, 문서 작성, 친절한 응대</td></tr></table>
<h3>표를 읽는 방법</h3>
<p>기계공학과 준호는 이 표를 보고 생산·품질과 연구개발 사이에서 고민했습니다. 두 직무 모두 전공 지식이 필요하지만, 연구개발은 '새로 만드는 일', 생산·품질은 '안정적으로 만들어 내는 일'에 가깝습니다. 준호는 졸업작품에서 시제품을 만들 때보다 불량 원인을 찾아 고칠 때 더 몰입했던 자신을 떠올리고 품질 직무를 택했습니다.</p>
<div class="box key"><span class="box-label">핵심</span><p>역량 목록을 외우는 것이 목적이 아닙니다. 어떤 일을 할 때 내가 몰입했는지를 직무의 하루와 겹쳐 보는 것이 목적입니다.</p></div></div><div class="pf">90</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-12</span>분석 전과 후, 문장이 달라진다</h2>
<p>분석의 힘은 문장으로 보는 편이 빠릅니다. 제 수업의 두 학생이 쓴 문장입니다.</p>
<h4>지민 · 공공기관 재무회계 지원</h4>
<div class="compare stack"><div class="bad">동아리 총무를 맡아 회비를 꼼꼼하게 관리하며 책임감을 길렀습니다.</div><div class="good">동아리 총무로 1년간 지출마다 영수증을 대조하고, 학기 말에는 결산 내역을 회원 전체에 공개해 확인받았습니다. 공공 예산을 다루는 데 필요한 정확성과 투명성을 이렇게 연습했습니다.</div></div>
<h4>준호 · 제조 대기업 품질 지원</h4>
<div class="compare stack"><div class="bad">졸업작품에서 팀원들과 협력하여 끝까지 포기하지 않고 결과물을 완성했습니다.</div><div class="good">졸업작품의 조립 불량이 반복되자 불량을 유형별로 기록해 원인 공정을 좁혔고, 조립 순서를 바꿔 불량을 줄였습니다. 이 습관을 품질 직무의 불량 분석에 쓰겠습니다.</div></div>
<p>경험은 그대로입니다. 지민은 직무기술서의 태도 단어를, 준호는 공고의 '불량 원인 분석'을 보고 <span class="hl">같은 경험의 다른 면</span>을 꺼냈습니다.</p>
<div class="box key"><span class="box-label">핵심</span><p>분석하지 않으면 누구나 쓰는 단어를 고르고, 분석하면 그 직무만의 행동을 고릅니다.</p></div></div><div class="pf">91</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-13</span>현직자 인터뷰 하는 법</h2>
<p>공고와 직무기술서는 '공식 설명'입니다. 그 일을 실제로 하는 사람의 하루는 현직자에게 들어야 압니다. 학과 선배, 교수님 소개, 학교 취업지원센터의 멘토링, 채용설명회 상담 부스가 좋은 통로입니다.</p>
<h3>이렇게 물어보세요</h3>
<ul><li>하루 일과는 어떻게 흘러가나요? 가장 시간이 많이 드는 일은 무엇인가요?</li><li>신입이 들어오면 처음 몇 달 동안 주로 무엇을 맡나요?</li><li>이 일을 잘하는 사람과 힘들어하는 사람은 어떤 점이 다른가요?</li><li>입사 전에 준비해 두면 좋았겠다 싶은 것이 있나요?</li><li>요즘 팀이나 업계에서 가장 신경 쓰는 일은 무엇인가요?</li></ul>
<div class="box warn"><span class="box-label">예의</span><p>먼저 짧게 자기소개와 목적을 밝히고, 20~30분 정도로 시간을 정해 부탁하세요. 연봉이나 회사 내부 사정처럼 곤란한 질문은 피하고, 들은 내용을 자기소개서에 그대로 옮겨 '내부 정보'처럼 쓰지 마세요. 끝나면 당일 감사 인사를 보내는 것까지가 인터뷰입니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"현직자분께 여쭤보니 신입은 거래처 재고 확인부터 배운다고 들었습니다"라는 말 한마디로, 이 지원자가 발로 뛰어 알아봤다는 것이 전해집니다.</p></div></div><div class="pf">92</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 3 · 직무분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">3-14</span>PART 3 정리</h2>
<p>직무분석을 마친 학생들의 자기소개서는 첫 문단부터 달라집니다. 같은 사람, 같은 경험인데 <span class="hl">어디에 쓸지를 알게 되었기 때문</span>입니다.</p>
<ol class="steps"><li><b>직무 고르기</b>관심 직무를 비교하고 하나를 정한다 (워크시트 3-1)</li><li><b>공고 분해</b>주요업무의 동사, 자격·우대의 명사를 찾아 역량으로 번역한다 (3-2)</li><li><b>직무기술서 분해</b>공공기관이라면 능력단위와 수행준거에 내 경험을 맞댄다 (3-5)</li><li><b>현장 확인</b>현직자에게 실제 하루와 신입의 업무를 묻는다 (3-3)</li><li><b>갭 분석</b>요구역량과 내 근거를 맞대어 보고 부족한 점은 계획으로 채운다 (3-4)</li></ol>
<h3>다음 장으로 넘어가기 전 점검</h3>
<ul class="checks"><li>지원 직무를 한 문장으로 설명할 수 있다</li><li>그 직무의 요구역량을 지식·기술·태도로 말하고, 동기를 보여 줄 장면이 있다</li><li>요구역량마다 붙일 경험이 하나 이상 있다</li><li>부족한 역량과 그 보완 계획을 말할 수 있다</li></ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"부족한 점이 무엇인가요?"라는 질문에 직무와 관련된 약점과 구체적인 보완 계획을 함께 말하는 지원자는 드뭅니다. 갭 분석을 해 본 사람만 그 대답을 할 수 있습니다.</p></div></div><div class="pf">98</div></div></div>
<div class="page"><div class="pg opener"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 4</div>
<h1>왜 하필 이 회사인지<br>답할 수 있어야 한다</h1>
<p class="lead">직무분석이 '무엇을 할 것인가'에 답한다면, 기업분석은 '왜 여기서 할 것인가'에 답합니다. 이 장에서는 정보를 모으는 곳부터 인재상 번역, 최근 이슈 연결까지 지원동기의 재료를 모읍니다.</p>
<ul class="chap-list"><li>01 기업분석이 지원동기를 만든다</li><li>02 정보 찾기와 산업에서 직무까지</li><li>03 5 Forces, 가치사슬, 캔버스, 재무제표, SWOT</li><li>04 공공기관과 사기업, 분석법이 다르다</li><li>05 인재상을 내 경험으로 번역하기</li><li>06 최근 이슈를 지원동기로 잇기</li></ul>
<div class="chap-bar"></div></div><div class="pf">99</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-1</span>기업분석이 지원동기를 만든다</h2>
<p>면접에서 "우리 회사에 왜 지원했나요?"라고 물으면 가장 흔한 답은 "업계 선두 기업이라서", "성장 가능성이 커서"입니다. 이 말은 그 회사의 경쟁사에 가서도 똑같이 할 수 있습니다. 면접관이 듣고 싶은 것은 <span class="hl">이 회사여야만 하는 이유</span>입니다.</p>
<p>지원동기는 감정이 아니라 정보에서 나옵니다. 회사가 무엇을 팔고, 요즘 무엇에 힘을 쏟고, 어떤 사람을 원하는지 알아야 "그래서 제가 여기서 이 일을 하고 싶습니다"가 설득력을 갖습니다.</p>
<div class="compare"><div class="bad">귀사는 업계 최고의 기업으로, 그 일원이 되어 함께 성장하고 싶습니다.</div><div class="good">귀사가 간편식 라인을 넓히며 편의점 채널을 강화하고 있다는 점에 주목했습니다. 편의점 발주를 맡으며 익힌 판매 데이터 감각으로 신규 입점 제안에 힘을 보태고 싶습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>지원동기를 들으면 저는 속으로 회사 이름을 다른 회사로 바꿔 봅니다. 바꿔도 말이 되면 준비가 덜 된 답입니다. 바꾸면 말이 안 되는 답, 그것이 좋은 지원동기입니다.</p></div>
<p class="small">지원동기 문항을 실제로 쓰는 방법은 PART 7에서 다룹니다. 이 장에서는 그 재료를 모으는 데 집중합니다.</p></div><div class="pf">100</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-2</span>정보는 어디서 찾나</h2>
<p>기업 정보는 생각보다 많이 공개되어 있습니다. 다만 출처마다 성격이 다르니 무엇을 얻을지 알고 찾아야 합니다.</p>
<table class="tbl"><tr><th style="width:24%">출처</th><th>얻을 수 있는 것</th></tr>
<tr><td>회사 홈페이지</td><td>사업 분야, 주요 제품, 비전, 인재상·핵심가치, 채용 페이지의 직무 소개</td></tr>
<tr><td>전자공시(DART)</td><td>사업보고서의 '사업의 내용'에서 매출 구성, 주요 제품, 시장 환경, 위험 요인</td></tr>
<tr><td>IR 자료</td><td>상장사가 투자자에게 설명하는 실적과 앞으로의 전략</td></tr>
<tr><td>뉴스</td><td>신제품, 투자, 해외 진출, 제휴 등 최근 움직임</td></tr>
<tr><td>채용설명회·현직자</td><td>조직 분위기, 직무의 실제, 회사가 강조하는 메시지</td></tr>
<tr><td>기업 리뷰 사이트</td><td>재직자 개인의 의견. 분위기를 짐작하는 참고용</td></tr></table>
<div class="box warn"><span class="box-label">주의</span><p>기업 리뷰 사이트의 글은 개인의 경험이라 한쪽으로 치우칠 수 있습니다. 참고만 하고, 자기소개서나 면접에서 근거로 인용하지 마세요.</p></div>
<div class="box tip"><span class="box-label">팁</span><p>사업보고서가 어렵다면 '사업의 내용' 한 부분만 읽어도 충분합니다. 회사가 스스로 쓴 자기소개서라고 생각하고 읽어 보세요.</p></div></div><div class="pf">101</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-3</span>산업에서 기업, 기업에서 직무로</h2>
<p>기업분석을 회사 하나에서 시작하면 그 회사의 자랑만 보입니다. 넓은 데서 좁은 데로 내려가야 회사의 위치가 보입니다. 저는 수업에서 이 순서를 '깔때기'라고 부릅니다.</p>
<ol class="steps"><li><b>산업 보기</b>이 산업은 무엇으로 돈을 벌고, 요즘 어떤 변화를 겪고 있는가</li><li><b>기업 보기</b>그 산업 안에서 이 회사는 무엇이 다르고, 무엇에 집중하는가</li><li><b>직무 보기</b>그 집중하는 일에서 내가 맡을 직무는 어떤 역할을 하는가</li></ol>
<div class="example"><span class="ex-label">지민의 깔때기 메모 (가상의 회사)</span>
<p><b>산업</b> 식품 산업은 1인 가구가 늘며 간편식 수요가 커지고, 원재료 가격 변동이 고민이다.<br><b>기업</b> A사는 냉동 간편식에 강하고, 최근 편의점 채널 전용 제품을 늘리고 있다.<br><b>직무</b> 영업관리는 편의점·대리점에 신제품을 입점시키고 재고를 관리해 그 전략을 현장에서 실현하는 자리다.</p></div>
<p>이렇게 세 줄을 쓰고 나면 지원동기의 뼈대가 생깁니다. 산업의 변화, 그 변화에 대응하는 회사의 선택, 그 선택 속에서 내가 할 일이 한 줄로 이어집니다.</p>
<div class="box key"><span class="box-label">핵심</span><p>산업 이야기만 하면 아무 회사나, 직무 이야기만 하면 아무 업계나 됩니다. 세 층을 이어야 '이 회사의 이 직무'가 됩니다.</p></div></div><div class="pf">102</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-4</span>산업의 판을 읽는 5 Forces</h2>
<p>깔때기의 첫 층인 '산업 보기'를 할 때 쓰기 좋은 도구가 있습니다. 경영학자 마이클 포터(Michael E. Porter)의 <b>다섯 가지 경쟁 요인</b>입니다. 이 산업에서 돈을 벌기가 왜 쉽고 왜 어려운지를 다섯 방향에서 봅니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p>한 산업의 수익성은 경쟁사만이 아니라 다섯 가지 힘이 함께 결정합니다. 기존 경쟁자 간의 경쟁, 신규 진입자의 위협, 대체재의 위협, 구매자의 교섭력, 공급자의 교섭력입니다. 힘이 셀수록 그 산업에서 이익을 내기 어렵습니다.</p></div>
<table class="tbl"><tr><th style="width:24%">힘</th><th style="width:36%">던질 질문</th><th>가상의 간편식 회사 A사</th></tr>
<tr><td>기존 경쟁</td><td>비슷한 회사가 얼마나 많은가</td><td>대형 식품사 여럿이 같은 제품군에서 경쟁</td></tr>
<tr><td>신규 진입</td><td>새 회사가 들어오기 쉬운가</td><td>유통사 자체 상표 제품이 늘어남</td></tr>
<tr><td>대체재</td><td>다른 방식으로 같은 필요를 채우는가</td><td>배달 음식, 밀키트</td></tr>
<tr><td>구매자</td><td>사는 쪽이 가격을 좌우하는가</td><td>대형 유통 채널의 입점·가격 협상력</td></tr>
<tr><td>공급자</td><td>파는 쪽이 가격을 좌우하는가</td><td>원재료 가격 변동</td></tr></table>
<p>다섯 칸을 채운 뒤에는 <span class="hl">회사가 가장 신경 쓰는 힘 하나</span>를 고르세요. A사라면 유통 채널의 협상력입니다. 영업관리 직무는 바로 그 힘을 상대하는 자리이니, 지원동기의 중심이 됩니다.</p>
<p class="src">출처: Porter, M. E., "How Competitive Forces Shape Strategy", Harvard Business Review (1979) / Competitive Strategy (1980)</p></div><div class="pf">103</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-5</span>가치사슬에서 내 직무 찾기</h2>
<p>"이 회사에서 당신의 직무는 어떤 역할을 하나요?"에 막힌다면 가치사슬을 그려 보세요. 포터는 기업이 가치를 만드는 활동을 하나의 사슬로 보았습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p><b>본원적 활동</b>은 제품이 고객에게 가기까지 직접 거치는 활동입니다(구매 물류, 생산, 출하 물류, 마케팅·영업, 서비스). <b>지원 활동</b>은 이를 뒷받침하는 활동입니다(기업 인프라, 인적자원관리, 기술개발, 조달). 기업의 경쟁우위는 이 활동들을 어떻게 하고 서로 어떻게 잇느냐에서 생깁니다.</p></div>
<table class="tbl"><tr><th style="width:30%">가치사슬 활동</th><th>연결되는 대표 직무</th></tr>
<tr><td>구매 물류 · 조달</td><td>구매, 자재 관리</td></tr>
<tr><td>생산</td><td>생산관리, 품질, 설비</td></tr>
<tr><td>출하 물류 · 마케팅·영업</td><td>물류, 영업관리, 마케팅</td></tr>
<tr><td>서비스</td><td>고객지원, 기술 서비스</td></tr>
<tr><td>지원 활동</td><td>기획, 재무·회계, 인사, 연구개발, IT</td></tr></table>
<p>사슬을 그리면 내 직무의 <b>앞과 뒤</b>가 보입니다. 품질 앞에는 생산이, 뒤에는 출하와 고객이 있습니다. 준호는 "생산 현장과 고객 불만 사이를 잇는 품질"이라고 자기 역할을 한 줄로 정리할 수 있었습니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>입사 후 누구와 가장 자주 일할지 말하는 지원자는 직무를 사슬 속에서 이해한 사람입니다.</p></div>
<p class="src">출처: Porter, M. E., Competitive Advantage (1985)</p></div><div class="pf">104</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-6</span>비즈니스 모델 캔버스 9블록</h2>
<p>회사가 '무엇으로 돈을 버는지'를 한 장에 그리는 도구입니다. 오스터왈더(Osterwalder)와 피뉴르(Pigneur)가 정리한 비즈니스 모델 캔버스는 사업을 아홉 칸으로 나눕니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<p>비즈니스 모델은 조직이 가치를 만들고, 전달하고, 그 대가를 얻는 방식입니다. 캔버스는 이를 고객 쪽 다섯 칸과 회사 쪽 네 칸, 모두 아홉 칸으로 그립니다.</p></div>
<table class="tbl"><tr><th style="width:24%">블록</th><th>가상의 간편식 회사 A사</th></tr>
<tr><td>고객 세그먼트</td><td>1인 가구, 맞벌이 가정</td></tr>
<tr><td>가치 제안</td><td>조리 시간 10분 이내의 집밥 맛</td></tr>
<tr><td>채널</td><td>편의점, 대형마트, 온라인몰</td></tr>
<tr><td>고객 관계</td><td>신제품 체험 행사, 온라인 후기 관리</td></tr>
<tr><td>수익원</td><td>제품 판매</td></tr>
<tr><td>핵심 자원</td><td>냉동 기술, 생산 공장, 브랜드</td></tr>
<tr><td>핵심 활동</td><td>제품 개발, 대량 생산, 유통 관리</td></tr>
<tr><td>핵심 파트너</td><td>원재료 공급사, 유통사, 물류사</td></tr>
<tr><td>비용 구조</td><td>원재료비, 생산 설비, 물류비, 판촉비</td></tr></table>
<p>칸을 다 채웠다면 <span class="hl">내 직무가 손대는 블록</span>에 표시하세요. 영업관리는 채널과 핵심 파트너, 구매는 핵심 파트너와 비용 구조에 닿습니다. "제가 기여할 곳"을 이 블록의 말로 쓰면 사업 구조를 이해했다는 것이 드러납니다.</p>
<p class="src">출처: Osterwalder, A. & Pigneur, Y., Business Model Generation (2010)</p></div><div class="pf">105</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-7</span>재무제표, 세 숫자만 읽어도 된다</h2>
<p>지원자에게 필요한 것은 회계사의 분석이 아니라 회사의 <b>살림 흐름을 읽는 눈</b>입니다. 사업보고서나 감사보고서의 재무제표에서 세 가지만 보세요.</p>
<div class="box theory"><span class="box-label">이론 노트</span>
<ul><li><b>매출액</b> 제품과 서비스를 팔아 들어온 돈. 회사의 크기와 성장을 보여 준다.</li><li><b>영업이익</b> 매출에서 매출원가와 판매비·관리비를 뺀 것. 본업으로 번 돈이다.</li><li><b>부채비율</b> 부채를 자본으로 나누어 100을 곱한 값. 재무상태표의 '자산 = 부채 + 자본'에서 나온다.</li></ul></div>
<table class="tbl"><tr><th style="width:34%">가상의 B사 (단위: 억 원)</th><th>작년</th><th>올해</th></tr>
<tr><td>매출액</td><td>1,000</td><td>1,150</td></tr>
<tr><td>영업이익</td><td>80</td><td>69</td></tr>
<tr><td>영업이익률</td><td>8%</td><td>6%</td></tr>
<tr><td>부채비율</td><td>120%</td><td>125%</td></tr></table>
<p>B사는 매출이 늘었는데 영업이익은 줄었습니다. 많이 팔았지만 남는 것이 줄었다는 뜻이니, 원가나 판촉비가 늘었을 가능성이 있습니다. 이유는 사업보고서에서 확인합니다. 원재료 가격 때문이라면 <span class="hl">원가 관리</span>가 회사의 과제가 되고, 구매·생산관리 지원자는 그 과제에 맞춰 지원동기를 쓸 수 있습니다.</p>
<div class="box warn"><span class="box-label">주의</span><p>부채비율이 적정한지는 업종마다 다르니 하나의 기준으로 판단하지 마세요. 숫자만 보고 회사의 상황을 단정하는 문장을 자기소개서에 쓰는 것도 피해야 합니다.</p></div></div><div class="pf">106</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-8</span>3C·SWOT 쉽게 하기</h2>
<p>분석 도구라고 하면 어렵게 느끼지만, 지원자에게 필요한 수준은 간단합니다. 칸을 채우는 것보다 <span class="hl">칸 사이를 잇는 것</span>이 중요합니다.</p>
<h3>3C: 세 주체로 보기</h3>
<div class="cards c3"><div class="card"><b>고객</b>누가 이 회사의 제품을 사는가, 무엇을 원하는가</div><div class="card"><b>경쟁사</b>누구와 경쟁하고, 무엇으로 차이를 내는가</div><div class="card"><b>회사</b>이 회사만의 강점과 자원은 무엇인가</div></div>
<h3>SWOT: 안과 밖으로 보기</h3>
<table class="tbl"><tr><th style="width:18%"></th><th>좋은 점</th><th>어려운 점</th></tr>
<tr><td>내부</td><td><b>강점</b> 회사가 잘하는 것</td><td><b>약점</b> 회사가 보완할 것</td></tr>
<tr><td>외부</td><td><b>기회</b> 시장이 열어 주는 것</td><td><b>위협</b> 시장이 막아서는 것</td></tr></table>
<p>칸을 다 채웠다면 한 문장을 더 쓰세요. "강점을 살려 기회를 잡으려면 무엇이 필요한가?" 여기에 나의 직무를 넣으면 지원동기가 됩니다.</p>
<div class="box warn"><span class="box-label">주의</span><p>약점과 위협을 쓸 때는 공개된 자료에 근거하고, 단정적으로 깎아내리는 표현은 피하세요. 면접에서 "우리 회사 약점이 뭐라고 생각해요?"라는 질문을 받으면 '앞으로의 과제'로 표현하는 것이 좋습니다.</p></div></div><div class="pf">107</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-9</span>기업 유형별 분석 포인트</h2>
<p>대기업, 중견·중소기업, 공공기관은 정보의 양도, 면접관이 듣고 싶은 말도 다릅니다. 같은 방법으로 분석하되 무게를 두는 곳을 달리하세요.</p>
<table class="tbl"><tr><th style="width:18%">구분</th><th style="width:41%">주로 볼 것</th><th>지원동기에서 보여 줄 것</th></tr>
<tr><td>대기업</td><td>사업부별 구조, 계열사와의 관계, 전략 방향, 해외 사업</td><td>여러 사업 중 왜 이 사업부·직무인지</td></tr>
<tr><td>중견·중소</td><td>주력 제품, 주요 거래처, 기술력·인증, 대표의 경영 방침</td><td>회사의 핵심 제품을 알고, 오래 일하며 함께 클 의지</td></tr>
<tr><td>공공기관</td><td>설립 목적, 주요 사업, 경영 목표, 국정과제와의 관계, 직무기술서</td><td>공공 가치에 대한 이해와 해당 직무 수행 능력</td></tr></table>
<p>중소기업은 정보가 적어 막막하다는 학생이 많습니다. 이럴 때는 홈페이지의 제품 소개, 고용24 같은 공공 채용 플랫폼의 기업 정보, 지역 언론 기사, 회사가 참여한 전시회 소식을 찾아보세요. 정보가 적은 만큼 조금만 찾아도 차이가 납니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>중소기업 면접에 들어가 보면 주력 제품 이름을 정확히 말하는 지원자가 의외로 적습니다. 제품 이름과 쓰임새를 알고 온 것만으로도 대표님의 표정이 달라지는 것을 여러 번 보았습니다.</p></div></div><div class="pf">108</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-10</span>공공기관은 이렇게 분석한다</h2>
<p>공공기관은 이윤보다 <b>설립 목적</b>을 위해 존재합니다. 분석의 출발점도 '이 기관은 왜 만들어졌는가'입니다.</p>
<ol class="steps"><li><b>설립 목적과 고유사업</b>설립 근거 법률과 홈페이지 기관 소개에서 이 기관만 하는 일을 찾습니다. 다른 기관과 겹치지 않는 사업이 지원동기의 중심입니다.</li><li><b>경영공시</b>공공기관 경영정보 공개시스템(알리오)에서 기관 현황, 인력, 재무, 주요 사업을 같은 항목으로 봅니다. 지방공기업은 '클린아이'에 공시됩니다.</li><li><b>경영 방향</b>기관의 미션·비전, 중장기 경영목표와 전략과제, 경영실적 평가 결과, 관련 정부 정책을 함께 봅니다. 기관이 지금 무엇을 잘해야 하는지가 보입니다.</li><li><b>공공성과 사회적 가치</b>안전, 일자리, 지역 상생, 윤리경영처럼 기관이 공공의 이익을 위해 하는 활동을 확인합니다.</li></ol>
<div class="box key"><span class="box-label">핵심</span><p>"설립 목적, 올해의 전략과제, 그 과제 속 내 직무"를 한 줄로 이을 수 있으면 공공기관 지원동기의 뼈대가 섭니다.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>공공기관 면접에서는 "우리 기관이 하는 일을 설명해 보세요"라는 질문이 자주 나옵니다. 사업 이름을 나열하는 지원자보다, 그 사업이 국민의 어떤 불편을 덜어 주는지 말하는 지원자가 기억에 남습니다.</p></div></div><div class="pf">109</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-11</span>사기업은 이렇게 분석한다</h2>
<p>사기업은 고객에게 선택받아 이익을 내야 살아남습니다. 그래서 분석의 중심은 <b>어떤 사업으로, 누구와 경쟁하며, 어디로 가려 하는가</b>입니다.</p>
<ol class="steps"><li><b>사업보고서(DART)</b>금융감독원 전자공시시스템에서 회사를 검색해 사업보고서의 '사업의 내용'을 읽습니다. 사업부문, 주요 제품, 시장 환경, 연구개발 활동이 회사의 말로 정리되어 있습니다.</li><li><b>사업부문 나누기</b>여러 사업을 한다면 부문별 매출 비중을 보고, 지원 직무가 어느 부문에 속하는지 확인합니다. 회사 전체가 아니라 그 부문을 깊이 아는 것이 더 쓸모 있습니다.</li><li><b>경쟁사와 비교</b>같은 업종 다른 회사의 사업보고서를 함께 펴 보면 이 회사만의 차이가 보입니다.</li><li><b>IR 자료</b>상장사라면 실적 발표 자료에서 회사가 앞으로 힘줄 분야를 확인합니다.</li></ol>
<div class="box tip"><span class="box-label">팁</span><p>상장하지 않은 회사라도 외부감사를 받는 곳은 전자공시에서 감사보고서를 볼 수 있습니다. 공시가 없다면 4-2쪽의 다른 출처로 채우세요.</p></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"우리 회사 경쟁사가 어디라고 생각하세요?"라는 질문에 회사 이름만 대지 않고, 무엇에서 경쟁하는지까지 말하는 지원자는 사업보고서를 읽고 온 사람입니다.</p></div></div><div class="pf">110</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-12</span>인재상을 내 경험으로 번역하기</h2>
<p>인재상은 회사 홈페이지 채용 페이지에서 쉽게 찾을 수 있습니다. '도전', '창의', '협력', '고객 중심' 같은 단어가 많습니다. 그런데 이 단어를 자기소개서에 그대로 옮겨 적으면 아무 효과가 없습니다. 인재상은 <b>베끼는 것이 아니라 번역하는 것</b>입니다.</p>
<ol class="steps"><li><b>뜻 풀기</b>회사가 그 단어를 어떻게 설명하는지 홈페이지 설명 문장을 그대로 읽는다</li><li><b>행동으로 바꾸기</b>그 가치를 가진 사람은 일할 때 어떤 행동을 하는지 적는다</li><li><b>내 장면 찾기</b>내가 그 행동을 했던 경험을 하나 고른다</li></ol>
<div class="compare"><div class="bad">저는 귀사의 인재상인 '도전'에 맞는 도전적인 사람입니다.</div><div class="good">처음 맡은 학과 축제 부스에서 작년 방식 대신 사전 예약제를 시도해 대기 줄을 없앴습니다. 해 보지 않은 방식을 먼저 작게 시험해 보는 것, 그것이 제가 이해한 도전입니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>인재상 단어를 자기소개서에 다섯 번 넣는다고 점수가 오르지 않습니다. 오히려 단어를 한 번도 쓰지 않고 그 가치를 장면으로 보여 준 글이 더 인재상에 맞는 사람으로 읽힙니다.</p></div></div><div class="pf">111</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 4 · 기업분석</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">4-13</span>최근 이슈를 지원동기로 잇기</h2>
<p>뉴스를 찾아 읽는 지원자는 많지만, 뉴스를 지원동기로 잇는 지원자는 적습니다. 대부분 "최근 ○○ 기사를 보고 감명받았습니다"에서 멈춥니다. 뉴스는 세 단계를 거쳐야 내 이야기가 됩니다.</p>
<ol class="steps"><li><b>뉴스</b>회사에 무슨 일이 있었나 (사실만 정리)</li><li><b>회사의 과제</b>그 일 때문에 회사가 앞으로 잘 해내야 할 것은 무엇인가</li><li><b>내가 할 수 있는 일</b>그 과제에서 내 직무와 내 경험은 어떤 역할을 할 수 있는가</li></ol>
<div class="example"><span class="ex-label">준호의 연결 메모 (가상의 사례)</span>
<p><b>뉴스</b> B사가 새 생산라인을 증설해 다음 해부터 가동한다고 발표했다.<br><b>회사의 과제</b> 새 라인이 초기에 안정적인 품질로 자리 잡아야 한다.<br><b>내가 할 수 있는 일</b> 졸업작품에서 불량 원인을 데이터로 추적해 본 경험을 살려, 신규 라인의 초기 불량 분석과 기준 정립을 돕는 품질 엔지니어가 되고 싶다.</p></div>
<div class="box warn"><span class="box-label">주의</span><p>기사는 반드시 날짜와 출처를 확인하고, 한 매체만 보지 말고 회사 보도자료와 함께 교차 확인하세요. 오래된 기사를 최근 일처럼 쓰면 면접에서 바로 드러납니다.</p></div></div><div class="pf">112</div></div></div>

<p>기업분석은 회사가 어디로 가려 하는지 이해한 뒤, <span class="hl">그 길에 내가 어떤 쓸모가 있는지</span>를 찾는 작업입니다.</p>

<h1>경험은 쌓는 것이 아니라<br>꺼내어 말하는 것이다</h1>
<p class="lead">PART 2에서 모은 경험은 아직 재료입니다. 재료가 자기소개서 문장이 되려면 순서가 있는 이야기로 바뀌어야 합니다. 이 장에서는 기업이 왜 경험을 묻는지 이해하고, 경험을 이야기로 정리하고, 역량의 이름을 붙여 증명하는 법을 익힙니다.</p>
<ul class="chap-list"><li>01 경험의 해석과 행동사건면접의 원리</li><li>02 STAR·CAR·PAR·SOAR와 이야기 구조</li><li>03 경험 유형별 작성법</li><li>04 역량 키워드와 직업기초능력 매칭</li><li>05 숫자로 말하기와 에피소드 고르기</li><li>06 공기업 경험기술서·경력기술서</li></ul>
<div class="chap-bar"></div></div><div class="pf">119</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-1</span>경험의 가치는 크기가 아니라 해석</h2>
<p>상담을 하다 보면 "저는 내세울 경험이 없어요"라는 말을 정말 자주 듣습니다. 공모전 수상도, 해외 인턴도, 창업도 없다는 뜻입니다. 그런데 제가 면접관으로 앉아 있을 때 기억에 남는 지원자는 큰 경험을 가진 사람이 아니었습니다. <span class="hl">작은 경험에서 자기 행동의 이유를 설명할 줄 아는 사람</span>이었습니다.</p>
<p>경영학과 4학년 지민 씨는 카페 아르바이트만 2년 했습니다. 처음에는 "커피를 만들고 손님을 응대했다"고만 썼습니다. 함께 이야기를 나눠 보니, 지민 씨는 주말마다 같은 메뉴가 품절되는 것을 보고 요일별 판매량을 노트에 적어 점장님께 발주량 조정을 제안한 적이 있었습니다. 이것은 더 이상 단순 아르바이트가 아닙니다. 문제를 발견하고, 기록하고, 제안한 경험입니다.</p>
<h3>같은 경험을 읽는 두 가지 방식</h3>
<div class="compare"><div class="bad">카페에서 2년간 아르바이트를 하며 성실함을 배웠습니다.</div><div class="good">주말 품절이 반복되는 것을 보고 요일별 판매량을 기록해 발주량 조정을 제안했습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>면접관은 경험의 크기를 비교하지 않습니다. 그 경험 속에서 지원자가 무엇을 보고, 왜 움직였는지를 봅니다. 해석이 없는 큰 경험보다 해석이 있는 작은 경험이 훨씬 강합니다.</p></div></div><div class="pf">120</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-2</span>왜 경험을 묻는가: 행동사건면접</h2>
<p>자기소개서 문항은 대부분 "~했던 경험을 쓰시오"로 끝납니다. "당신은 어떤 사람입니까"라고 묻지 않고 굳이 과거의 경험을 묻는 데에는 분명한 이론적 배경이 있습니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span><p><b>행동사건면접(BEI, Behavioral Event Interview)</b>은 심리학자 데이비드 맥클리랜드(David McClelland)의 역량 연구에서 발전한 면접 방식입니다. 지원자가 실제로 겪은 구체적 사건을 떠올리게 하고, 그때 무엇을 생각하고 어떻게 행동했는지를 깊이 묻습니다. 바탕에는 <span class="hl">과거의 행동이 미래의 행동을 예측한다</span>는 원리가 있습니다. 각오는 꾸밀 수 있지만, 실제로 했던 행동은 그 사람이 일하는 방식을 드러냅니다.</p></div>
<p>오늘날 많은 기업과 공공기관의 구조화 면접, 그리고 경험을 묻는 자기소개서 문항이 이 원리를 따릅니다. 경험 문항은 <b>서류로 치르는 행동사건면접</b>이라고 생각하면 됩니다.</p>
<h3>그래서 경험은 이렇게 씁니다</h3>
<ul><li><b>한 번의 구체적 사건</b>을 씁니다. "평소에 늘"이 아니라 "그 학기, 그 주에"입니다.</li><li><b>생각과 행동</b>을 씁니다. 느낀 점보다 판단한 이유와 한 일이 증거입니다.</li><li><b>내 몫</b>을 씁니다. 팀의 결과 속에서 내가 한 행동을 분리합니다.</li></ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 면접에서 "앞으로 어떻게 하시겠어요?"보다 "그때 실제로 어떻게 하셨어요?"를 더 많이 묻습니다. 서류의 경험이 구체적일수록 이 질문이 편해집니다.</p></div>
<p class="src">참고: David C. McClelland, 「Testing for Competence Rather Than for Intelligence」(1973) / Lyle M. Spencer · Signe M. Spencer, 『Competence at Work』(1993)</p></div><div class="pf">121</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-3</span>STAR 기법, 그리고 L</h2>
<p>경험을 이야기로 바꿀 때 가장 널리 쓰이는 틀이 STAR입니다. 상황(Situation), 과제(Task), 행동(Action), 결과(Result)의 순서로 정리하는 방식입니다. 저는 수업에서 여기에 <b>L(Learned, 배운 점)</b>을 하나 더 붙입니다. 자기소개서는 과거를 보고하는 글이 아니라, 그 경험이 입사 후에 어떻게 이어질지를 보여 주는 글이기 때문입니다.</p>
<ol class="steps">
<li><b>S 상황</b>언제, 어디서, 어떤 조직에서 있었던 일인지 한두 문장으로 배경을 깝니다.</li>
<li><b>T 과제</b>그 상황에서 해결해야 했던 문제나 맡은 역할을 분명히 적습니다.</li>
<li><b>A 행동</b>내가 직접 한 일을 구체적으로 씁니다. "우리"가 아니라 "저"가 주어입니다.</li>
<li><b>R 결과</b>행동이 만든 변화를 가능하면 숫자나 전후 비교로 보여 줍니다.</li>
<li><b>L 배운 점</b>그 경험에서 얻은 원칙이 지원 직무에서 어떻게 쓰일지 연결합니다.</li>
</ol>
<div class="box key"><span class="box-label">핵심</span><p>STAR는 글의 목차가 아니라 생각의 순서입니다. 실제 원고에서는 결론을 먼저 쓰고 STAR를 근거로 풀어 놓는 경우가 많습니다. 이 방식은 PART 6의 피라미드 원칙에서 다시 다룹니다.</p></div>
<div class="box warn"><span class="box-label">주의</span><p>T를 빼먹는 경우가 가장 많습니다. 과제가 없으면 행동의 이유가 사라집니다.</p></div></div><div class="pf">122</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-4</span>STAR만 있는 것은 아니다: 네 가지 틀</h2>
<p>경험을 정리하는 틀은 STAR 말고도 여럿 있습니다. 이름은 달라도 뼈대는 같습니다. <b>어떤 문제가 있었고, 내가 무엇을 했고, 무엇이 달라졌는가.</b> 차이는 어느 부분을 앞에 세우느냐에 있습니다.</p>
<table class="tbl"><tr><th style="width:13%">틀</th><th style="width:40%">구성</th><th>잘 맞는 문항</th></tr>
<tr><td>STAR</td><td>상황(Situation) - 과제(Task) - 행동(Action) - 결과(Result)</td><td>일반 경험 문항, 맡은 역할이 분명한 경험</td></tr>
<tr><td>CAR</td><td>도전(Challenge) - 행동(Action) - 결과(Result)</td><td>300~500자의 짧은 문항, 어려움이 핵심인 경험</td></tr>
<tr><td>PAR</td><td>문제(Problem) - 행동(Action) - 결과(Result)</td><td>문제해결, 개선, 원인 분석 문항</td></tr>
<tr><td>SOAR</td><td>상황(Situation) - 장애물(Obstacle) - 행동(Action) - 결과(Result)</td><td>갈등, 실패 극복, 위기 대응 문항</td></tr></table>
<h3>언제 무엇을 쓰나</h3>
<p>글자 수가 넉넉하고 배경 설명이 필요하면 STAR가 안전합니다. 짧은 문항에서는 상황과 과제를 한 문장으로 합친 CAR나 PAR가 효율적입니다. 문항에 "어려움", "갈등", "실패"라는 말이 있으면 SOAR처럼 장애물을 따로 세워야 극복 과정이 살아납니다.</p>
<div class="box tip"><span class="box-label">팁</span><p>틀을 네 개 다 외울 필요는 없습니다. STAR 하나에 익숙해진 뒤, 문항 길이와 성격에 맞춰 덜어 내거나 장애물을 더하는 감각만 기르면 충분합니다.</p></div>
<p class="src">참고: STAR는 행동면접 실무에서 널리 쓰이는 구조이고, CAR·PAR·SOAR는 커리어 코칭 현장의 변형 틀입니다. 경영 전략의 SOAR 분석(강점·기회·열망·결과)과는 다른 개념입니다.</p></div><div class="pf">123</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-5</span>비율 감각: 행동을 가장 길게</h2>
<p>STAR 구조를 알아도 실제 원고를 보면 상황 설명이 절반을 차지하는 경우가 많습니다. 동아리가 어떤 곳인지, 행사가 얼마나 컸는지를 길게 쓰고 정작 내가 한 일은 한 줄로 끝납니다. 면접관이 알고 싶은 것은 동아리가 아니라 지원자입니다.</p>
<table class="tbl"><tr><th style="width:24%">요소</th><th style="width:20%">권장 비중</th><th>쓰는 요령</th></tr>
<tr><td>S 상황</td><td>짧게</td><td>한두 문장. 배경은 이해에 필요한 만큼만</td></tr>
<tr><td>T 과제</td><td>짧게</td><td>문제를 한 문장으로 정의</td></tr>
<tr><td>A 행동</td><td>가장 길게</td><td>판단 이유, 구체적 방법, 어려움을 넘은 과정</td></tr>
<tr><td>R 결과</td><td>중간</td><td>숫자, 전후 비교, 주변의 반응</td></tr>
<tr><td>L 배운 점</td><td>짧고 단단하게</td><td>직무와 이어지는 한 문장</td></tr></table>
<p class="small">비중은 정해진 공식이 아니라 감각입니다. 다 쓴 원고에서 행동 부분에 형광펜을 칠해 보았을 때 가장 넓은 면적이 나오면 균형이 맞은 것입니다.</p>
<h3>행동을 길게 쓰는 세 가지 질문</h3>
<ul><li>여러 방법 중에 왜 그 방법을 골랐나요?</li><li>구체적으로 무엇을 몇 번, 어떤 도구로 했나요?</li><li>중간에 막혔을 때 어떻게 바꾸었나요?</li></ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>면접에서 꼬리 질문이 몰리는 곳은 언제나 행동입니다. 서류에서 행동이 짧으면 면접에서 물어볼 거리도 없어집니다.</p></div></div><div class="pf">124</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-6</span>STAR 예시: 고치기 전과 후</h2>
<p>기계공학과 4학년 준호 씨가 처음 가져온 원고입니다. 문항은 "목표를 세우고 끝까지 달성한 경험"이었습니다.</p>
<div class="compare stack"><div class="bad">저는 3학년 때 캡스톤디자인 수업에서 팀장을 맡았습니다. 우리 팀은 5명이었고 자동 분류 컨베이어를 만드는 것이 주제였습니다. 처음에는 어려움이 많았지만 팀원들과 열심히 노력한 결과 좋은 성적을 받을 수 있었습니다. 이 경험을 통해 포기하지 않는 끈기를 배웠습니다.</div>
<div class="good">[S] 3학년 캡스톤디자인에서 5인 팀의 팀장으로 자동 분류 컨베이어를 제작했습니다. [T] 중간 시연에서 센서가 물체를 잘못 인식해 분류 정확도가 기대에 크게 못 미쳤고, 최종 발표까지 4주가 남아 있었습니다. [A] 저는 원인을 감으로 찾지 않고 조건별로 나누어 보기로 했습니다. 조명, 물체 색, 벨트 속도를 하나씩 바꾸며 매일 30회씩 시험해 기록표를 만들었고, 그 결과 반사가 심한 조명 아래에서 오류가 몰린다는 것을 확인했습니다. 차광 덮개를 설계해 붙이고 벨트 속도를 낮춰 다시 시험했습니다. [R] 최종 시연에서 분류 오류가 눈에 띄게 줄었고, 기록표는 다음 학기 후배 팀의 참고 자료로 쓰였습니다. [L] 문제를 변수별로 쪼개 기록하는 습관은 생산 현장의 불량 원인을 찾는 일에도 그대로 쓰일 것입니다.</div></div>
<div class="box tip"><span class="box-label">팁</span><p>원고에서 [S][T] 같은 표시는 연습용입니다. 실제 제출 원고에서는 지우고, 문단 흐름으로 자연스럽게 이어지게 하세요.</p></div></div><div class="pf">125</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-7</span>이야기의 힘: 갈등, 전환점, 변화</h2>
<p>STAR로 정리한 원고가 정확한데도 밋밋하게 읽힐 때가 있습니다. 사실은 다 들어 있는데 <b>이야기</b>가 없기 때문입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span><p>사회언어학자 윌리엄 라보프(William Labov)는 사람들이 직접 겪은 일을 말할 때 공통된 구조가 있음을 밝혔습니다. 배경 소개, 일이 꼬이는 사건, 그 일이 왜 중요했는지 짚는 평가, 해결, 그리고 지금으로 돌아오는 마무리입니다. 이야기를 이야기답게 만드는 것은 <span class="hl">일이 꼬이는 지점과 그 의미를 짚는 평가</span>입니다.</p></div>
<h3>자기소개서에 옮기면 세 가지</h3>
<div class="cards c3"><div class="card"><b>갈등</b>계획대로 되지 않은 순간. 마감, 반대 의견, 예상 밖 결과</div><div class="card"><b>전환점</b>내가 생각을 바꾸거나 결정을 내린 순간과 그 이유</div><div class="card"><b>변화</b>상황이 달라진 것, 그리고 나의 일하는 방식이 달라진 것</div></div>
<div class="compare"><div class="bad">팀원들과 열심히 준비해 학술제에서 입상했습니다.</div><div class="good">발표 사흘 전, 실험 결과가 가설과 반대로 나왔습니다. 저는 결과를 감추지 말고 "왜 다르게 나왔나"를 발표 주제로 바꾸자고 제안했습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 서류의 전환점 문장에 밑줄을 긋습니다. 면접 질문이 거기서 나옵니다.</p></div>
<p class="src">참고: William Labov · Joshua Waletzky, 「Narrative Analysis: Oral Versions of Personal Experience」(1967)</p></div><div class="pf">126</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-8</span>경험 유형별 작성법 ①</h2>
<p>같은 STAR라도 경험의 종류마다 면접관이 눈여겨보는 지점이 다릅니다. 학생들이 가장 많이 쓰는 여섯 가지 유형을 두 쪽에 나누어 정리했습니다.</p>
<h3>아르바이트</h3>
<p><b>포인트</b> "시킨 일을 했다"가 아니라 <span class="hl">일하는 방식을 바꾼 순간</span>을 씁니다. 성실함만 쓰면 누구의 서류인지 구분되지 않습니다.</p>
<div class="example"><span class="ex-label">예문</span>편의점 야간 근무 때 유통기한 점검 순서가 사람마다 달라 폐기가 반복되었습니다. 저는 진열대별 점검 순서를 한 장의 표로 만들어 교대 근무자와 공유했습니다.</div>
<h3>팀 프로젝트</h3>
<p><b>포인트</b> 팀의 결과와 <b>나의 몫</b>을 분리합니다. 역할 분담, 의견 충돌, 일정 관리 중 내가 맡은 장면 하나에 집중하세요.</p>
<div class="example"><span class="ex-label">예문</span>다섯 명이 자료 조사를 나누다 보니 같은 내용이 겹쳤습니다. 저는 공유 문서에 주제별 칸을 만들어 각자 맡은 범위를 표시하자고 제안했습니다.</div>
<h3>현장실습·인턴</h3>
<p><b>포인트</b> 직무와 가장 가까운 경험입니다. "배웠다"보다 <b>기여한 것</b>을 쓰고, 회사 내부 정보는 일반적인 표현으로 바꿉니다.</p>
<div class="example"><span class="ex-label">예문</span>반복되는 거래처 문의를 정리해 자주 묻는 질문 목록을 만들었고, 담당 대리님이 이를 신입 교육 자료로 활용하셨습니다.</div></div><div class="pf">127</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-8</span>경험 유형별 작성법 ②</h2>
<h3>동아리·학생회</h3>
<p><b>포인트</b> 직책 이름보다 사람, 규칙, 예산을 다루며 <b>해결한 문제</b>를 씁니다.</p>
<div class="example"><span class="ex-label">예문</span>회비 사용 내역을 묻는 부원이 늘자, 저는 월별 지출을 영수증 사진과 함께 공유하는 방식을 만들었습니다.</div>
<h3>봉사활동</h3>
<p><b>포인트</b> 착한 마음보다 <span class="hl">상대의 관점에서 바꾼 것</span>을 씁니다.</p>
<div class="example"><span class="ex-label">예문</span>어르신 스마트폰 교실에서 설명을 따라오지 못하는 분이 많아, 화면을 크게 인쇄한 단계별 안내지를 만들었습니다.</div>
<h3>공모전·자격증</h3>
<p><b>포인트</b> 수상과 취득은 결과일 뿐입니다. 목표를 세운 이유와 <b>과정에서 바꾼 방법</b>을 쓰고, 자격증은 "왜 그 자격증이었는지"를 직무와 연결합니다.</p>
<div class="example"><span class="ex-label">예문</span>공모전 1차 심사에서 "자료는 많은데 결론이 없다"는 평가를 받았습니다. 저는 분석 결과를 한 장 요약으로 먼저 보여 주는 방식으로 보고서를 다시 구성했습니다.</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>유형이 무엇이든 제가 확인하는 것은 같습니다. "이 사람이 있기 전과 후에 무엇이 달라졌는가."</p></div></div><div class="pf">128</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-9</span>역량 키워드 사전 ①</h2>
<p>경험에 이름을 붙이려면 역량 어휘가 필요합니다. 아래는 채용 공고와 직무기술서에서 자주 보이는 역량과, 그 역량을 보여 주는 행동의 예입니다. 역량 이름만 쓰지 말고 <span class="hl">오른쪽 칸 같은 행동</span>으로 증명해야 합니다.</p>
<table class="tbl"><tr><th style="width:24%">역량</th><th>이런 행동이 그 역량을 보여 준다</th></tr>
<tr><td>문제해결력</td><td>원인을 나누어 확인하고, 대안을 비교해 하나를 골라 실행했다</td></tr>
<tr><td>분석력</td><td>흩어진 자료를 표로 정리해 패턴이나 이상값을 찾아냈다</td></tr>
<tr><td>꼼꼼함</td><td>점검표를 만들어 반복되는 실수를 줄였다</td></tr>
<tr><td>책임감</td><td>맡은 일이 막혔을 때 미루지 않고 기한 안에 끝냈다</td></tr>
<tr><td>협업</td><td>역할을 나누고 진행 상황을 공유하는 방식을 만들었다</td></tr>
<tr><td>소통</td><td>상대가 이해하기 쉬운 말과 자료로 바꾸어 설명했다</td></tr>
<tr><td>리더십</td><td>방향을 제시하고 구성원의 참여를 이끌어 결과를 냈다</td></tr>
<tr><td>조정·중재</td><td>의견이 부딪힐 때 기준을 세워 합의점을 찾았다</td></tr></table>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>"소통 능력이 뛰어납니다"라는 문장은 증거가 아니라 주장입니다. 저는 그 다음 문장에 행동이 나오는지만 봅니다.</p></div></div><div class="pf">129</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-9</span>역량 키워드 사전 ②</h2>
<table class="tbl"><tr><th style="width:24%">역량</th><th>이런 행동이 그 역량을 보여 준다</th></tr>
<tr><td>고객지향</td><td>고객의 불편을 듣고 응대 방식이나 안내물을 바꾸었다</td></tr>
<tr><td>도전정신</td><td>해 보지 않은 일에 먼저 손을 들고 끝까지 시도했다</td></tr>
<tr><td>학습민첩성</td><td>새 도구나 지식을 짧은 기간에 익혀 실제 과제에 적용했다</td></tr>
<tr><td>실행력</td><td>계획에 머물지 않고 일정을 쪼개 바로 움직였다</td></tr>
<tr><td>자기관리</td><td>학업과 일을 병행하며 시간표와 우선순위를 지켰다</td></tr>
<tr><td>윤리의식</td><td>편한 길이 있어도 규칙과 절차를 지키도록 제안했다</td></tr>
<tr><td>기획력</td><td>목적을 정하고 대상, 일정, 예산을 짜서 실행안을 만들었다</td></tr>
<tr><td>적응력</td><td>낯선 환경이나 갑작스러운 변화에 맞게 방식을 바꾸었다</td></tr></table>
<h3>사전을 쓰는 법</h3>
<p>먼저 지원 직무의 공고와 직무기술서에서 반복되는 역량 단어를 3~5개 찾습니다(PART 3 참고). 그 다음 이 표의 오른쪽 칸을 보며 내 경험 중 비슷한 행동이 있었는지 떠올립니다. 단어에서 경험으로 가는 것이 아니라, <b>행동에서 단어로</b> 거슬러 올라가는 연습입니다.</p>
<div class="box tip"><span class="box-label">팁</span><p>한 경험에 역량 이름을 너무 많이 붙이지 마세요. 한 문항에서는 하나의 역량을 깊게 보여 주는 편이 기억에 남습니다.</p></div></div><div class="pf">130</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-10</span>직업기초능력 10영역과 보여 줄 경험</h2>
<p>공공기관 서류는 NCS 직업기초능력(PART 1 참고)을 기준으로 평가하는 경우가 많습니다. 채용 공고의 직무기술서에서 표시된 영역을 확인하고, 영역마다 꺼낼 경험을 미리 짝지어 두세요.</p>
<table class="tbl"><tr><th style="width:24%">영역</th><th>이런 경험이 그 능력을 보여 준다</th></tr>
<tr><td>의사소통능력</td><td>회의 내용을 문서로 정리하거나, 상대 수준에 맞춰 설명을 바꾼 경험</td></tr>
<tr><td>수리능력</td><td>회계 장부, 판매량, 설문 결과를 집계하고 수치로 해석한 경험</td></tr>
<tr><td>문제해결능력</td><td>원인을 나누어 찾고 개선안을 실행한 경험</td></tr>
<tr><td>자기개발능력</td><td>부족한 점을 알아차리고 계획을 세워 꾸준히 익힌 경험</td></tr>
<tr><td>자원관리능력</td><td>시간, 예산, 물품, 인원을 나누고 아낀 경험</td></tr>
<tr><td>대인관계능력</td><td>팀워크, 갈등 조정, 고객 응대에서 관계를 지킨 경험</td></tr>
<tr><td>정보능력</td><td>자료를 찾아 분류하고 엑셀 같은 도구로 가공한 경험</td></tr>
<tr><td>기술능력</td><td>장비나 프로그램을 익혀 적용하고 안전 수칙을 지킨 경험</td></tr>
<tr><td>조직이해능력</td><td>조직의 규칙과 업무 흐름을 파악해 내 일을 맞춘 경험</td></tr>
<tr><td>직업윤리</td><td>편한 길 대신 규정과 약속을 지키고 책임을 다한 경험</td></tr></table>
<div class="box key"><span class="box-label">핵심</span><p>한 경험으로 열 가지를 모두 보여 주려 하지 마세요. 문항이 묻는 영역 하나에 조명을 맞추는 것이 원칙입니다.</p></div>
<p class="src">참고: 국가직무능력표준(NCS) 직업기초능력 체계(고용노동부·한국산업인력공단)</p></div><div class="pf">131</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-11</span>숫자로 말하기</h2>
<p>숫자는 읽는 사람의 머릿속에 장면의 크기를 바로 그려 줍니다. "많은 손님"보다 "점심 2시간 동안 80명"이 훨씬 선명합니다. 다만 숫자는 <span class="hl">내가 실제로 확인할 수 있는 것</span>만 써야 합니다. 면접에서 근거를 물으면 답할 수 있어야 하기 때문입니다.</p>
<h3>숫자를 찾는 다섯 군데</h3>
<div class="cards"><div class="card"><b>규모</b>인원, 횟수, 기간, 예산</div><div class="card"><b>시간</b>걸린 시간, 줄인 시간, 마감까지 남은 날</div><div class="card"><b>빈도</b>매일, 주 3회, 학기당 몇 번</div><div class="card"><b>변화</b>전과 후, 처음과 마지막</div></div>
<p>정확한 수치가 없을 때는 기록을 뒤져 보세요. 단톡방, 회계 장부, 출석부, 과제 제출 내역에 숫자가 남아 있는 경우가 많습니다. 끝내 확인이 안 되면 숫자를 지어내지 말고 전후 비교로 바꾸어 씁니다.</p>
<div class="compare"><div class="bad">동아리 홍보를 열심히 해서 신입 부원이 많이 늘었습니다.</div><div class="good">모집 포스터를 학과별 단톡방 12곳에 직접 올리고 설명회를 2회 열어, 지난 학기 7명이던 신입 부원이 15명이 되었습니다.</div></div>
<div class="box warn"><span class="box-label">주의</span><p>부풀린 숫자는 면접에서 반드시 드러납니다. "어떻게 셌나요?"라는 질문 하나에 답이 흔들리면 서류 전체의 신뢰가 무너집니다.</p></div></div><div class="pf">132</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-12</span>에피소드 고르는 기준</h2>
<p>경험 인벤토리를 만들어 보면 쓸 만한 경험이 생각보다 많습니다. 이제는 무엇을 대표로 내세울지 골라야 합니다. 저는 학생들에게 아래 다섯 가지 기준으로 점수를 매겨 보라고 합니다.</p>
<table class="tbl"><tr><th style="width:26%">기준</th><th>스스로에게 묻는 질문</th></tr>
<tr><td>주도성</td><td>내가 판단하고 움직인 부분이 분명한가?</td></tr>
<tr><td>직무 관련성</td><td>지원 직무에서 쓰는 역량과 이어지는가?</td></tr>
<tr><td>구체성</td><td>장면, 대화, 숫자를 떠올려 말할 수 있는가?</td></tr>
<tr><td>변화</td><td>시작과 끝 사이에 눈에 보이는 차이가 있는가?</td></tr>
<tr><td>최근성</td><td>대학 이후, 가급적 최근의 일인가?</td></tr></table>
<p>점수가 비슷하다면 면접에서 10분 동안 질문을 받아도 막히지 않을 경험을 고르세요. 기억이 흐릿한 경험은 서류에서는 그럴듯해도 면접에서 무너집니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>고등학교 시절 이야기로 직무 역량을 설명하는 서류를 종종 봅니다. 나쁜 경험은 아니지만, 대학 시절에 그만한 이야기가 없었는지 궁금해집니다. 가능하면 최근 경험을 대표로 세우세요.</p></div></div><div class="pf">133</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-13</span>같은 경험, 다른 역량</h2>
<p>좋은 경험 하나는 여러 문항에 쓸 수 있습니다. 비결은 같은 사건에서 <span class="hl">어떤 행동에 조명을 비추느냐</span>입니다. 간호학과 4학년 서연 씨의 경험으로 살펴보겠습니다.</p>
<div class="example"><span class="ex-label">경험 원재료</span>학과 학생회에서 신입생 대상 실습 안내 행사를 준비했다. 장소가 갑자기 바뀌었고, 준비 인원 중 두 명이 빠졌다. 체크리스트를 새로 만들어 역할을 다시 나누었고, 선배들의 실습 경험담을 모아 안내 자료를 만들었다. 행사 후 설문에서 신입생들이 실습 준비가 덜 막막해졌다고 답했다.</div>
<table class="tbl"><tr><th style="width:20%">역량</th><th style="width:36%">조명을 비출 행동</th><th>첫 문장 예</th></tr>
<tr><td>적응력</td><td>장소 변경에 맞춰 동선과 일정을 다시 짠 과정</td><td>행사 이틀 전 장소가 바뀌었을 때 동선부터 다시 그렸습니다.</td></tr>
<tr><td>협업</td><td>인원이 빠진 뒤 체크리스트로 역할을 재분배한 과정</td><td>두 명이 빠진 자리를 체크리스트로 나누어 메웠습니다.</td></tr>
<tr><td>고객지향</td><td>신입생 눈높이로 경험담을 모아 자료를 만든 과정</td><td>신입생이 가장 불안해하는 것이 무엇인지부터 물었습니다.</td></tr></table>
<div class="box key"><span class="box-label">핵심</span><p>같은 경험을 여러 문항에 쓸 때는 강조하는 행동이 겹치지 않게 하세요. 한 서류 안에서 같은 장면이 두 번 나오면 경험이 적어 보입니다.</p></div></div><div class="pf">134</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-14</span>공기업의 경험기술서와 경력기술서</h2>
<p>NCS 기반 블라인드 채용을 하는 공공기관은 자기소개서와 별도로 <b>경험기술서</b>와 <b>경력기술서</b>를 받는 경우가 있습니다. 이름은 비슷하지만 담는 내용이 다릅니다.</p>
<table class="tbl"><tr><th style="width:18%">구분</th><th style="width:41%">경력기술서</th><th>경험기술서</th></tr>
<tr><td>대상</td><td>금전적 보수를 받고 일정 기간 일한 경력(아르바이트, 인턴 등 근로)</td><td>보수 없이 수행한 직무 관련 활동(팀 프로젝트, 동아리, 연구회, 봉사 등)</td></tr>
<tr><td>중심 내용</td><td>맡은 직무, 담당 업무, 업무 성과</td><td>활동 목적, 나의 역할, 행동과 결과</td></tr>
<tr><td>읽는 관점</td><td>그 일을 실제로 어떻게 수행했나</td><td>그 활동이 직무 역량과 어떻게 이어지나</td></tr></table>
<h3>작성 원칙 세 가지</h3>
<ol class="steps">
<li><b>직무 관련성</b>입사지원서에 적은 경력·경험 중 직무기술서의 능력과 이어지는 것을 고릅니다.</li>
<li><b>역할, 행동, 결과</b>나의 역할을 먼저 밝히고, 구체적 행동과 결과를 순서대로 씁니다.</li>
<li><b>블라인드 원칙</b>학교명, 출신 지역처럼 개인을 드러내는 정보는 쓰지 않고, 기관명 표기는 공고 안내를 따릅니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>공공기관 면접에서는 경험기술서를 펼쳐 놓고 질문을 만드는 경우가 많습니다. 기술서의 한 줄 한 줄이 면접 질문의 재료라고 생각하세요.</p></div>
<p class="src">참고: 국가직무능력표준(NCS) 블라인드 채용 입사지원서 양식과 안내 자료(고용노동부·한국산업인력공단)</p></div><div class="pf">135</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-15</span>기술서 예문 ①: 경험기술서</h2>
<p>간호학과 서연 씨가 공공 의료기관에 지원하며 쓴 경험기술서입니다. 자기소개서보다 형식이 단정하고, 항목을 나누어 쓰는 경우가 많습니다.</p>
<div class="example"><span class="ex-label">경험기술서 예문</span>[활동 개요] 학과 학생회에서 신입생 대상 실습 안내 행사의 기획을 맡았습니다(6주).<br>[역할과 행동] 행사 이틀 전 장소가 바뀌고 준비 인원 두 명이 빠졌습니다. 저는 남은 일을 체크리스트로 다시 정리해 역할을 재분배하고, 바뀐 장소에 맞춰 동선을 새로 그렸습니다. 또 신입생이 실습 전에 가장 불안해하는 점을 미리 물어, 선배들의 경험담을 주제별로 묶은 안내 자료를 만들었습니다.<br>[결과] 행사 후 설문에서 신입생들은 실습 준비가 덜 막막해졌다고 답했고, 안내 자료는 다음 학기 행사에도 쓰였습니다.<br>[직무 연결] 상대의 불안을 먼저 확인하고 절차를 정리하는 습관을 환자 안내와 교육 업무에 살리겠습니다.</div>
<h3>이 예문에서 볼 점</h3>
<ul><li>활동 개요에 학교명이 없고, "학과 학생회"라는 일반 명칭만 씁니다.</li><li>행동이 가장 길고, 행동마다 이유가 붙어 있습니다.</li><li>직업기초능력으로는 문제해결능력과 의사소통능력이 함께 드러납니다.</li></ul>
<div class="box tip"><span class="box-label">팁</span><p>항목 이름은 기관 양식이 정해 주는 경우가 많습니다. 양식이 없으면 위의 네 항목을 그대로 써도 무리가 없습니다.</p></div></div><div class="pf">136</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">5-15</span>기술서 예문 ②: 경력기술서</h2>
<p>경영학과 지민 씨가 공공기관 사업관리 직무에 지원하며 쓴 경력기술서입니다. 카페 아르바이트는 보수를 받은 근로이므로 경험이 아니라 경력으로 씁니다.</p>
<div class="example"><span class="ex-label">경력기술서 예문</span>[근무 형태와 기간] 카페 매장 시간제 직원, 2년<br>[담당 업무] 음료 제조, 고객 응대, 마감 재고 점검<br>[수행 내용] 주말마다 같은 메뉴가 품절되는 것을 보고 4주 동안 요일별 판매량을 직접 기록했습니다. 기록을 표로 정리해 점장님께 주말 발주량 조정을 제안했고, 조정 뒤에도 2주간 품절 여부를 다시 확인했습니다.<br>[성과] 조정 이후 주말 품절이 거의 사라졌고, 기록 방식은 매장의 발주 참고 자료로 계속 쓰였습니다.<br>[직무 연결] 기록으로 흐름을 읽는 습관을 사업 실적 점검과 예산 집행 관리에 적용하겠습니다.</div>
<h3>경력기술서에서 자주 하는 실수</h3>
<div class="compare"><div class="bad">카페에서 2년간 근무하며 다양한 업무를 성실히 수행했습니다.</div><div class="good">담당 업무 세 가지를 밝히고, 그중 성과가 있었던 업무 하나를 행동과 결과로 풀었습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>경력기술서에서 저는 업무 목록보다 "그 업무를 본인 방식으로 어떻게 했는가"를 찾습니다. 담당 업무는 짧게, 수행 내용은 길게 쓰세요.</p></div></div><div class="pf">137</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 5 · 경험을 이야기로</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">PART 5</span>정리: 경험을 이야기로</h2>
<p>이 장에서 만든 대표 에피소드 5개와 기술서는 PART 7의 문항별 작성에서 그대로 꺼내 쓰게 됩니다. 지원동기를 제외한 거의 모든 문항이 결국 "그런 사람이라는 근거를 경험으로 보여 달라"는 요청이기 때문입니다.</p>
<h3>꼭 기억할 여섯 가지</h3>
<ol class="steps">
<li><b>과거 행동이 증거다</b>경험 문항은 서류로 치르는 행동사건면접입니다. 한 번의 구체적 사건을 씁니다.</li>
<li><b>틀은 STAR, 맛은 이야기</b>행동을 가장 길게 쓰고, 갈등과 전환점으로 이야기를 살립니다.</li>
<li><b>역량은 행동으로 증명한다</b>역량 이름과 직업기초능력은 결론이고, 행동이 근거입니다.</li>
<li><b>숫자는 확인된 것만 쓴다</b>없으면 전후 비교로 바꾸고, 절대 지어내지 않습니다.</li>
<li><b>한 경험, 여러 조명</b>강조하는 행동을 바꾸면 하나의 경험이 여러 문항에 쓰입니다.</li>
<li><b>경력과 경험을 구분한다</b>공기업 기술서는 보수 여부로 나누고, 블라인드 원칙을 지킵니다.</li>
</ol>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>서류를 통과한 뒤 면접에서 가장 자주 무너지는 지점은 "그때 구체적으로 무엇을 하셨어요?"라는 질문입니다. 이 장의 워크시트를 꼼꼼히 채웠다면, 그 질문이 오히려 반가워질 것입니다.</p></div></div><div class="pf">143</div></div></div>
<div class="page"><div class="pg opener"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 6</div>
<h1>읽히는 글이<br>평가받는다</h1>
<p class="lead">좋은 재료가 있어도 읽히지 않으면 평가받지 못합니다. 이 장에서는 문항의 의도를 읽고, 논리적 글쓰기의 원리로 결론과 근거를 세우고, 짧고 구체적인 문장으로 다듬는 자기소개서의 기본 원리를 다룹니다.</p>
<ul class="chap-list"><li>01 평가 문서와 문항 의도 해석</li><li>02 피라미드 원칙, MECE, 설득의 3요소</li><li>03 두괄식, 소제목, 문단 설계</li><li>04 문장 원칙과 문단 만들기 연습</li><li>05 공기업과 사기업 자기소개서의 차이</li><li>06 블라인드 채용과 흔한 실수</li></ul>
<div class="chap-bar"></div></div><div class="pf">144</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-1</span>자기소개서는 평가 문서다</h2>
<p>많은 학생이 자기소개서를 "나를 소개하는 글"로 이해합니다. 그래서 어린 시절 이야기부터 시작하고, 좋아하는 것과 꿈을 나열합니다. 하지만 회사 입장에서 자기소개서는 <span class="hl">이 사람을 면접에 부를지 판단하는 평가 문서</span>입니다.</p>
<p>평가 문서라는 말은 읽는 사람에게 기준이 있다는 뜻입니다. 문항마다 확인하고 싶은 역량이 있고, 읽는 사람은 그 근거가 있는지를 찾습니다. 수많은 서류를 정해진 시간 안에 읽어야 하기 때문에, 근거가 앞에 보이지 않으면 다음 서류로 넘어갑니다.</p>
<div class="cards"><div class="card"><b>소개하는 글로 쓰면</b>내가 하고 싶은 이야기를 시간 순서로 늘어놓는다</div><div class="card"><b>평가 문서로 쓰면</b>묻는 것에 먼저 답하고 근거를 차례로 제시한다</div></div>
<h3>읽는 사람이 서류에서 찾는 것</h3>
<ul><li>문항이 묻는 것에 정확히 답했는가</li><li>주장마다 경험이라는 근거가 붙어 있는가</li><li>그 역량이 우리 직무에서 쓰일 수 있는가</li><li>면접에서 더 물어보고 싶은 지점이 있는가</li></ul>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 서류를 읽으며 늘 "그래서 이 사람은 무엇을 할 수 있지?"를 묻습니다. 그 답이 첫 문단 안에 나오는 서류가 손에 남습니다.</p></div></div><div class="pf">145</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-2</span>문항 의도 해석법</h2>
<p>자기소개서 문항은 짧지만 그 안에 여러 질문이 겹쳐 있습니다. 쓰기 전에 문항을 <b>키워드 단위로 쪼개고</b>, 각 키워드가 무엇을 확인하려는지 적어 보세요.</p>
<div class="example"><span class="ex-label">예시 문항</span>예상하지 못한 어려움 속에서도 목표를 달성하기 위해 끈기 있게 노력한 경험과, 그 과정에서 본인이 기여한 바를 구체적으로 기술하시오.</div>
<table class="tbl"><tr><th style="width:30%">키워드</th><th>숨은 질문</th></tr>
<tr><td>예상하지 못한 어려움</td><td>돌발 상황에서 어떻게 판단하는가?</td></tr>
<tr><td>목표</td><td>스스로 목표를 세우는 사람인가?</td></tr>
<tr><td>끈기 있게 노력</td><td>쉽게 포기하지 않고 방법을 바꿔 가며 버티는가?</td></tr>
<tr><td>본인이 기여한 바</td><td>팀 성과 속에서 내 몫을 구분해 말할 수 있는가?</td></tr>
<tr><td>구체적으로</td><td>행동과 숫자로 증명할 수 있는가?</td></tr></table>
<p>이렇게 쪼개 보면 이 문항에 써야 할 것이 분명해집니다. 어려움의 내용, 내가 세운 목표, 방법을 바꾼 과정, 그리고 "저의 몫"입니다. 하나라도 빠지면 문항에 답하지 않은 글이 됩니다.</p>
<div class="box tip"><span class="box-label">팁</span><p>"구체적으로", "본인이" 같은 단어는 지나치기 쉽지만 채점 기준에 가까운 신호입니다. 문항을 출력해 형광펜을 그어 보세요.</p></div></div><div class="pf">146</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-3</span>피라미드 원칙: 결론 먼저, 근거는 묶어서</h2>
<p>문항을 해석했다면 이제 답을 쌓는 순서를 정할 차례입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span><p>컨설팅 회사의 보고서 작성법을 정리한 바바라 민토(Barbara Minto)의 <b>피라미드 원칙</b>은 글을 피라미드처럼 쌓으라고 말합니다. 맨 위에 핵심 메시지 하나를 두고, 그 아래에 메시지를 받치는 근거를 묶어 둡니다. 위의 주장은 아래 근거를 요약하고, 아래 근거는 위의 주장에 대한 <span class="hl">"왜 그렇게 말할 수 있나?"에 답해야</span> 합니다.</p></div>
<h3>자기소개서 한 문항을 피라미드로 세우면</h3>
<div class="box key"><span class="box-label">맨 위: 결론</span><p>저는 기록으로 문제를 찾아 해결하는 사람입니다.</p></div>
<div class="cards c3"><div class="card"><b>근거 1 발견</b>4주간 요일별 판매량을 기록해 주말 품절의 원인을 찾았다</div><div class="card"><b>근거 2 제안</b>기록표를 근거로 점장님께 발주량 조정을 제안했다</div><div class="card"><b>근거 3 정착</b>조정 뒤에도 확인을 이어 가 기록 방식이 매장에 자리 잡았다</div></div>
<p>결론을 먼저 쓰고 근거를 붙이면 읽는 사람은 첫 문장에서 답을 얻습니다.</p>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>시간 순서로 쓴 서류는 끝까지 읽어야 무슨 말인지 압니다. 피라미드로 쓴 서류는 첫 문장에서 판단이 시작됩니다.</p></div>
<p class="src">참고: Barbara Minto, 『The Pyramid Principle: Logic in Writing and Thinking』</p></div><div class="pf">147</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-4</span>MECE: 근거를 겹치지도 빠지지도 않게</h2>
<p>근거를 세 개 썼는데 사실상 같은 말이라면, 근거는 하나뿐인 셈입니다. 근거를 묶는 기준이 MECE입니다.</p>
<div class="box theory"><span class="box-label">이론 노트</span><p><b>MECE</b>(Mutually Exclusive, Collectively Exhaustive)는 "서로 겹치지 않고, 합치면 빠짐이 없게" 나누라는 원칙입니다. 민토의 피라미드 원칙에서 같은 층의 근거를 구성하는 기준입니다.</p></div>
<table class="tbl"><tr><th style="width:22%">나누는 기준</th><th>나누는 방법의 예</th></tr>
<tr><td>이유</td><td>왜 이 산업 / 왜 이 회사 / 왜 이 직무 (지원동기)</td></tr>
<tr><td>시간</td><td>준비 / 실행 / 마무리 (경험의 과정)</td></tr>
<tr><td>요소</td><td>지식 / 기술 / 태도 (직무 역량)</td></tr>
<tr><td>대상</td><td>고객 / 동료 / 조직 (관계와 기여)</td></tr></table>
<div class="compare"><div class="bad">지원동기: 회사의 비전에 공감했고, 회사의 성장 가능성을 보았고, 회사의 좋은 평판을 들었습니다.</div><div class="good">지원동기: 성장하는 식품 유통 산업, 지역 거래처를 넓혀 가는 회사의 방향, 데이터로 거래처를 관리하는 영업관리 직무.</div></div>
<div class="box tip"><span class="box-label">팁</span><p>고치기 전은 세 근거가 모두 "회사" 칸에 몰려 겹치고 직무 이유가 빠졌습니다. 근거 옆에 기준 이름을 붙여 보면 겹침과 빠짐이 바로 보입니다.</p></div>
<p class="src">참고: Barbara Minto, 『The Pyramid Principle』</p></div><div class="pf">148</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-5</span>설득의 3요소를 자기소개서에</h2>
<div class="box theory"><span class="box-label">이론 노트</span><p>아리스토텔레스는 『수사학』에서 말로 설득하는 수단을 세 가지로 나누었습니다. 말하는 사람의 신뢰성인 <b>에토스(ethos)</b>, 듣는 사람의 감정에 닿는 <b>파토스(pathos)</b>, 논리와 증거인 <b>로고스(logos)</b>입니다.</p></div>
<table class="tbl"><tr><th style="width:17%">요소</th><th style="width:47%">자기소개서에서의 모습</th><th>지나치면</th></tr>
<tr><td>에토스</td><td>직접 해 본 사람만 쓸 수 있는 구체성, 확인 가능한 숫자, 문항 사이의 일관성</td><td>자격증과 직함 나열</td></tr>
<tr><td>파토스</td><td>계기가 된 한 장면, 고객이나 동료의 반응, 내가 느낀 책임</td><td>사연 위주의 감성 호소</td></tr>
<tr><td>로고스</td><td>결론과 근거의 구조, 전후 비교, 직무와의 연결</td><td>건조한 보고서</td></tr></table>
<p>제가 권하는 비율은 분명합니다. <span class="hl">로고스로 뼈대를 세우고, 에토스로 믿게 하고, 파토스는 한두 문장</span>으로 충분합니다.</p>
<div class="example"><span class="ex-label">세 요소가 함께 있는 문장</span>"설명서가 너무 어려워요"라는 어르신의 말이 계속 마음에 남았습니다(파토스). 저는 질문이 몰리는 단계 다섯 개를 골라 그림 안내지를 만들었고(에토스), 다음 수업부터 같은 질문이 눈에 띄게 줄었습니다(로고스).</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>감동적인 사연은 한 번 읽히지만, 믿을 수 있는 근거는 면접 질문으로 이어집니다.</p></div>
<p class="src">참고: 아리스토텔레스, 『수사학(Rhetoric)』</p></div><div class="pf">149</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-6</span>두괄식과 소제목 쓰기</h2>
<p>평가 문서는 결론이 먼저 나와야 합니다. 첫 문장만 읽어도 이 문단이 무슨 역량을 말하려는지 알 수 있어야 합니다. 그리고 그 첫 문장을 압축한 것이 소제목입니다.</p>
<h3>좋은 소제목의 조건</h3>
<ul><li>역량과 근거가 함께 들어 있다</li><li>이 지원자만 쓸 수 있는 구체적 단서가 있다</li><li>한 줄, 대략 15~30자 안에 끝난다</li></ul>
<table class="tbl"><tr><th style="width:50%">나쁜 소제목</th><th>좋은 소제목</th></tr>
<tr><td>[끈기의 아이콘]</td><td>[매일 30회 시험 기록으로 센서 오류의 원인을 찾다]</td></tr>
<tr><td>[소통의 중요성]</td><td>[전문 용어 대신 그림 안내문으로 고객 문의를 줄이다]</td></tr>
<tr><td>[저는 준비된 인재입니다]</td><td>[2년간 발주 기록으로 익힌 재고 감각]</td></tr>
<tr><td>[위기를 기회로]</td><td>[인원 공백을 체크리스트로 메운 실습 안내 행사]</td></tr></table>
<p>나쁜 소제목은 누구의 서류에 붙여도 말이 됩니다. 좋은 소제목은 그 사람의 경험이 아니면 쓸 수 없습니다.</p>
<div class="box warn"><span class="box-label">주의</span><p>속담, 유행어, 광고 문구를 흉내 낸 소제목은 재치 있어 보여도 정보가 없습니다. 소제목은 멋보다 정보입니다.</p></div></div><div class="pf">150</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-7</span>한 문항의 문단 설계</h2>
<p>한 문항은 대체로 다섯 덩어리로 설계하면 흔들리지 않습니다. PART 5의 STAR가 가운데에 들어가고, 앞뒤를 결론과 직무 연결이 감싸는 구조입니다.</p>
<ol class="steps">
<li><b>결론</b>문항에 대한 답을 한 문장으로. 소제목과 짝을 이룹니다.</li>
<li><b>근거 경험</b>상황과 과제를 짧게 소개합니다.</li>
<li><b>행동</b>내가 한 일과 판단의 이유. 가장 길게 씁니다.</li>
<li><b>결과</b>숫자나 전후 변화로 보여 줍니다.</li>
<li><b>직무 연결</b>그 역량이 입사 후 어디에 쓰일지 한두 문장으로.</li>
</ol>
<div class="example"><span class="ex-label">예시 원고 (일부)</span>[2년간 발주 기록으로 익힌 재고 감각] 저는 데이터를 기록해 문제를 발견하는 사람입니다. 카페에서 일할 때 주말마다 같은 메뉴가 품절되었습니다. 저는 4주 동안 요일별 판매량을 직접 기록해 점장님께 주말 발주량 조정을 제안했고, 이후 주말 품절이 거의 사라졌습니다. 이 습관을 살려 영업관리 직무에서 거래처별 판매 흐름을 먼저 읽는 사원이 되겠습니다.</div>
<div class="box key"><span class="box-label">핵심</span><p>첫 문장과 마지막 문장만 이어 읽어도 말이 되는지 확인하세요. 그렇다면 문단의 뼈대가 바로 선 것입니다.</p></div></div><div class="pf">151</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-8</span>문장 원칙 네 가지</h2>
<p>문장은 꾸밀수록 읽기 어려워집니다. 제가 첨삭할 때 가장 많이 쓰는 빨간 펜은 "줄이세요"입니다.</p>
<div class="cards"><div class="card"><b>짧게</b>한 문장은 두 줄을 넘지 않게. 길어지면 마침표로 끊습니다.</div><div class="card"><b>능동으로</b>"되었다"보다 "했다". 주어는 "저"입니다.</div><div class="card"><b>구체적으로</b>형용사 대신 행동, 숫자, 장면을 씁니다.</div><div class="card"><b>한 문장 한 생각</b>"그리고", "또한"으로 생각을 이어 붙이지 않습니다.</div></div>
<div class="compare stack"><div class="bad">팀 프로젝트를 진행하면서 다양한 의견 차이가 발생하게 되었지만 팀원들과의 지속적인 소통을 통해 원만하게 해결될 수 있었고 이를 통해 협업의 중요성을 깨닫게 되었습니다.</div>
<div class="good">팀 프로젝트에서 주제를 두고 의견이 둘로 갈렸습니다. 저는 두 안의 장단점을 표로 정리해 회의에 올렸습니다. 팀은 그 표를 보고 30분 만에 한 안으로 합의했습니다.</div></div>
<h3>자주 고치는 표현</h3>
<table class="tbl"><tr><th style="width:50%">이렇게 쓰지 말고</th><th>이렇게</th></tr>
<tr><td>~하게 되었습니다</td><td>~했습니다</td></tr>
<tr><td>~을 통해 ~을 배울 수 있었습니다</td><td>그 뒤로 저는 ~합니다</td></tr>
<tr><td>다양한, 많은, 열심히</td><td>몇 가지, 몇 명, 무엇을 몇 번</td></tr></table></div><div class="pf">152</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-9</span>문단 하나를 만드는 연습</h2>
<p>기계공학과 준호 씨가 "원칙을 지켜 일한 경험" 문항을 개요, 초고, 수정의 세 단계로 쓴 과정입니다.</p>
<div class="example"><span class="ex-label">1단계 개요 (피라미드로 뼈대 세우기)</span>결론: 절차의 빈틈을 넘기지 않는다 / 경험: 6주 현장실습, 설비 일일 점검 보조 / 행동: 점검표의 빠진 항목 발견, 기록과 매뉴얼 대조, 보고 / 결과: 점검표에 항목 추가 / 연결: 생산기술 직무의 설비 관리</div>
<div class="compare stack"><div class="bad">[2단계 초고] 저는 현장실습을 하면서 안전의 중요성을 많이 느끼게 되었습니다. 설비 점검을 하다가 점검표에 빠진 부분이 있다는 것을 알게 되었고 담당자님께 말씀드려서 보완하게 되었습니다. 앞으로도 안전을 최우선으로 생각하겠습니다.</div>
<div class="good">[3단계 수정] 저는 절차의 빈틈을 그냥 넘기지 않습니다. 6주간의 현장실습에서 설비 일일 점검을 보조하던 중, 냉각수 밸브 확인 항목이 점검표에 없다는 것을 발견했습니다. 지난 2주의 점검 기록과 설비 매뉴얼을 대조해 정리한 뒤 담당 대리님께 보고했고, 다음 주 점검표에 그 항목이 추가되었습니다. 생산기술 직무에서도 기록과 기준을 맞대어 보는 습관으로 설비 관리의 빈틈을 줄이겠습니다.</div></div>
<h3>수정에서 바뀐 세 가지</h3>
<ul><li><b>결론을 맨 앞으로</b> "느꼈다"로 시작하던 글이 주장으로 시작합니다.</li><li><b>막연한 말을 구체로</b> "빠진 부분"이 "냉각수 밸브 확인 항목"이 되었습니다.</li><li><b>되었다를 했다로</b> 행동의 주어가 분명한 "저"가 되었습니다.</li></ul></div><div class="pf">153</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-10</span>글자 수 관리</h2>
<p>글자 수 제한은 그 자체로 하나의 평가 기준입니다. 제한을 크게 남기면 성의가 없어 보이고, 넘기면 제출이 되지 않습니다. 저는 <span class="hl">제한의 90% 안팎</span>을 목표로 쓰라고 권합니다. 대부분 공백 포함 기준이지만, 회사마다 다르니 입력 화면의 안내를 먼저 확인하세요.</p>
<table class="tbl"><tr><th style="width:22%">구성</th><th style="width:26%">500자 문항</th><th style="width:26%">700자 문항</th><th>1000자 문항</th></tr>
<tr><td>소제목+결론</td><td>60자 안팎</td><td>80자 안팎</td><td>100자 안팎</td></tr>
<tr><td>상황·과제</td><td>80자 안팎</td><td>100자 안팎</td><td>150자 안팎</td></tr>
<tr><td>행동</td><td>200자 안팎</td><td>300자 안팎</td><td>450자 안팎</td></tr>
<tr><td>결과</td><td>80자 안팎</td><td>110자 안팎</td><td>150자 안팎</td></tr>
<tr><td>직무 연결</td><td>60자 안팎</td><td>90자 안팎</td><td>130자 안팎</td></tr></table>
<p class="small">위 배분은 제 수업에서 쓰는 출발점일 뿐 정답이 아닙니다. 문항 성격에 따라 조정하되, 행동이 가장 큰 칸이라는 원칙은 지키세요.</p>
<h3>넘칠 때 줄이는 순서</h3>
<ol><li>상황 설명 중 문항과 상관없는 배경</li><li>같은 뜻을 반복하는 문장</li><li>"~하게 되었습니다" 같은 늘어진 어미</li></ol>
<div class="box tip"><span class="box-label">팁</span><p>1000자 문항이라고 경험을 두 개 넣을 필요는 없습니다. 하나의 경험을 깊게 쓰는 편이 대개 더 설득력 있습니다.</p></div></div><div class="pf">154</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-11</span>공기업 자소서와 사기업 자소서</h2>
<p>공기업과 사기업에 함께 지원하는 학생이 많지만, 같은 경험이라도 두 서류는 <b>평가 기준과 강조점</b>이 다릅니다.</p>
<table class="tbl"><tr><th style="width:15%">구분</th><th style="width:47%">공기업·공공기관</th><th>사기업</th></tr>
<tr><td>평가 기준</td><td>NCS 직무기술서의 직업기초능력·직무수행능력</td><td>회사 인재상과 직무 역량</td></tr>
<tr><td>강조 가치</td><td>공공성, 직업윤리, 절차 준수, 국민 서비스</td><td>성과, 도전, 사업 이해, 경쟁력</td></tr>
<tr><td>지원동기</td><td>기관의 설립 목적, 주요 사업과 내 역량</td><td>사업 방향과 제품, 나의 기여</td></tr>
<tr><td>경험 서술</td><td>직무 관련성, 과정의 정당성, 협력</td><td>결과의 크기와 차별성, 주도성</td></tr>
<tr><td>조사 자료</td><td>채용 공고, 직무기술서, 공공기관 경영정보 공개시스템(알리오)</td><td>인재상, 사업보고서, 보도자료</td></tr></table>
<h3>같은 경험, 다른 첫 문장</h3>
<div class="example"><span class="ex-label">공기업 버전</span>저는 정해진 절차 안에서 더 나은 방법을 찾는 사람입니다. 점장님의 승인을 받아 4주간 판매 기록을 남기고, 그 근거로 발주 기준을 바꾸었습니다.</div>
<div class="example"><span class="ex-label">사기업 버전</span>저는 숫자로 매출 손실을 찾아내는 사람입니다. 4주간 요일별 판매량을 분석해 주말 품절로 놓치던 판매를 되살렸습니다.</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>공공기관 서류에서는 성과만큼 "과정이 정당했는가"를, 사기업 서류에서는 "무엇이 나아졌는가"를 먼저 봅니다.</p></div></div><div class="pf">155</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-12</span>블라인드 채용 유의사항</h2>
<p>공공기관을 중심으로 블라인드 채용이 자리 잡았고, 민간 기업도 직무와 무관한 개인정보를 묻지 않는 흐름이 넓어졌습니다. 「채용절차의 공정화에 관한 법률」도 구직자의 출신 지역, 가족의 학력·직업·재산 같은 직무와 무관한 정보를 요구하지 못하도록 정하고 있습니다. 블라인드 채용 서류에서 이런 정보가 드러나면 <span class="hl">감점이나 불이익 사유</span>로 안내하는 경우가 많습니다.</p>
<h3>드러내지 말아야 할 정보</h3>
<div class="cards c3"><div class="card"><b>학교</b>학교명, 학교를 짐작할 수 있는 별칭이나 캠퍼스명</div><div class="card"><b>가족</b>부모님 직업, 가족의 직장이나 학력</div><div class="card"><b>개인 신상</b>출신 지역, 나이, 신체 조건, 혼인 여부</div></div>
<div class="compare"><div class="bad">○○대학교 기계공학과에서 아버지의 권유로 엔지니어의 꿈을 키웠습니다.</div><div class="good">기계공학을 전공하며 3학년 캡스톤디자인에서 자동 분류 장치를 직접 설계했습니다.</div></div>
<p>전공, 수강 과목, 프로젝트 내용은 직무 역량을 보여 주는 정보이므로 써도 됩니다. 헷갈릴 때는 "이 정보가 직무 수행 능력과 관련이 있는가"를 기준으로 판단하세요.</p>
<div class="box warn"><span class="box-label">주의</span><p>동아리 이름, 교내 대회명, 지도교수 이름에 학교명이 들어가는 경우를 자주 놓칩니다. "교내 창업 동아리"처럼 일반 명칭으로 바꾸세요.</p></div></div><div class="pf">156</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-13</span>면접관이 지치는 흔한 실수 10가지</h2>
<p>제가 서류를 읽다가 집중력을 잃는 순간은 대부분 비슷합니다. 아래 열 가지는 내용이 좋아도 읽는 사람을 지치게 만듭니다.</p>
<table class="tbl"><tr><th style="width:7%">No</th><th style="width:40%">실수</th><th>읽는 사람의 속마음</th></tr>
<tr><td>1</td><td>"저는 ~에서 태어나" 식의 출생 서두</td><td>문항이 묻는 것은 그게 아닌데</td></tr>
<tr><td>2</td><td>결론 없이 시간 순서로 나열</td><td>그래서 하고 싶은 말이 뭐지</td></tr>
<tr><td>3</td><td>명언, 속담으로 시작</td><td>지원자 이야기는 언제 나오나</td></tr>
<tr><td>4</td><td>"우리 팀은"만 있고 "저는"이 없음</td><td>본인은 무엇을 했나</td></tr>
<tr><td>5</td><td>형용사만 있고 행동이 없음</td><td>증거가 없다</td></tr>
<tr><td>6</td><td>문항과 다른 경험을 끼워 넣음</td><td>준비한 글을 재활용했구나</td></tr>
<tr><td>7</td><td>회사 칭찬만 길게 나열</td><td>홈페이지에 있는 내용이다</td></tr>
<tr><td>8</td><td>줄임말, 신조어, 이모티콘</td><td>공식 문서라는 감각이 없다</td></tr>
<tr><td>9</td><td>맞춤법·띄어쓰기 오류 반복</td><td>업무 문서도 이렇게 쓸까</td></tr>
<tr><td>10</td><td>"열심히 하겠습니다"로만 끝맺음</td><td>무엇을, 어떻게?</td></tr></table>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>하나하나는 사소해 보여도 두세 개가 겹치면 내용을 끝까지 읽기 어렵습니다. 제출 전 이 표를 옆에 두고 원고를 점검해 보세요.</p></div></div><div class="pf">157</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 6 · 자기소개서 작성 원리</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">6-14</span>복사·붙여넣기 지원의 위험</h2>
<p>여러 회사에 지원하다 보면 잘 쓴 원고를 다른 회사에 그대로 옮기고 싶어집니다. 경험 부분은 다듬어 다시 쓸 수 있습니다. 문제는 <span class="hl">회사와 직무에 맞춘 부분까지 그대로 옮길 때</span> 생깁니다.</p>
<p>제가 면접관으로 서류를 볼 때 가장 안타까운 경우가 다른 회사 이름이 그대로 남아 있는 서류입니다. 내용이 아무리 좋아도 그 순간 "우리 회사에 진심인가"라는 의문이 생깁니다. 회사명뿐 아니라 사업 분야, 제품명, 인재상 단어가 다른 회사 것으로 남아 있는 경우도 자주 봅니다.</p>
<h3>원고를 재사용할 때 반드시 바꿀 것</h3>
<ul class="checks"><li>회사명, 계열사명, 브랜드명, 제품명</li><li>인재상, 핵심가치 등 회사 고유의 단어</li><li>지원 직무명과 직무 연결 문장</li><li>입사 후 포부의 사업 분야와 목표</li><li>문항 번호와 글자 수 제한에 맞춘 분량</li></ul>
<div class="box tip"><span class="box-label">팁</span><p>원고를 옮긴 뒤에는 이전 회사의 이름과 핵심 단어를 문서 검색 기능으로 찾아보세요. 눈으로 훑는 것보다 확실합니다. 마지막에는 소리 내어 한 번 읽어 보는 것이 좋습니다.</p></div>
<div class="box warn"><span class="box-label">주의</span><p>지원 마감 직전에 여러 회사 서류를 한꺼번에 내면 이런 실수가 늘어납니다. 회사별로 제출 날짜를 나누어 계획하세요.</p></div></div><div class="pf">158</div></div></div>

<p>PART 5에서 경험을 이야기로 바꾸었다면, 이 장에서는 그 이야기를 평가받는 글로 바꾸는 원리를 익혔습니다. PART 7에서 문항별로 원고를 쓸 때 아래 원칙을 기준으로 삼으세요.</p>

<div class="page"><div class="pg opener"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><div class="chap-no">PART 7</div>
<h1>문항마다<br>묻는 것이 다르다</h1>
<p class="lead">같은 경험도 어느 문항에 쓰느냐에 따라 보여 줄 면이 달라집니다. 이 장에서는 자주 나오는 일곱 문항을 하나씩 열어 쓰고, 이어서 공기업의 직업기초능력형 문항과 사기업 유형별 강조점, 글자 수에 맞춘 압축과 확장까지 다룹니다.</p>
<ul class="chap-list"><li>01 지원동기·성장과정·성격의 장단점</li><li>02 직무역량·협업과 갈등 해결</li><li>03 실패·도전 극복과 입사 후 포부</li><li>04 공기업 자기소개서와 직업기초능력형 문항</li><li>05 사기업 유형별 강조점</li><li>06 300자, 500자, 1000자로 쓰기</li></ul>
<div class="chap-bar"></div></div><div class="pf">163</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-1</span>지원동기: 왜 하필 이곳인가</h2>
<p>지원동기 문항에서 면접관이 확인하는 것은 단순합니다. <span class="hl">"이 사람은 우리 회사와 이 직무를 왜 골랐는가, 그 이유가 이 사람의 경험과 이어져 있는가."</span> 회사를 칭찬하는 글이 아니라, 나와 회사가 만나는 지점을 보여 주는 글입니다.</p>
<p>제가 서류를 읽으며 가장 먼저 하는 일은 회사 이름을 손으로 가려 보는 것입니다. 이름을 가려도 그대로 말이 되는 지원동기라면, 그 글은 어느 회사에 내도 되는 글입니다.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>계기</b>이 산업·직무에 관심을 갖게 된 나의 구체적 경험</li>
<li><b>이 회사인 이유</b>사업·제품·일하는 방식 중 나를 끌어당긴 것 1~2가지</li>
<li><b>준비</b>그 일을 하기 위해 내가 해 온 것</li>
<li><b>기여</b>입사 후 어느 자리에서 무엇을 보탤지</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>"어릴 때부터 꿈이었습니다"로 시작해 근거 없이 끝나는 글</li><li>홈페이지 인재상 문구를 그대로 옮겨 적은 글</li><li>다른 회사에 냈던 글의 회사명을 미처 고치지 못한 글</li></ul></div>
<p class="small">재료는 이미 준비되어 있습니다. WORKSHEET 4-4를 펼쳐, 적어 둔 지원동기 재료 중 가장 구체적인 두 가지를 고르세요.</p></div><div class="pf">164</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>지원동기, 고치기 전과 후</h2>
<p>경영학과 4학년 지민이 식품 회사 영업관리 직무에 낸 초안입니다.</p>
<div class="compare stack"><div class="bad">저는 어릴 때부터 OO식품의 과자를 먹으며 자랐고, 국민에게 사랑받는 기업에서 일하고 싶다는 꿈을 키웠습니다. 귀사는 업계를 선도하는 기업으로 고객 중심 경영을 실천하고 있습니다. 입사하게 된다면 열정과 성실함으로 회사 발전에 이바지하겠습니다.</div>
<div class="good">[매대 한 칸에서 시작된 관심] 편의점 아르바이트를 하며 같은 과자도 진열 위치에 따라 판매량이 달라진다는 것을 알았습니다. 점장님께 허락을 받아 2주간 진열을 바꿔 가며 판매 수를 기록했고, 눈높이 칸으로 옮긴 제품의 판매가 눈에 띄게 늘었습니다. 이때 만드는 것만큼 파는 구조가 중요하다는 것을 배웠습니다.<br>OO식품을 지원한 이유는 지역 소형 매장까지 직접 관리하는 영업 방식 때문입니다. 대리점 실무자 인터뷰 기사에서 매장별 진열 제안서를 만든다는 내용을 읽고, 제가 해 본 일이 현장에서 실제 업무가 된다는 것을 확인했습니다. 입사 후에는 담당 매장의 판매 기록을 꾸준히 쌓아, 매장마다 맞는 진열 제안을 하는 영업관리자가 되겠습니다.</div></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>고친 글에는 "꿈", "선도", "열정"이 하나도 없습니다. 대신 매대, 2주, 진열 제안서가 있습니다. 면접에서 제가 이어서 물을 거리가 생긴 글이 좋은 지원동기입니다.</p></div></div><div class="pf">165</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-2</span>성장과정·가치관: 지금의 나를 만든 장면</h2>
<p>성장과정 문항은 자서전을 요구하는 것이 아닙니다. 면접관이 알고 싶은 것은 <span class="hl">이 사람이 무엇을 중요하게 여기고, 그 기준이 지금 어떤 행동으로 나타나는가</span>입니다. 결국 "우리 조직에서 어떤 방식으로 일할 사람인가"를 미리 보려는 질문입니다.</p>
<p>그래서 출생지와 가족 소개로 첫 단락을 채우면 손해입니다. 가치관 하나를 먼저 말하고, 그것이 생긴 장면 하나와 최근에 드러난 장면 하나를 보여 주면 충분합니다.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>가치관 한 문장</b>나를 움직이는 기준을 첫 줄에 씁니다</li>
<li><b>형성 장면</b>그 기준이 생긴 구체적 사건 하나</li>
<li><b>최근의 행동</b>대학 시절 그 기준대로 움직인 장면</li>
<li><b>일과의 연결</b>그 기준이 지원 직무에서 어떻게 쓰일지</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>"화목한 가정에서 태어나"로 시작하는 연대기</li><li>부모님의 훌륭함만 남고 나의 행동은 없는 글</li><li>정직, 성실 같은 단어만 있고 장면이 없는 가치관</li></ul></div>
<p class="small">WORKSHEET 2-x에서 찾은 가치관 키워드와 라이프라인의 높은 점, 낮은 점을 다시 보세요.</p></div><div class="pf">167</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>성장과정, 완성 예문</h2>
<p>간호학과 4학년 서연이 병원 간호직에 낸 글입니다. 가치관 하나가 두 장면을 꿰고 있는지 보세요.</p>
<div class="example"><span class="ex-label">예문 · 성장과정 및 가치관</span>
[기록은 다음 사람과의 약속입니다] 저는 내가 남긴 기록이 다음 사람의 일을 결정한다고 믿습니다. 이 생각은 할머니를 간병하던 고등학생 때 생겼습니다. 가족이 돌아가며 곁을 지켰는데, 약을 언제 드렸는지 서로 몰라 두 번 드릴 뻔한 일이 있었습니다. 그날 저는 냉장고에 시간표를 붙이고 투약할 때마다 시간과 이름을 적게 했고, 그 뒤로 같은 일은 생기지 않았습니다.<br>
대학에서도 이 기준은 그대로였습니다. 실습 중 인수인계 메모가 사람마다 달라 빠지는 내용이 생기는 것을 보고, 동기들과 활력징후, 특이사항, 다음 확인 시간을 같은 순서로 쓰는 양식을 만들어 실습 기간 내내 사용했습니다. 담당 선생님께 인계가 짧고 분명해졌다는 말씀을 들었습니다.<br>
병동 간호는 교대로 이어지는 일입니다. 제가 남긴 기록 한 줄이 다음 근무자의 판단이 된다는 마음으로, 정확하게 쓰고 정확하게 넘기는 간호사가 되겠습니다.</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>이 글에는 어린 시절 이야기가 한 단락뿐입니다. 그런데도 성장과정이 선명합니다. 과거 한 장면, 현재 한 장면, 그리고 그 둘을 잇는 기준 하나. 이 세 가지면 충분합니다.</p></div></div><div class="pf">168</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-3</span>성격의 장단점: 나를 얼마나 정확히 아는가</h2>
<p>장단점 문항은 성격 검사가 아니라 <span class="hl">자기 객관화 능력</span>을 보는 문항입니다. 면접관은 장점이 화려한지보다, 단점을 알고 그것을 다루는 방법을 갖고 있는지를 봅니다. 일하다 보면 누구나 약점이 드러나는데, 그때 스스로 손볼 줄 아는 사람인지가 궁금한 것입니다.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>장점과 장면</b>장점 하나를 한 단어로 말하고 증명 장면을 붙입니다</li>
<li><b>단점의 실제 모습</b>그 단점이 어떤 상황에서 어떤 문제를 만들었는지</li>
<li><b>보완 행동</b>지금 하고 있는 구체적인 습관이나 장치</li>
<li><b>변화</b>보완한 뒤 달라진 결과</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>"완벽주의라 너무 꼼꼼한 것이 단점"처럼 장점을 포장한 단점</li><li>회계 지원자의 "덜렁댐"처럼 직무에 치명적인 단점을 보완 없이 쓰는 것</li><li>장점을 서너 개 나열해 하나도 기억에 남지 않는 글</li></ul></div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>저는 단점을 읽으면 "그래서 지금은 어떻게 하나요?"라고 묻습니다. 여기서 답이 막히면 그 단점은 고친 것이 아니라 꾸민 것입니다.</p></div></div><div class="pf">170</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>장단점, 고치기 전과 후</h2>
<p>기계공학과 4학년 준호가 생산기술 직무에 낸 초안입니다.</p>
<div class="compare stack"><div class="bad">저의 장점은 책임감, 성실함, 친화력입니다. 맡은 일은 끝까지 해내며 누구와도 잘 어울립니다. 단점은 일을 너무 완벽하게 하려다 보니 가끔 시간이 오래 걸린다는 것입니다. 하지만 이것도 결과물의 질을 높이는 장점이 될 수 있다고 생각합니다.</div>
<div class="good">[끝까지 원인을 찾는 사람] 저의 장점은 문제가 반복되면 원인을 끝까지 추적한다는 것입니다. 캡스톤 설계에서 시제품 모터가 자꾸 멈췄을 때, 부품을 하나씩 바꿔 가며 시험 기록표를 만들었고 배선 피복 손상이 원인임을 찾아 일정 안에 시연을 마쳤습니다.<br>단점은 한 가지에 몰두하면 전체 일정을 놓친다는 것입니다. 같은 과제에서 원인 추적에 시간을 쓰느라 보고서 초안을 팀원보다 늦게 넘긴 적이 있습니다. 이후로는 작업을 시작할 때 "여기까지만 보고 공유한다"는 중간 마감을 먼저 정하고, 그 시점에 결과가 없어도 진행 상황을 팀에 알립니다. 다음 학기 프로젝트에서는 중간 공유 덕분에 팀원과 원인 추적을 나눠 맡아 시간을 줄일 수 있었습니다.</div></div>
<div class="box key"><span class="box-label">핵심</span>
<p>좋은 장단점 글은 장점과 단점이 같은 뿌리에서 나옵니다. "끝까지 파고든다"는 장점이 "일정을 놓친다"는 단점이 되는 것처럼요. 그래야 진짜 내 이야기로 읽힙니다.</p></div></div><div class="pf">171</div></div></div>

<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2><span class="no">7-4</span>직무역량·전문성: 바로 쓸 수 있는 사람인가</h2>
<p>이 문항은 면접관이 가장 꼼꼼히 읽는 문항입니다. 질문은 하나입니다. <span class="hl">"이 직무에 필요한 것을 이 사람은 실제로 해 본 적이 있는가."</span> 아는 것보다 해 본 것, 배운 것보다 써 본 것이 점수가 됩니다.</p>
<p>WORKSHEET 3-x의 필요 역량 중 증거가 있는 두 가지를 고르세요.</p>
<h3>구성 틀</h3>
<ol class="steps">
<li><b>역량 정의</b>이 직무에 필요한 역량을 내 말로 한 문장</li>
<li><b>증거 1</b>첫째 역량을 보여 주는 STAR 에피소드 압축</li>
<li><b>증거 2</b>둘째 역량, 가능하면 다른 종류의 경험</li>
<li><b>현업 적용</b>그 역량을 입사 후 어떤 업무에 쓸지</li>
</ol>
<div class="box warn"><span class="box-label">자주 하는 실수</span>
<ul><li>자격증과 수강 과목을 나열하고 끝나는 글</li><li>"전문성을 갖추기 위해 노력했습니다"처럼 무엇을 했는지 없는 글</li><li>직무와 상관없는 경험을 억지로 끌어온 글</li></ul></div>
<div class="box tip"><span class="box-label">팁</span>
<p>자격증 뒤에는 그것으로 해 본 일을 한 문장 붙이세요.</p></div></div><div class="pf">173</div></div></div>
<div class="page"><div class="pg"><div class="rh"><span>PART 7 · 문항별 작성법</span><span>합격을 설계하는 자기소개서</span></div><div class="pc"><h2>직무역량, 완성 예문</h2>
<p>통계학과 4학년 현우가 유통 회사 데이터 분석 직무에 낸 글입니다.</p>
<div class="example"><span class="ex-label">예문 · 직무역량</span>
[숫자를 결정으로 바꾸는 분석] 데이터 분석가에게 필요한 것은 분석 기술보다 질문을 정하는 힘이라고 생각합니다. 저는 이 힘을 두 번의 경험으로 길렀습니다.<br>
첫째, 학과 공모전에서 지역 상권 데이터를 다뤘습니다. 처음에는 변수를 모두 넣은 모델을 만들었지만 결과를 설명할 수 없었습니다. 그래서 "어떤 가게가 왜 1년을 못 버티는가"로 질문을 좁히고, 개업 시기와 유동 인구만 남겨 다시 분석했습니다. 이 보고서로 장려상을 받았습니다.<br>
둘째, 학교 카페 아르바이트에서 매주 버려지는 빵이 많다는 것을 보고, 석 달 치 판매 기록을 엑셀로 정리해 요일별 발주량을 제안했습니다. 점장님이 이를 받아들여 폐기량이 이전보다 줄었습니다.<br>
입사 후에는 매장 판매 데이터에서 현장이 바로 쓸 수 있는 질문을 먼저 세우고, 발주와 진열 결정에 도움이 되는 분석을 하겠습니다.</div>
<div class="box interviewer"><span class="box-label">면접관의 한마디</span>
<p>두 경험의 무게가 다릅니다. 하나는 공모전, 하나는 아르바이트입니다. 그런데 둘 다 "질문을 정했다"는 같은 역량을 보여 줍니다. 경험의 크기보다 역량의 일관성이 설득력을 만듭니다.</p></div></div><div class="pf">174</div></div></div>
